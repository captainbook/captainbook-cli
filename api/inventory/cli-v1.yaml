  /resource-calendar:
    get:
      operationId: listResourceCalendar
      summary: List a resource's busy time
      description: |
        Busy intervals for one or more resources over a date window: confirmed
        bookings, synced Google Calendar time, and operator-created blocks.

        `resource_id` is REQUIRED and accepts several ids, so one call answers a
        roster-wide question. It is the only required query parameter on a CLI
        list route; sending it empty is a 422 rather than an unfiltered page.

        BUSY INTERVALS ONLY. This reports when a resource is occupied, never
        when it is free, and an empty page is NOT proof of availability — see
        `unavailable_resources`, which names every reason an answer is empty or
        partial (no linked user, Google not connected, the sync token reset, the
        window reaching past what is mirrored, or booking visibility narrowed by
        the caller's own permissions). When that key is present, treat the
        answer as incomplete for the resources it names.

        Equipment is refused by category with a 422: it holds no calendar of its
        own and is assigned to a booking alongside a guide or asset.

        ORDERING is stable and total, and chronological within a single
        timezone. Across products in DIFFERENT timezones two events up to one
        zone-offset apart may interleave; every row's own timestamps are correct
        regardless, because each is normalised in its own product's zone. A
        client needing strict chronology across zones should sort after
        collecting pages.

        `schedules_covered` is a PREVIEW capped at 20 entries, never the
        authoritative answer to whether a block applies to a given schedule.
        Use `product_option_id` for that; `schedules_count` carries the true
        total and `schedules_truncated` flags the cut.
      tags: [Resources]
      parameters:
        - name: resource_id
          in: query
          required: true
          description: |
            One or more resource ids. Comma-separated over HTTP
            (`?resource_id=7,9`), or a JSON array over MCP. At most 10 per call.
          schema: { type: string, example: "7,9" }
        - name: from
          in: query
          description: |
            Start of the window, a bare `YYYY-MM-DD` day in the tenant's
            calendar. Omit both bounds for today through today+30; supply one and
            the other is implied 30 days away. The window spans at most 92 days.
          schema: { type: string, format: date }
        - name: to
          in: query
          description: End of the window. Must not precede `from`.
          schema: { type: string, format: date }
        - name: event_types
          in: query
          description: |
            Narrow to some of the three families. Comma-separated or a JSON
            array; omitted means all three. A `busy`-only response omits
            bookings entirely and therefore proves even less about availability.
          schema: { type: string, enum: [booking, busy, unavailable], example: "busy,unavailable" }
        - name: product_option_id
          in: query
          description: |
            Narrow to one schedule. This affects ALL THREE families, not only
            blocks, and each differently:

            - BOOKINGS are narrowed to departures on this schedule, so a
              booking on a sibling schedule is dropped from the page.
            - BLOCKS are narrowed to this schedule, PLUS any block that applies
              to every schedule (a block with no schedule of its own).
            - SYNCED GOOGLE TIME is NOT narrowed. A calendar event carries no
              schedule; it is not about one, it is time the resource is
              unavailable for any of them. Filtering it away would report the
              resource free for this schedule while its own calendar disagrees.

            So this is the authoritative way to ask whether a block stops a
            particular trip, but the response is not "everything about this
            schedule" — it is still every reason this resource is busy, with
            the schedule-specific reasons narrowed.
          schema: { type: integer, minimum: 1 }
        - name: limit
          in: query
          description: |
            Page size, 1-25, default 25. Lower than other list endpoints
            because a row carries two timestamp pairs and a schedule list.
          schema: { type: integer, minimum: 1, maximum: 25, default: 25 }
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Page of busy intervals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceCalendarPage"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

