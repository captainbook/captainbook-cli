              type: array
              items: { $ref: "#/components/schemas/Category" }

    ResourceCalendarPage:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/ResourceCalendarEvent" }
            unavailable_resources:
              type: object
              description: |
                Present ONLY when at least one requested resource's answer is
                empty or partial, keyed by resource id. Its absence means every
                requested resource was answered completely; its presence means
                the page is not the whole story for the ids it names.
              additionalProperties:
                type: array
                items:
                  type: string
                  enum:
                    - no_linked_user
                    - calendar_not_connected
                    - calendar_sync_reset
                    - window_exceeds_coverage
                    - bookings_restricted_to_own

    ResourceCalendarEvent:
      type: object
      properties:
        resource_id: { type: string }
        resource_name:
          type: [string, "null"]
          description: Truncated to 180 encoded bytes for the wire; read-time value, not canonical.
        resource_category:
          # `null` is a real null, not the string "null": an enum is validated
          # INDEPENDENTLY of `type`, so a null the union admits would otherwise
          # be refused by an enum that does not list it.
          type: [string, "null"]
          enum: [guide, asset, auxiliary, null]
        event_type:
          type: string
          enum: [booking, busy, unavailable]
          description: |
            `booking` a confirmed booking this resource is assigned to;
            `busy` synced Google Calendar time; `unavailable` an operator block.
        source: { type: string, enum: ["CaptainBook", "Google Calendar"] }
        status:
          type: string
          description: |
            Normalised label. For a synced Google event this is always "Busy" --
            the event's own title is the guide's private calendar entry and is
            never published. An operator block shows its own note.
        all_day:
          type: boolean
          description: |
            DERIVED, not stored, and always false for a booking. A timed span of
            exactly 24 or 48 hours reports true, and durations from 24h00m to
            24h59m all read as all-day because the hour count is truncated. A
            multi-day all-day block crossing a DST transition is 71 or 73 elapsed
            hours and therefore reports FALSE despite being all-day.
        starts_at:
          type: [string, "null"]
          format: date-time
          description: |
            ISO 8601 with offset. A booking is relabelled in its own PRODUCT's
            timezone (the slot is wall clock); a busy or unavailable row is
            converted from its UTC instant into the tenant's timezone.
        ends_at: { type: [string, "null"], format: date-time }
        occupied_from:
          type: [string, "null"]
          format: date-time
          description: |
            `starts_at` padded by the resource's prep time. Equal to `starts_at`
            on a busy or unavailable row, which has no product option and
            therefore no buffer.
        occupied_to: { type: [string, "null"], format: date-time }
        booking_id: { type: [string, "null"] }
        product_id:
          type: [string, "null"]
          description: What was SOLD. Booking rows only.
        product_option_id: { type: [string, "null"] }
        applies_to_schedule:
          type: [string, "null"]
          description: |
            The schedule a BLOCK narrows to, or null when it blocks every
            schedule. A different fact from `product_id`, deliberately not
            sharing its name.
        schedules_covered:
          type: [array, "null"]
          items: { type: string }
          description: Preview, capped at 20. Not authoritative -- use `product_option_id`.
        schedules_count: { type: [integer, "null"], description: True number of schedules the block covers. }
        schedules_truncated: { type: [boolean, "null"] }

    ResourcePage:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/Resource" }

    LocationPage:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/Location" }

    MediaPage:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/Media" }

    CreateProductRequest:
      type: object
      required: [title, currency]
      description: |
        Mirrors `CreateProductRequest::rules()`. `product_code` is optional —
        when omitted, the server auto-generates one from the title slug plus
        a random suffix (`SUNSET-SAILING-TOUR-AB12CD`) **on the real write
        only**. A `dry_run` returns `product_code: null` rather than a code the
        commit will not use: the value is minted per request, so previewing one
        would both promise the caller an identifier the write then replaces and
        make two dry runs of the same payload disagree. `description` is
        optional on the wire but is materialized as `{"en": ""}` server-side
        when omitted, because `central_products.description` is NOT NULL.
        Translatable text fields (`description`, `instructions`,
        `requirements`, `inclusions`, `exclusions`) accept bare strings;
        the server wraps them into the `{"en": "..."}` HasTranslations bag.
        `description`, `instructions`, and `requirements` are rich-text
        (HTML accepted). `inclusions` and `exclusions` are plain text — the
        server rejects payloads containing HTML tags with 422; use a newline
        between each bullet item.

        Every text field below is capped and a larger value is rejected with
        422. The cap is about embedded binaries, not prose: an image pasted
        into the dashboard's editor arrives as an inline base64 data URI, and
        the product edit page renders each of these fields twice, so a single
        2.5 MB screenshot produced a 7.4 MB response the platform refused to
        serve — leaving the operator unable to open the page and undo it.

        The limit is 64 KiB (65,535 BYTES) and it satisfies two constraints at
        once: three of these fields mirror into marketplace `TEXT` columns of
        exactly that width on a non-strict database, which would otherwise
        truncate a longer value mid-UTF-8 silently; and six fields at this cap
        render to a 3.4 MB dashboard page in the worst case, measured with the
        character that costs most after escaping.

        Measured in BYTES. `maxLength` here is a character count, so for
        non-ASCII text the server may refuse a value this schema accepts —
        validate on byte length if you gate locally.
      properties:
        title: { type: string, maxLength: 200 }
        product_code: { type: [string, "null"], maxLength: 50, description: "Tenant-supplied SKU. Auto-generated from title when omitted, on the real write only — a dry run echoes null." }
        description: { type: [string, "null"], maxLength: 65535, description: "Defaults to empty string server-side when omitted (central_products.description is NOT NULL). Capped at 64 KiB (65,535 BYTES); a larger value is rejected with 422." }
        instructions: { type: [string, "null"], maxLength: 65535, description: "Rich text shown to confirmed customers. Translatable. Capped at 64 KiB (65,535 BYTES); a larger value is rejected with 422." }
        requirements: { type: [string, "null"], maxLength: 65535, description: "Rich text — what the customer needs. Translatable. Capped at 64 KiB (65,535 BYTES); a larger value is rejected with 422." }
        inclusions: { type: [string, "null"], maxLength: 65535, description: "Plain text — what's included. One bullet per newline. Translatable. NOT rich-text — payloads containing HTML tags are rejected with 422. Capped at 64 KiB (65,535 BYTES); a larger value is rejected with 422." }
        exclusions: { type: [string, "null"], maxLength: 65535, description: "Plain text — what's not included. One bullet per newline. Translatable. NOT rich-text — payloads containing HTML tags are rejected with 422. Capped at 64 KiB (65,535 BYTES); a larger value is rejected with 422." }
        status:
          type: string
          enum: [draft, published]
          default: draft
          description: "Translates to the underlying `is_active` boolean."
        schedule_type:
          type: string
          enum: [date, datetime]
          description: "`date` for date-only products; `datetime` for products with a starting time."
        delivery_method:
          type: string
          enum: [TICKET, VOUCHER]
          default: VOUCHER
          description: "\"Ticket type\". `VOUCHER` = one ticket per booking; `TICKET` = one per guest. Asking for `TICKET` requires the `update_delivery_method` permission; sending `VOUCHER`, or omitting the field, does not — both take the column default."
        redemption_method:
          type: string
          enum: [MANIFEST, DIGITAL, PRINT]
          default: MANIFEST
          description: "How the customer is admitted. Asking for `DIGITAL` or `PRINT` requires the `update_delivery_method` permission — the same one gates both ticketing fields, matching the form they live on. Sending `MANIFEST`, or omitting the field, does not."
        is_private: { type: boolean, default: false, description: "`true` = a single party books the whole experience (private); `false` = multiple parties share the slot (shared). When `false`, `is_priced_per_person` is forced to `true` and `use_alternate_tier_pricing` to `false` regardless of what the caller supplied." }
        is_priced_per_person: { type: boolean, default: true, description: "`true` = price applies per traveler; `false` = price applies per group/booking. Implicitly forced to `true` when `is_private=false`." }
        is_tier_priced: { type: boolean, default: false, description: "Whether quantity-based pricing tiers apply." }
        use_alternate_tier_pricing: { type: boolean, default: false, description: "Keys the pricing tier on the TOTAL party size instead of the per-category quantity. Only valid on a product that is both `is_priced_per_person: true` and `is_tier_priced: true` — anything else is refused with 422. Implicitly forced to `false` when `is_private=false`, so in practice this only applies to private products." }
        show_last_tier: { type: boolean, default: false, description: "Whether the last tier is displayed in customer-facing pricing." }
        displayable: { type: boolean, default: true, description: "Whether the product is shown in widgets / catalog." }
        must_validate_cancellation_policy: { type: boolean, default: false, description: "Customer must explicitly accept the cancellation policy at checkout. When `false`, both `cancellation_policy` and `cancellation_policy_link` are nulled regardless of what the caller supplied — set `true` to retain a policy." }
        from_price: { type: [integer, "null"], minimum: 0, description: "Minor units." }
        from_price_label: { type: [string, "null"], maxLength: 255, description: "Caption shown next to `from_price` (e.g., `From €50/person`)." }
        currency: { type: string, minLength: 3, maxLength: 3, description: "Required, but not stored — `products` has no currency column. It must equal the account currency (`meta.currency`) or the request is refused with 422. There is no per-product currency to choose." }
        capacity: { type: [integer, "null"], minimum: 0 }
        cancellation_policy: { type: [string, "null"], maxLength: 65535, description: "Inline policy text. Mutually exclusive with `cancellation_policy_link`. Capped at 64 KiB (65,535 BYTES); a larger value is rejected with 422." }
        cancellation_policy_link: { type: [string, "null"], format: uri, maxLength: 500, description: "External URL with the policy. Mutually exclusive with `cancellation_policy`." }
        locale: { type: [string, "null"], maxLength: 10, description: "Default content locale for this product (e.g., `en`)." }
        category_ids:
          type: array
          items: { $ref: "#/components/schemas/PositiveIntegerId" }
        timezone: { type: [string, "null"], maxLength: 64 }
        dry_run: { type: boolean, default: false }

    UpdateProductRequest:
      type: object
      description: |
        Mirrors `UpdateProductRequest::rules()`. Same field semantics as
        `CreateProductRequest`. Every field is optional — only supplied
        keys are updated.
      properties:
        title: { type: string, maxLength: 200 }
        product_code: { type: string, maxLength: 50 }
        description: { type: [string, "null"], maxLength: 65535, description: "Capped at 64 KiB (65,535 BYTES); a larger value is rejected with 422." }
        instructions: { type: [string, "null"], maxLength: 65535, description: "Capped at 64 KiB (65,535 BYTES); a larger value is rejected with 422." }
        requirements: { type: [string, "null"], maxLength: 65535, description: "Capped at 64 KiB (65,535 BYTES); a larger value is rejected with 422." }
        inclusions: { type: [string, "null"], maxLength: 65535, description: "Plain text — one bullet per newline. NOT rich-text — payloads containing HTML tags are rejected with 422. Capped at 64 KiB (65,535 BYTES); a larger value is rejected with 422." }
        exclusions: { type: [string, "null"], maxLength: 65535, description: "Plain text — one bullet per newline. NOT rich-text — payloads containing HTML tags are rejected with 422. Capped at 64 KiB (65,535 BYTES); a larger value is rejected with 422." }
        status:
          type: string
          enum: [draft, published]
        schedule_type:
          type: string
          enum: [date, datetime]
          description: "`date` for date-only products; `datetime` for products with a starting time."
        delivery_method:
          type: string
          enum: [TICKET, VOUCHER]
          description: "\"Ticket type\". CHANGING it requires the `update_delivery_method` permission and reissues the tickets of every existing booking in the next 10 years, invalidating the QR codes customers already hold without notifying them — so it is refused with `422 TICKET_REISSUE_NOT_CONFIRMED` unless `confirm_ticket_reissue: true` is sent alongside. Sending the value the product already has is not a change: no permission needed, nothing reissued, no `ticket_reissue` block."
        redemption_method:
          type: string
          enum: [MANIFEST, DIGITAL, PRINT]
          description: "How the customer is admitted. CHANGING it requires the `update_delivery_method` permission; echoing back the stored value does not. Changing it alone reissues nothing — it does not affect the tickets already issued."
        confirm_ticket_reissue:
          type: boolean
          default: false
          description: "Acknowledgement, not a field — nothing is stored. Required to commit a `delivery_method` change on a product that has bookings. Ignored when `delivery_method` is absent or unchanged, and never required under `dry_run`."
        is_private: { type: boolean, description: "Switching this triggers an inventory cascade: every Availability of every related ProductOption is bulk-updated and seven inventory recompute jobs are dispatched. See the endpoint-level description for the full chain. When `false`, `is_priced_per_person` and `use_alternate_tier_pricing` are implicitly overridden — see Create description." }
        is_priced_per_person: { type: boolean }
        is_tier_priced: { type: boolean }
        use_alternate_tier_pricing: { type: boolean, description: "Keys the pricing tier on the TOTAL party size instead of the per-category quantity. The effective post-write state must be per-person AND tier priced, or the request is refused with 422 — see the endpoint description for the exemption that keeps a read-modify-write round trip working on an already-conflicting row." }
        show_last_tier: { type: boolean }
        displayable: { type: boolean }
        must_validate_cancellation_policy: { type: boolean }
        from_price: { type: [integer, "null"], minimum: 0 }
        from_price_label: { type: [string, "null"], maxLength: 255 }
        currency: { type: string, minLength: 3, maxLength: 3, description: "Optional. Not stored — no per-row column — but it must equal the account currency (`meta.currency`) or the request is refused with 422. There is no per-record currency to change." }
        capacity: { type: [integer, "null"], minimum: 0 }
        cancellation_policy: { type: [string, "null"], maxLength: 65535, description: "Capped at 64 KiB (65,535 BYTES); a larger value is rejected with 422." }
        cancellation_policy_link: { type: [string, "null"], format: uri, maxLength: 500 }
        locale: { type: [string, "null"], maxLength: 10 }
        category_ids:
          type: array
          items: { $ref: "#/components/schemas/PositiveIntegerId" }
        timezone: { type: [string, "null"], maxLength: 64 }
        dry_run: { type: boolean, default: false }

    CreateProductOptionRequest:
      type: object
      required: [product_id, title]
      description: |
        Mirrors `CreateProductOptionRequest::rules()`. `title` is mapped onto
        the `name` column by the controller. `option_code` is optional —
        when omitted, the server auto-generates one from the title slug plus
        a random suffix, **on the real write only**; a `dry_run` echoes null,
        for the same reason `product_code` does. ProductOption has no
        description or published/draft flag of its own — those live on the
        parent Product.
      properties:
        product_id: { $ref: "#/components/schemas/PositiveIntegerId" }
        title: { type: string, maxLength: 200, description: "Persisted as the `name` column." }
        option_code: { type: [string, "null"], maxLength: 50, description: "Tenant-supplied SKU. Auto-generated from title when omitted, on the real write only — a dry run echoes null." }
        capacity: { type: [integer, "null"], minimum: 0 }
        min_age: { type: [integer, "null"], minimum: 0 }
        max_age: { type: [integer, "null"], minimum: 0 }
        dry_run: { type: boolean, default: false }

    UpdateProductOptionRequest:
      type: object
      description: |
        Mirrors `UpdateProductOptionRequest::rules()`. Same field semantics as
        `CreateProductOptionRequest` (title → name).
      properties:
        title: { type: string, maxLength: 200 }
        option_code: { type: string, maxLength: 50 }
        capacity: { type: [integer, "null"], minimum: 0 }
        min_age: { type: [integer, "null"], minimum: 0 }
        max_age: { type: [integer, "null"], minimum: 0 }
        dry_run: { type: boolean, default: false }

    CreatePricingCategoryRequest:
      type: object
      required: [product_id, name]
      description: |
        Mirrors `CreatePricingCategoryRequest::rules()`. `name` is
        translatable — accepts a bare string, persisted as `{"en": "..."}`.
      properties:
        product_id: { $ref: "#/components/schemas/PositiveIntegerId" }
        name: { type: string, maxLength: 200 }
        type:
          type: string
          enum: [ADULT, CHILD, INFANT, YOUTH, STUDENT, SENIOR, TRAVELLER, EU_CITIZEN, MILITARY, EU_CITIZEN_STUDENT]
          default: TRAVELLER
        min_age: { type: [integer, "null"], minimum: 0 }
        max_age: { type: [integer, "null"], minimum: 0 }
        is_internal: { type: boolean, default: false }
        dry_run: { type: boolean, default: false }

    UpdatePricingCategoryRequest:
      type: object
      description: |
        Mirrors `UpdatePricingCategoryRequest::rules()`. Reparenting (changing
        `product_id`) is not supported via PATCH; create a new category if you
        need to move tiers across products.
      properties:
        name: { type: string, maxLength: 200 }
        type:
          type: string
          enum: [ADULT, CHILD, INFANT, YOUTH, STUDENT, SENIOR, TRAVELLER, EU_CITIZEN, MILITARY, EU_CITIZEN_STUDENT]
        min_age: { type: [integer, "null"], minimum: 0 }
        max_age: { type: [integer, "null"], minimum: 0 }
        is_internal: { type: boolean }
        dry_run: { type: boolean, default: false }

    CreatePricingTierRequest:
      type: object
      required: [pricing_category_id, amount]
      description: |
        Mirrors `CreatePricingTierRequest::rules()`. The actual `pricing_tiers`
        table has no `product_option_id`, `availability_id`, or `name` column;
        all three are accepted as legacy aliases and ignored by the controller.
        Tiers belong to a `PricingCategory` (the named bucket like
        `Adults`/`Children`), which in turn belongs to a Product. `amount`
        is persisted as the `fare` column. `currency` has no per-row column
        and is dropped on persist, but is validated against the account
        currency when supplied.
      properties:
        pricing_category_id:
          $ref: "#/components/schemas/PositiveIntegerId"
          description: "Required parent `PricingCategory` row."
        min: { type: integer, minimum: 0, description: "Inclusive lower bound of the headcount band." }
        max: { type: [integer, "null"], minimum: 0, description: "Inclusive upper bound; null = open-ended." }
        amount: { type: integer, minimum: 0, description: "Persisted as the `fare` column. Minor units." }
        currency: { type: string, minLength: 3, maxLength: 3, description: "No per-row column, so it is dropped on persist — but it must equal the account currency (`meta.currency`) or the request is refused with 422." }
        name: { type: string, maxLength: 100, description: "Legacy alias accepted for compat — belongs on the parent `PricingCategory`, not the tier. Ignored." }
        product_option_id:
          oneOf:
            - $ref: "#/components/schemas/PositiveIntegerId"
            - type: "null"
          description: "Legacy alias accepted for compat. Ignored — tiers don't link to ProductOption directly."
        availability_id:
          oneOf:
            - $ref: "#/components/schemas/PositiveIntegerId"
            - type: "null"
          description: "Legacy alias accepted for compat. Availability scoping is M:N via the `availability_pricing_tier` pivot, not a column. Ignored."
        dry_run: { type: boolean, default: false }

    UpdatePricingTierRequest:
      type: object
      description: |
        Mirrors `UpdatePricingTierRequest::rules()`. `pricing_category_id`,
        `min`, `max`, and `amount` (→ `fare`) are persisted; sending
        `pricing_category_id` reparents the tier (404 if the target
        category doesn't exist). `name` is accepted as a legacy alias but
        ignored.
      properties:
        pricing_category_id:
          $ref: "#/components/schemas/PositiveIntegerId"
          description: "Reparent the tier under a different PricingCategory."
        min: { type: integer, minimum: 0 }
        max: { type: [integer, "null"], minimum: 0 }
        amount: { type: integer, minimum: 0, description: "Persisted as `fare`. Minor units." }
        name: { type: string, maxLength: 100, description: "Legacy alias — ignored." }
        currency: { type: string, minLength: 3, maxLength: 3, description: "Optional. Not stored — no per-row column — but it must equal the account currency (`meta.currency`) or the request is refused with 422. There is no per-record currency to change." }
        dry_run: { type: boolean, default: false }

    CreateExtraRequest:
      type: object
      required: [product_id, name, amount, currency]
      description: |
        Mirrors `CreateExtraRequest::rules()`. The controller maps `name` →
        `title`, `amount` → `fare`, `max_quantity` → (`maximum`,
        `maximum_bookable`) on the row. `currency` is required for parity
        with other create endpoints but has no `extras` column and is
        dropped on persist — it must still equal the account currency.
      properties:
        product_id:
          $ref: "#/components/schemas/PositiveIntegerId"
          description: "Persisted as the morph (`product_id`, `product_type=Product`)."
        name: { type: string, maxLength: 200, description: "Persisted as the translatable `title` column." }
        description: { type: [string, "null"] }
        amount: { type: integer, minimum: 0, description: "Persisted as `fare`. Minor units." }
        currency: { type: string, minLength: 3, maxLength: 3, description: "Required for symmetry; not stored — but must equal the account currency (`meta.currency`) or the request is refused with 422." }
        max_quantity: { type: [integer, "null"], minimum: 0, description: "When set, `maximum` becomes `custom` and the value lands in `maximum_bookable`." }
        dry_run: { type: boolean, default: false }

    UpdateExtraRequest:
      type: object
      description: |
        Mirrors `UpdateExtraRequest::rules()`. Same field-to-column mappings
        as `CreateExtraRequest`.
      properties:
        name: { type: string, maxLength: 200 }
        description: { type: [string, "null"] }
        amount: { type: integer, minimum: 0 }
        currency: { type: string, minLength: 3, maxLength: 3, description: "Optional. Not stored — no per-row column — but it must equal the account currency (`meta.currency`) or the request is refused with 422. There is no per-record currency to change." }
        max_quantity: { type: [integer, "null"], minimum: 0 }
        dry_run: { type: boolean, default: false }

    CreateQuestionRequest:
      type: object
      required: [product_option_id, label, type]
      description: |
        Mirrors `CreateQuestionRequest::rules()`. The controller maps
        `label` → `question`, `required` → `is_required`, and `type` onto
        the underlying `answer_type` enum via:
        `text → short_text`, `textarea → long_text`, `select → list`,
        `date → date`, `number → number`, `boolean → boolean`. The polymorphic
        `questionable` morph is set to `(ProductOption::class, product_option_id)`.

        There is no `granularity` field: the controller writes `booking`
        unconditionally, so this endpoint can only create booking-granularity
        questions. A `granularity` key in the body is dropped by validation,
        not honoured and not rejected — the created row comes back
        `granularity: booking` regardless of what was sent.
      properties:
        product_option_id:
          $ref: "#/components/schemas/PositiveIntegerId"
          description: "Persisted as `questionable_id` with `questionable_type=ProductOption`."
        label: { type: string, maxLength: 200, description: "Persisted as the `question` column." }
        type:
          type: string
          enum: [text, textarea, select, date, number, boolean]
          description: "Mapped onto `answer_type` (see schema-level description)."
        required: { type: boolean, default: false, description: "Persisted as `is_required`." }
        options:
          type: array
          items: { type: string }
          description: For type=select
        dry_run: { type: boolean, default: false }

    UpdateQuestionRequest:
      type: object
      description: |
        Mirrors `UpdateQuestionRequest::rules()`. Same `label`→`question`,
        `required`→`is_required`, `type`→`answer_type` mappings as
        `CreateQuestionRequest`. `granularity` is not accepted here either, so
        an existing question's granularity cannot be changed through the API —
        and recreating it is no workaround, since create always writes
        `booking`.
      properties:
        label: { type: string, maxLength: 200 }
        type:
          type: string
          enum: [text, textarea, select, date, number, boolean]
        required: { type: boolean }
        options:
          type: array
          items: { type: string }
        dry_run: { type: boolean, default: false }

    CreateAvailableGiftCertRequest:
      type: object
      required: [name, amounts, currency]
      description: |
        Mirrors `CreateAvailableGiftCertRequest::rules()`. `currency` is
        accepted for symmetry but not stored (no column on the table); it must
        still equal the account currency.
        `expiration_period_months` persists to the `expiration_period`
        column; the model treats it as MONTHS. `cover_image_url` is
        read-only and not accepted on writes (cover assets go through the
        Paperclip `cover` attachment, not via the CLI today).
      properties:
        name: { type: string, maxLength: 200 }
        amounts:
          type: array
          minItems: 1
          items: { type: integer, minimum: 0, description: "Minor units." }
        currency: { type: string, minLength: 3, maxLength: 3, description: "Required for symmetry; not stored — but must equal the account currency (`meta.currency`) or the request is refused with 422." }
        expiration_period_months: { type: [integer, "null"], description: "Months. -1 means never expires." }
        dry_run: { type: boolean, default: false }

    UpdateAvailableGiftCertRequest:
      type: object
      description: |
        Mirrors `UpdateAvailableGiftCertRequest::rules()`. `cover_image_url`
        is read-only (not accepted on writes).
      properties:
        name: { type: string, maxLength: 200 }
        amounts:
          type: array
          minItems: 1
          items: { type: integer, minimum: 0 }
        currency: { type: string, minLength: 3, maxLength: 3, description: "Optional. Not stored — no per-row column — but it must equal the account currency (`meta.currency`) or the request is refused with 422. There is no per-record currency to change." }
        expiration_period_months: { type: [integer, "null"] }
        dry_run: { type: boolean, default: false }

    CreateResourceRequest:
      type: object
      required: [name, type, category]
      properties:
        name: { type: string, maxLength: 200 }
        type: { type: string, maxLength: 200, description: "Free-form label (Sailboat, Senior Guide, …)." }
        category:
          type: string
          enum: [guide, asset, equipment, auxiliary]
        capacity: { type: [integer, "null"], minimum: 0, description: "Seats the resource can host. Refused (422) when `category` is `equipment`: capacity is what makes a resource the booking's single main resource, and equipment is never that." }
        rating: { type: [number, "null"], format: float, minimum: 0 }
        dry_run: { type: boolean, default: false }

    UpdateResourceRequest:
      type: object
      properties:
        name: { type: string, maxLength: 200 }
        type: { type: string, maxLength: 200 }
        category:
          type: string
          enum: [guide, asset, equipment, auxiliary]
        capacity: { type: [integer, "null"], minimum: 0, description: "Seats the resource can host. Refused (422) when the resource's category is (or becomes) `equipment`: capacity is what makes a resource the booking's single main resource, and equipment is never that." }
        rating: { type: [number, "null"], format: float, minimum: 0 }
        dry_run: { type: boolean, default: false }

    AttachResourceRequest:
      type: object
      required: [resource_id]
      description: |
        Attaches a Resource to a ProductOption. `capacity` and `seniority`
        are optional pivot-level overrides; omit to inherit the
        Resource-level defaults.
      properties:
        resource_id: { $ref: "#/components/schemas/PositiveIntegerId" }
        capacity: { type: [integer, "null"], minimum: 0, description: "Overrides the Resource's capacity for this specific ProductOption attachment. This is the capacity `Booking::attachResources()` reads, so setting it makes the resource a candidate for the booking's single main slot — refused (422) for an `equipment` resource." }
        seniority: { type: [integer, "null"], minimum: 0 }
        dry_run: { type: boolean, default: false }

    UpdateBookingResourcesRequest:
      type: object
      required: [expected_resource_state_token]
      description: |
        Normalized desired-state request for booking resource writes. Every
        field is optional and an OMITTED field means "leave this kind alone" —
        only what you send is reconciled.

        An UNRECOGNISED field is a `422`, not a silent drop. Because every field
        is optional, a body whose only instruction was a misspelt or invented
        one would otherwise validate, plan nothing, and answer `200` with
        `before` equal to `after` — indistinguishable from a mutation that
        worked.

        A booking's resources come in three kinds, split by the product
        option's pivot capacity rather than by `Resource.category`:

        | kind | on the product option | per booking | field |
        | --- | --- | --- | --- |
        | main | non-auxiliary, pivot capacity SET | exactly one | `main_resource_id` |
        | equipment | non-auxiliary, pivot capacity NULL | many | `equipment_resource_ids` |
        | auxiliary | `category = auxiliary` | many | `auxiliary_resource_ids` |

        In practice the main resource is the trip's guide or its asset (boat,
        vehicle, room) and equipment is the kit that goes out with every
        departure — an `equipment` resource is forced to a null capacity on
        every write path, so the capacity split and the category agree.

        `main_resource_id` is singular because the booking holds one, and it
        ASSIGNS: it replaces the current main resource if there is one and makes
        the first assignment if there is not. There is no separate attach verb —
        the request is the same sentence either way ("the main resource is now
        X") and you should not have to read the booking's state to know which
        one you are doing. It is not nullable: there is no way to leave a
        booking with no main resource through this endpoint.

        Naming a resource the booking already holds elsewhere is how you would
        ask for a SECOND guide or asset, and both of the plural fields refuse
        it: `EQUIPMENT_RESOURCE_IS_MAIN` and `AUXILIARY_RESOURCE_IS_MAIN`. Only
        `main_resource_id` may point at a capacity-bearing resource, and it
        holds one.

        `equipment_resource_ids` and `auxiliary_resource_ids` each replace their
        whole set: send the full desired list, not a delta. Equipment attached
        to the booking but no longer carried by the product option is left
        alone — it cannot be offered back once removed, so it is out of scope
        for this field rather than silently detached.

        One thing to know about omitting `equipment_resource_ids` while moving
        the main resource: switching the main detaches and re-attaches the
        option's WHOLE equipment set, so a booking previously narrowed to a
        subset comes back with all of it. That is what `attachResources()` does
        and the dry run reports it faithfully. Send the set you want alongside
        `main_resource_id` if you need to keep a narrowed one.

        On a `409 BOOKING_RESOURCE_CONFLICT`, `error.details.rejections[]`
        carries one entry per refused id with a `code`:

        | code | meaning |
        | --- | --- |
        | `<FIELD>_RESOURCE_NOT_ON_PRODUCT_OPTION` | the booking's product option does not carry that resource at all — attach it to the option first |
        | `<FIELD>_RESOURCE_IS_MAIN` | it is a main resource (capacity-bearing). A booking holds one; use `main_resource_id` |
        | `<FIELD>_RESOURCE_IS_EQUIPMENT` | it is equipment (no pivot capacity). Use `equipment_resource_ids` |
        | `<FIELD>_RESOURCE_IS_AUXILIARY` | it is auxiliary. Use `auxiliary_resource_ids` |
        | `MAIN_RESOURCE_NOT_AVAILABLE` | it IS a main resource on the option, but cannot take this booking — already on an overlapping departure, cannot host this party size, or inside a cool-off window |
        | `AUXILIARY_RESOURCE_NOT_AVAILABLE` | it IS auxiliary on the option, but is on an overlapping departure or cannot host this party size |

        `<FIELD>` is `MAIN`, `EQUIPMENT` or `AUXILIARY` — the field you put the
        id in, not what the resource turned out to be. The `_IS_` codes are the
        wrong-field case and name the field you wanted. There is no
        `EQUIPMENT_RESOURCE_NOT_AVAILABLE`: equipment is never rationed per
        booking, so it is either on the option or it is not.

        `MAIN_RESOURCE_NOT_AVAILABLE` can also arrive on a request whose dry run
        was clean — a concurrent booking can take the resource in between, and
        `expected_resource_state_token` cannot see that (it covers this
        booking's own assignments, and none of them moved). Re-read the
        candidates and retry.
      properties:
        main_resource_id: { $ref: "#/components/schemas/PositiveIntegerId" }
        equipment_resource_ids:
          type: array
          description: Full desired equipment set. Omit to leave equipment untouched.
          items: { $ref: "#/components/schemas/PositiveIntegerId" }
        auxiliary_resource_ids:
          type: array
          description: Full desired auxiliary set. Omit to leave auxiliary resources untouched.
          items: { $ref: "#/components/schemas/PositiveIntegerId" }
        expected_resource_state_token:
          type: string
          description: Aggregate token from the latest booking read with resources included.
        dry_run: { type: boolean, default: false }

    CreateLocationRequest:
      type: object
      required: [type, name, address, attach_to, attach_to_id]
      description: |
        Mirrors `CreateLocationRequest::rules()`. Every Location must be
        attached to an owning record; specify which kind via `attach_to`
        (enum) and the id via `attach_to_id`. The controller resolves the
        enum to the underlying polymorphic FQCN — clients never deal with
        Eloquent class names. The schema column is `street_address`;
        `address` is a derived accessor on the model. The controller prefers
        `street_address` when supplied, otherwise falls back to `address`.
        `timezone` and `notes` are accepted but dropped on persist (no
        underlying columns today). 422 if `attach_to_id` doesn't resolve to
        an existing record of the requested kind.
      properties:
        type:
          type: string
          enum: [PRIMARY, START, END, VISITED, SECONDARY]
        name: { type: string, maxLength: 200 }
        address: { type: string, description: "Used as `street_address` when `street_address` is not explicitly supplied." }
        street_address: { type: string, description: "Preferred; persisted directly." }
        city: { type: string }
        country_code: { type: string, minLength: 2, maxLength: 2 }
        postal_code: { type: [string, "null"] }
        region: { type: [string, "null"] }
        latitude: { type: [number, "null"], format: float }
        longitude: { type: [number, "null"], format: float }
        google_place_id: { type: [string, "null"] }
        timezone: { type: [string, "null"], maxLength: 64, description: "Accepted but not stored — no column." }
        notes: { type: [string, "null"], description: "Accepted but not stored — no column." }
        attach_to:
          type: string
          enum: [product, organisation, partner]
          description: "Kind of record this location belongs to. The CLI never exposes Eloquent FQCNs."
        attach_to_id:
          type: string
          description: |
            Id of the `attach_to` record. Declared as a string because this
            field is polymorphic in KEY TYPE — `product` and `partner` ids
            are integers, an `organisation` id is the tenant key — so neither
            `integer` nor `PositiveIntegerId` describes it. An integer is
            accepted too, and deliberately not advertised: the string
            spelling covers every `attach_to`, so a client generated from
            this document can always send one.
        dry_run: { type: boolean, default: false }

    UpdateLocationRequest:
      type: object
      description: |
        Mirrors `UpdateLocationRequest::rules()`. The controller persists only
        `type`, `name`, `latitude`, `longitude`, `google_place_id`, `region`,
        and (when `address` is provided) `street_address`. `timezone` and
        `notes` are accepted but dropped on persist.
      properties:
        type:
          type: string
          enum: [PRIMARY, START, END, VISITED, SECONDARY]
        name: { type: string, maxLength: 200 }
        address: { type: string, description: "Persisted as `street_address` when supplied." }
        latitude: { type: [number, "null"], format: float }
        longitude: { type: [number, "null"], format: float }
        google_place_id: { type: [string, "null"] }
        timezone: { type: [string, "null"], maxLength: 64, description: "Accepted but not stored." }
        notes: { type: [string, "null"], description: "Accepted but not stored." }
        dry_run: { type: boolean, default: false }

    # ──────────────────────────────────────────────────────────────────
    # Workflows
    # ──────────────────────────────────────────────────────────────────
    Workflow:
      type: object
      description: |
        A workflow definition. Returned shape from /workflows/{id} embeds
        `trigger` (singleton step with step_type=TRIGGER, may be null) and
        `steps` (non-trigger steps, sorted by `order`, may be empty). List
        endpoint returns the same shape; eager-loads steps so the
        embedded counts are accurate.

        `status` controls editability: DRAFT and PAUSED accept step/trigger
        writes; ACTIVE rejects them with 409 WORKFLOW_NOT_EDITABLE.

        `deleted_at` is non-null when the workflow has been soft-deleted —
        use ?include_trashed=true on list/show to see trashed rows.
      properties:
        id: { type: string, description: UUID }
        name: { type: string }
        description: { type: [string, "null"] }
        status: { type: string, enum: [draft, paused, active] }
        business_unit_id: { type: [integer, "null"] }
        created_by_user_id: { type: [integer, "null"] }
        max_credits_per_run:
          type: [integer, "null"]
          description: |
            Per-execution credit ceiling. Activation rejects with
            CREDIT_LIMIT_EXCEEDED when sum(step.creditsCost()) exceeds
            this. Null means unbounded.
        notify_on_fail: { type: boolean }
        last_failed_run: { type: [string, "null"], format: date-time }
        deleted_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        trigger:
          oneOf:
            - $ref: "#/components/schemas/WorkflowStep"
            - { type: "null" }
          description: "Singleton TRIGGER step. Null when no trigger has been set."
        steps:
          type: array
          items: { $ref: "#/components/schemas/WorkflowStep" }
          description: "Non-trigger steps, sorted by `order`."
        steps_count: { type: integer }

    WorkflowStep:
      type: object
      description: |
        A single step row. `step_type` discriminates the shape: TRIGGER
        steps live under the workflow's `trigger`; ACTION/CONDITION/
        DELAY/DELAY_UNTIL/LOOP steps live under `steps[]`. `parent_step_id`
        and `branch_type` form the tree used by conditions and loops:
        children of a CONDITION step are marked branch_type=true|false to
        distinguish the then/else branches; LOOP children use branch_type=true.
      properties:
        id: { type: integer }
        workflow_id: { type: string, description: UUID }
        step_type:
          type: string
          enum: [trigger, action, condition, delay, delay_until, loop]
        action_type:
          type: [string, "null"]
          description: |
            For TRIGGER steps: matches TriggerType (booking_confirmed,
            scheduled_time, …). For ACTION steps: matches ActionType
            (send_notification, charge_card_on_file, …). Null for
            CONDITION steps (use condition_type instead).
        condition_type:
          type: [string, "null"]
          enum: [value_check, filter, null]
        config:
          type: object
          description: |
            Action-type-specific config. Validated against the resolved
            action's `rules()` schema at write time and again at
            execution time. See app/Workflows/Actions/*.php for the
            per-action shape.
        order: { type: integer }
        parent_step_id:
          type: [integer, "null"]
          description: "Parent step in the tree (CONDITION/LOOP children)."
        branch_type:
          type: [string, "null"]
          enum: [true, false, null]
          description: "Branch tag for CONDITION children (true/false) or LOOP children (true)."
        deleted_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    WorkflowExecution:
      type: object
      description: |
        A single run of a workflow. The workflow_id FK is nullable —
        force-deleting the parent workflow sets it to null, preserving the
        audit trail via the tenant_id column. The `fail_reason` enum
        carries structural failure causes (e.g. workflow_deleted_mid_run);
        per-step exception details live in WorkflowExecutionLog.

        Show endpoint also returns `failed_log`: the first
        WorkflowExecutionLog row with status=failed, so support can debug
        without a second /logs round-trip.
      properties:
        id: { type: integer }
        workflow_id:
          type: [string, "null"]
          description: "Null when the parent workflow has been force-deleted."
        status:
          type: string
          enum: [pending, running, waiting, completed, failed]
        fail_reason:
          type: [string, "null"]
          enum: [workflow_deleted_mid_run, null]
          description: "Categorized structural fail reason. Per-step exception messages live in WorkflowExecutionLog.error_message."
        current_step_order: { type: [integer, "null"] }
        resume_at:
          type: [string, "null"]
          format: date-time
          description: "When the execution is in WAITING status, the wall-clock time at which it should resume."
        credits_cost: { type: integer }
        started_at: { type: [string, "null"], format: date-time }
        completed_at: { type: [string, "null"], format: date-time }
        trigger_data:
          type: [object, "null"]
          description: "Trigger payload at the moment the execution was created."
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        failed_log:
          oneOf:
            - $ref: "#/components/schemas/WorkflowExecutionLog"
            - { type: "null" }
          description: "Embedded only on /workflow-executions/{id} (single-show)."

    WorkflowExecutionLog:
      type: object
      description: |
        Per-step record of an execution. One row per step attempt — loops
        produce one row per (step, item) pair. Error context lives here,
        not on WorkflowExecution.
      properties:
        id: { type: integer }
        execution_id: { type: integer }
        step_id: { type: [integer, "null"] }
        status: { type: string, enum: [pending, running, completed, failed] }
        input_data: { type: [object, "null"] }
        output_data: { type: [object, "null"] }
        error_message: { type: [string, "null"] }
        exception_type: { type: [string, "null"] }
        credits_cost: { type: integer }
        executed_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }

    # Page wrappers
    WorkflowPage:
      type: object
      properties:
        meta: { $ref: "#/components/schemas/Meta" }
        data:
          type: array
          items: { $ref: "#/components/schemas/Workflow" }
        pagination: { $ref: "#/components/schemas/Pagination" }

    WorkflowExecutionPage:
      type: object
      properties:
        meta: { $ref: "#/components/schemas/Meta" }
        data:
          type: array
          items: { $ref: "#/components/schemas/WorkflowExecution" }
        pagination: { $ref: "#/components/schemas/Pagination" }

    WorkflowExecutionLogPage:
      type: object
      properties:
        meta: { $ref: "#/components/schemas/Meta" }
        data:
          type: array
          items: { $ref: "#/components/schemas/WorkflowExecutionLog" }
        pagination: { $ref: "#/components/schemas/Pagination" }

    # Request bodies
    WorkflowNode:
      type: object
      required: [step_type, action_type, name, category, description, config]
      description: |
        One trigger, action or logic node, described for a machine.
      properties:
        step_type:
          type: string
          enum: [trigger, action, condition, delay, delay_until, loop]
          description: |
            The `step_type` to send when using this node. Stated per node
            because `delay` and `delay_until` are ActionTypes whose step_type is
            their own name rather than `action`.
        action_type:
          type: [string, "null"]
          description: |
            The `action_type` to send, or null for a node discriminated some
            other way — a condition carries `condition_type`, a loop carries
            neither.
        name: { type: string }
        category: { type: string }
        description: { type: string }
        config:
          type: object
          additionalProperties: { type: string }
          description: |
            `field => "required|string|in:a,b"`, from the node's own `rules()`.
            An empty object means the node takes no config.

    CreateWorkflowRequest:
      type: object
      required: [name]
      description: |
        Mirrors `CreateWorkflowRequest::rules()`. The workflow is created
        in DRAFT status — there is no way to skip straight to ACTIVE, whether
        or not `trigger` and `steps` are sent. Compose the whole draft here,
        then POST /activate.
      properties:
        name: { type: string, maxLength: 200 }
        description: { type: [string, "null"] }
        business_unit_id:
          $ref: "#/components/schemas/PositiveIntegerId"
          description: "Defaults to the calling user's current_business_unit_id when omitted."
        max_credits_per_run:
          type: [integer, "null"]
          minimum: 0
          description: "Defaults to 50 when omitted."
        notify_on_fail: { type: boolean, default: false }
        trigger:
          $ref: "#/components/schemas/ComposedWorkflowTrigger"
        steps:
          type: array
          maxItems: 50
          description: |
            The workflow's steps, in order. Omit to create a shell and add them
            later with `POST /workflows/{id}/steps`.
          items:
            $ref: "#/components/schemas/ComposedWorkflowStep"
        dry_run: { type: boolean, default: false }

    ComposedWorkflowTrigger:
      type: object
      required: [action_type]
      description: |
        The trigger, written alongside the workflow. Same shape as
        `CreateWorkflowTriggerRequest`; the trigger is a singleton and always
        takes order 0.
      properties:
        action_type:
          type: string
          description: "A TriggerType — see GET /workflow-nodes."
        config:
          type: object
          additionalProperties: true

    ComposedWorkflowStep:
      type: object
      required: [step_type]
      description: |
        One step, written alongside the workflow. Same shape as
        `CreateWorkflowStepRequest` except that `parent_step_id` is replaced by
        `parent_ref`: none of these steps exists yet, so there is no id to
        reference.
      properties:
        step_type:
          type: string
          enum: [action, condition, delay, delay_until, loop]
          description: |
            `trigger` is not accepted here — the trigger is a singleton and has
            its own `trigger` key on the request.
        action_type:
          type: [string, "null"]
          description: |
            Required for `action`, `delay` and `delay_until`. See
            GET /workflow-nodes.
        condition_type:
          type: [string, "null"]
          description: "Required for `condition`."
        config:
          type: object
          additionalProperties: true
          description: |
            Validated against the node's own `rules()`. A shape that does not
            match is a 422 `INVALID_STEP_CONFIG`, in dry-run as well as on
            commit.
        order:
          type: integer
          minimum: 0
          description: "Defaults to the step's position in the list, 1-based."
        ref:
          type: string
          maxLength: 64
          description: |
            A caller-chosen name for this step, so a later step can point at it.
            Must be unique within the request.
        parent_ref:
          type: string
          maxLength: 64
          description: |
            The `ref` of an EARLIER step in this same list. A forward or unknown
            ref is a 422 — never a branch silently flattened onto the main line.
        branch_type:
          type: [string, "null"]
          enum: ["true", "false", null]
          description: "Required with `parent_ref`."

    UpdateWorkflowRequest:
      type: object
      description: |
        Updates the workflow shell. All fields are optional; only
        passed-in fields are updated. Shell PATCH is allowed on ACTIVE
        workflows because these fields don't affect the executor.
      properties:
        name: { type: string, maxLength: 200 }
        description: { type: [string, "null"] }
        max_credits_per_run: { type: [integer, "null"], minimum: 0 }
        notify_on_fail: { type: boolean }
        dry_run: { type: boolean, default: false }

    CreateWorkflowTriggerRequest:
      type: object
      required: [action_type]
      description: |
        Mirrors `CreateWorkflowTriggerRequest::rules()`. The `config`
        shape depends on `action_type` — see
        app/Workflows/Triggers/*.php and each trigger's `rules()`.

        Example for SCHEDULED_TIME (weekly):
        ```json
        {
          "action_type": "scheduled_time",
          "config": {
            "frequency": "weekly",
            "time": "09:00",
            "weekly_days": ["monday", "wednesday"]
          }
        }
        ```
      properties:
        action_type:
          type: string
          enum:
            - booking_confirmed
            - booking_cancelled
            - booking_changed
            - booking_rescheduled
            - booking_transaction_processed
            - documents_signed_complete
            - customer_created
            - diary_notes_updated
            - scheduled_time
            - webhook
            - unknown_booking_cancellation
            - booking_resource_attached
            - booking_resource_detached
            - auxiliary_resource_attached_to_booking
            - auxiliary_resource_detached_from_booking
            - all_mandatory_questions_answered
            - abandoned_booking
            - custom_attribute_updated
            - waitlist_joined
        config:
          type: object
          description: "Validated against the resolved trigger's rules() schema."
        dry_run: { type: boolean, default: false }

    UpdateWorkflowTriggerRequest:
      type: object
      required: [config]
      description: |
        Replaces the trigger's `config`. `action_type` is immutable —
        to change it, call POST /trigger (which atomically replaces).
      properties:
        config: { type: object }
        dry_run: { type: boolean, default: false }

    CreateWorkflowStepRequest:
      type: object
      required: [step_type, order]
      description: |
        Mirrors `CreateWorkflowStepRequest::rules()`. step_type=TRIGGER
        is REJECTED here — use POST /workflows/{id}/trigger for the
        trigger singleton.

        `action_type` is required for ACTION/DELAY/DELAY_UNTIL/LOOP step
        types; `condition_type` is required for CONDITION step type. The
        `config` shape depends on the resolved action — see the relevant
        class's `rules()`.

        `parent_step_id` (when set) must reference a step in the same
        workflow; cross-workflow refs return 422. When parent_step_id is
        set, `branch_type` is required (true/false for condition children;
        true for loop children).
      properties:
        step_type:
          type: string
          enum: [action, condition, delay, delay_until, loop]
        action_type:
          type: [string, "null"]
          description: "Required for ACTION/DELAY/DELAY_UNTIL/LOOP. See ActionType enum for values."
        condition_type:
          type: [string, "null"]
          enum: [value_check, filter, null]
          description: "Required for CONDITION step_type."
        config: { type: object }
        order: { type: integer, minimum: 0 }
        parent_step_id:
          oneOf:
            - $ref: "#/components/schemas/PositiveIntegerId"
            - type: "null"
        branch_type:
          type: [string, "null"]
          enum: [true, false, null]
          description: "Required when parent_step_id is set."
        dry_run: { type: boolean, default: false }

    UpdateWorkflowStepRequest:
      type: object
      required: [config]
      description: |
        Step PATCH only updates the config payload. parent_step_id,
        branch_type, order, step_type, and action_type are immutable
        post-create — to move or reshape a step, delete and re-create.
      properties:
        config: { type: object }
        dry_run: { type: boolean, default: false }
