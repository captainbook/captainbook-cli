  /availabilities:
    get:
      operationId: listAvailabilities
      summary: List availabilities
      tags: [Availabilities]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/IncludeTrashed"
        - $ref: "#/components/parameters/Since"
        - name: product_option_id
          in: query
          schema: { type: integer, minimum: 1 }
        - name: product_id
          in: query
          description: >-
            Departures for every option of this product. Use this when you have
            a product id; passing one as product_option_id matches an unrelated
            option and silently returns nothing.
          schema: { type: string }
        - name: from
          in: query
          description: Departure start >= this. Product-local wall clock.
          schema: { type: string, format: date }
        - name: to
          in: query
          description: >-
            Departure start <= this. A bare date covers the WHOLE day; a value
            carrying a time is an exclusive instant.
          schema: { type: string, format: date }
        - name: has_capacity
          in: query
          description: |
            When true, only departures with `vacancies > 0`. `false` is no
            filter, NOT "only full departures".
          schema: { type: boolean }
        - name: include_pricing
          in: query
          schema: { type: boolean, default: false }
          description: |
            When true, embed `pricing_tiers[]` on each availability with
            effective `amount` (per-slot override from
            `availability_pricing_tier.fare` when present, catalogue price
            otherwise), `default_amount`, and `is_override`. Defaults to
            false for backward compatibility. Adds 3 batched queries per
            page (product-option lookup, product tiers, pivot overrides) —
            no per-row N+1 regardless of page size.
      responses:
        "200":
          description: Page of availabilities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailabilityPage"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "422": { $ref: "#/components/responses/ValidationError" }

    post:
      operationId: createAvailability
      summary: Create one availability (departure)
      description: |
        Create a SINGLE departure for one product option. Recurring inventory
        is `POST /availability-rules`; this is the one-off "add a departure
        tomorrow, 09:00 to 17:00" case.

        **Times are the product's LOCAL wall clock.** `date` + `start_time`
        are stored verbatim into `availabilities.from`, which holds
        product-local time rather than UTC — send what the operator would read
        on their own calendar, and do NOT convert to UTC first. A departure
        sent as `09:00` sells as 09:00 in the product's timezone.

        **THE SPAN IS THIS ONE DEPARTURE'S LENGTH, never a range.** There is
        no way to create a departure per day here; that is
        `POST /availability-rules`. Send `day_count` — whole days from `date`
        to the day it ends on, `0` same-day and `1` overnight. It is never
        inferred from an end_time earlier than start_time, because that is
        equally likely to be a typo.

        `end_date` is the older absolute spelling of the same span and is
        capped at `date + 1`, the overnight case it was added for. A longer
        one is a 422, because an absolute end date is also how
        `/availability-rules` spells the end of a range and the two readings
        are indistinguishable in the payload. Sending both `day_count` and
        `end_date` is a 422 as well.

        A span over a day comes back as `notes.departure_spans_days` on both
        the dry run and the commit.

        Overlapping departures at the same instant are permitted — the table
        has no uniqueness constraint on (bookable, from) and two slots at one
        time is a supported shape.

        Dry-run (`dry_run: true`) returns 200 with `would_apply: true` and a
        `diff` carrying only an `after` half (nothing existed before), and
        creates nothing.
      tags: [Availabilities]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAvailabilityRequest"
      responses:
        "201":
          description: |
            Created. `diff.after` carries the new departure; there is no
            `before` half, because nothing existed.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: "#/components/schemas/MutationResult"
                          - $ref: "#/components/schemas/DepartureSpanNotes"
        "200":
          description: |
            Dry-run preview. Nothing was created; `diff.after` describes the
            departure that would be.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: "#/components/schemas/MutationResult"
                          - $ref: "#/components/schemas/DepartureSpanNotes"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "422":
          description: |
            Invalid body. As well as the ordinary field errors, this is what
            an `end_date` more than a day after `date` returns — see the
            endpoint description. The message on `error.details.end_date`
            names both escapes: `POST /availability-rules` for a departure on
            each day of a range, `day_count` for one long departure.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /availabilities/{id}:
    get:
      operationId: showAvailability
      summary: Show an availability
      tags: [Availabilities]
      parameters:
        - $ref: "#/components/parameters/IdPath"
        - name: include_pricing
          in: query
          schema: { type: boolean, default: false }
          description: |
            When true, embed `pricing_tiers[]` with effective amount
            overlay. See `GET /availabilities` for the same semantics.
      responses:
        "200":
          description: Availability
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Availability" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateAvailability
      summary: Update a single availability row
      description: |
        Updates capacity, status, the departure window and/or per-slot pricing
        overrides on a single availability. For multi-row updates spanning a
        date range, use `POST /availabilities/bulk-update` — but note that
        endpoint is date-range scoped, so on a date carrying several sessions
        it writes every one of them. This is the only way to reprice, or to
        move, exactly one slot.

        **Moving a departure: `start_time` / `end_time` / `day_count`.** Both
        times are the product's LOCAL wall clock in `HH:MM`, matching how
        `availabilities.from` is stored and how `starts_at` reads back — they
        are written verbatim and never converted through a timezone. The date
        does not move; to put a departure on a different day, create the new
        one and delete the old.

        `start_time` alone SHIFTS the slot, preserving the duration it already
        has. Send `end_time` to change the duration as well, and `day_count`
        (whole days from the departure's own date to the date it ends on) for
        an overnight session; omitted, `day_count` keeps the span the slot
        already spans. A window that would end at or before it starts is a
        422.

        Returns 409 `AVAILABILITY_HAS_ACTIVE_BOOKING` when the slot carries a
        booking that has not been cancelled — wider than the confirmed-booking
        check on DELETE, because a pending reservation is a guest expecting a
        departure at an hour nothing on this surface would tell them had
        changed. The check runs in dry-run too, so a preview never shows a move
        the commit would refuse. This is the same predicate
        `POST /availabilities/bulk-update` uses to decide which rows a
        `start_time` change may touch; that endpoint skips such rows silently,
        this one refuses out loud.

        A committed move dispatches `AvailabilityUpdated` so the channels
        republish the slot at its new hour, and — for a ProductOption
        availability — a `vacancies: 0` retraction at the instant it left, since
        GetYourGuide keys inventory on `(productId, dateTime)` and would
        otherwise keep selling the old time. Both are best-effort and run after
        the commit, on the same terms as the fare fan-out below.

        **`fares[]` writes `availability_pricing_tier` for this slot only.**
        An entry with `amount: null` DELETES the override row so the slot
        follows the catalogue price again. Writing the catalogue value is not
        a substitute: the pivot row survives, `is_override` stays true, and
        the slot silently keeps the old number the next time the tier is
        repriced. Tiers not listed are left alone.

        Returns 422 when a `pricing_tier_id` belongs to another product's
        ladder, or when the availability is not attached to a ProductOption
        (a Resource availability has no pricing tiers).

        When `fares` is present, `diff.before` / `diff.after` carry the
        availability with its `pricing_tiers[]` overlay so the effective
        amount and `is_override` can be compared either side of the write.

        **Atomic.** A request carrying `capacity`/`status` AND `fares` commits
        both halves in one transaction, so a failure cannot leave the field
        change applied and the pricing write missing.

        A committed fare change then dispatches `PriceScheduleUpdated` so the
        channel managers pick it up the same way they do for a bulk reprice.
        That fan-out is **best-effort and runs after the commit** — a failing
        listener is reported, not surfaced, because turning an applied write
        into a 500 would invite a retry against state that already moved. A
        200 therefore means the fare is stored, not that the channels have
        been told.
      tags: [Availabilities]
      parameters:
        - $ref: "#/components/parameters/IdPath"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAvailabilityRequest"
      responses:
        "200":
          description: Updated (or dry-run preview)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/MutationResult" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            Idempotency conflict, OR
            `AVAILABILITY_HAS_ACTIVE_BOOKING` — a `start_time` / `end_time`
            change was refused because the slot carries a booking that has not
            been cancelled. `error.details.availability_id` echoes the path id
            and `error.details.active_bookings` carries the count. Raised in
            dry-run as well as on commit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      operationId: deleteAvailability
      summary: Delete a single availability row
      description: |
        Soft-deletes the availability (sets `deleted_at`). The row remains in
        the database; list endpoints exclude it by default. Returns 409
        `AVAILABILITY_HAS_CONFIRMED_BOOKING` if any confirmed Booking is
        attached to this availability — cancel or move the bookings first.

        For multi-row deletes spanning a date range, use
        `POST /availabilities/bulk-delete`.

        **Channel retraction.** When the row belongs to a ProductOption mapped
        to GetYourGuide, the delete also queues a `vacancies: 0` push so GYG
        stops selling the slot instead of waiting for its next scheduled
        availability pull. GYG has no delete endpoint, so a zero-vacancy push
        is the only retraction mechanism. Best-effort and asynchronous: the 204
        does not mean GYG has been told. The push is skipped when the slot is
        in the past or beyond the 90-day horizon, when `bookable_type` is not a
        ProductOption, when another live availability still occupies the same
        datetime, or when the option's product is already gone. Channels other
        than GYG are not wired up yet.

        Dry-run (`dry_run: true` in the JSON body) returns 200 with
        `would_apply: true` and the row in `diff.before`; no row is deleted and
        no retraction is queued. The 409 confirmed-booking precheck still runs
        in dry-run.
      tags: [Availabilities]
      parameters:
        - $ref: "#/components/parameters/IdPath"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204":
          description: Deleted
        "200":
          description: Dry-run preview (no row deleted)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/MutationResult" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            Idempotency conflict, OR
            `AVAILABILITY_HAS_CONFIRMED_BOOKING` — the availability has at
            least one confirmed Booking attached. `error.details.availability_id`
            echoes the path id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /availability-rules:
    post:
      operationId: createAvailabilityRule
      summary: Generate availabilities from a recurrence rule (asynchronous)
      description: |
        One-shot generator: takes a weekday-based recurrence rule and fans
        out to materialize Availability rows by dispatching the existing
        `CreateBatchAvailabilityJob` (same job the dashboard uses). NOT a
        persistent entity — the rule itself is not stored. Once the job
        runs, materialized rows are queryable via `GET /availabilities`.

        **Schedule type semantics:**
        - For `datetime` products a departure time is required: either the
          scalar `start_time` / `end_time` pair or `times[]`.
        - For `date`-only products times are ignored; rows span full days.
          At most ONE `times[]` entry is accepted there — every entry would
          widen to the same whole day.

        **Several departure times, one rule.** `times[]` carries
        `[{start_time, end_time, add_days_count?}, …]` and produces one
        departure per time per matching day. Mutually exclusive with the
        scalar pair; two entries naming the same
        `(start_time, end_time, add_days_count)` are a 422 — the day offset
        moves the `to` day, so it is part of the identity rather than
        decoration. This is one call and therefore one approval: the endpoint
        took one time per call, so a season with three daily departures
        across four date ranges needed eleven.

        **Weekdays:** a LIST of whole numbers, Sunday=0 through Saturday=6.
        An object keyed by day name (`{"monday": true}`) is refused with 422.

        **Dry-run:** returns `total_matched` (dates the rule matched),
        `would_create` (how many of those will actually be written), the
        same two counts plus `already_exists` **per departure time** under
        `rule.times`, and a sample of up to 3 of the `[from, to]` pairs that
        would be created. Read `rule.times` whenever the rule has more than
        one: the top-level counts are sums, so a time that would create
        nothing is invisible in them.
        Read `would_create`, not `total_matched`, to preview "this rule would
        create N Saturday slots": an occurrence whose `(from, to)` the option
        already has is skipped and counted under
        `skip_reasons.already_exists`, so re-running the same rule creates
        nothing.

        **No-op:** if nothing would be created — the date range × weekdays
        matched no dates, or every match already exists — the endpoint
        returns 200 with `status=no_op` and skips the dispatch. Otherwise
        returns 202 with `status=queued`. A dry-run preview carries no
        `status` at all; `would_apply` differentiates it from a no-op.

        **Idempotency:** standard CLI idempotency — replay-with-same-body
        rebroadcasts the cached response without re-dispatching the job.
      tags: [Availabilities]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAvailabilityRuleRequest"
      responses:
        "202":
          description: Queued — the recurrence job has been dispatched.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: "#/components/schemas/MutationResult"
                          - type: object
                            properties:
                              status: { type: string, enum: [queued] }
                              total_matched: { type: integer, description: "(date, time) pairs the rule matched." }
                              would_create: { type: integer, description: "Of those, how many will be materialized. Always > 0 here." }
                              skip_reasons:
                                $ref: "#/components/schemas/AvailabilityRuleSkipReasons"
                              rule:
                                $ref: "#/components/schemas/AvailabilityRulePreview"
        "200":
          description: |
            No-op (nothing to create), OR dry-run preview. `would_apply`
            differentiates: a dry run is `true` and carries no `status`.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: "#/components/schemas/MutationResult"
                          - type: object
                            properties:
                              status: { type: string, enum: [no_op], description: "Present on a no-op; absent on a dry-run preview." }
                              total_matched: { type: integer, description: "(date, time) pairs the rule matched. Non-zero on a no-op whose matches all already exist." }
                              would_create: { type: integer, description: "Of those, how many would be materialized. Zero on a no-op." }
                              skip_reasons:
                                $ref: "#/components/schemas/AvailabilityRuleSkipReasons"
                              rule:
                                $ref: "#/components/schemas/AvailabilityRulePreview"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/IdempotencyConflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /availabilities/bulk-update:
    post:
      operationId: bulkUpdateAvailabilities
      summary: Bulk update availabilities across a date range (asynchronous)
      description: |
        Update capacity, status, and/or pricing-tier overrides for a set of
        departures. Used for weather cancellations, seasonal capacity
        shifts, schedule changes.

        **Two scopes, exactly one of them.** `availability_ids` names the
        exact rows; `product_option_id` (one, or a list) with `from` and `to`
        takes every departure in a half-open range. Reach for the id scope
        whenever the request contains an exception — "close everything that
        day except the one that is booked" is not a date range — or whenever
        the preview needs to be exact rather than predicted.

        **Asynchronous.** On commit the server (a) creates a
        `BulkAvailabilityUpdate` audit row capturing the filters and new
        values, then (b) chunks the matched availability IDs into batches of
        ~1000 and dispatches `BulkAvailabilityUpdateJob` instances on the
        `inventory` queue. The HTTP response returns 202 Accepted with
        `bulk_update_id` and `total_matched` (the count of *queued* rows, not
        completed). Actual processing happens in the background; there is no
        in-band completion signal in V1.

        Dry-run (`dry_run: true`) returns 200 with `total_matched` and no
        side effects — no audit row, no jobs dispatched.

        **`notes` is not `skip_reasons`.** Both ride on the dry run and they
        mean opposite things: `skip_reasons` counts rows the change will
        REFUSE, `notes` states facts about rows that WILL change. Today the
        only note is `has_live_bookings`, emitted when `setting=booking_status`
        with `is_bookable: false` — how many of the matched departures are
        sold. Nothing is refused; closing a departure cancels no booking and
        moves no money. It is there so a caller can offer the operator the
        exclusion (`availability_ids` minus those rows) rather than leaving
        them to think of it.
      tags: [Availabilities]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkUpdateAvailabilityRequest"
      responses:
        "202":
          description: |
            Accepted. The server has created a `BulkAvailabilityUpdate` audit
            row and queued `BulkAvailabilityUpdateJob` instances on the
            `inventory` queue. Actual updates run asynchronously in the
            background. There is no in-band completion signal in V1 — clients
            confirm by polling `/availabilities` or by inspecting the
            availabilities the audit row's `filters_json` matched. The Phase 2
            polling endpoint will be `GET /availabilities/bulk-updates/{id}`.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: "#/components/schemas/MutationResult"
                          - type: object
                            properties:
                              bulk_update_id:
                                type: string
                                description: ID of the `BulkAvailabilityUpdate` audit row
                              total_matched:
                                type: integer
                                description: Number of availability rows the filter matched and queued for update; not a count of completed updates
                              status:
                                type: string
                                enum: [queued]
                                description: V1 only emits "queued"; Phase 2 will add "completed", "partially_completed"
        "200":
          description: |
            Dry-run preview (no jobs dispatched), OR no-op when the filter
            matched zero availability rows (no audit row created, no jobs
            queued). The no-op response carries `status: "no_op"` and
            `bulk_update_id: null` — clients should NOT poll for completion
            in that case.

            **`setting=pricing` dry-runs carry a real diff.** `total_matched`
            on its own is just the date-range row count — identical whether
            the proposed amount matches the current fare or is wildly
            different — so it cannot answer "will this change anything?".
            A pricing preview adds `total_changed` (matched slots whose
            effective price or pinned/unpinned state would move, counted over
            the WHOLE range) plus `diff.before` / `diff.after`, which list the
            first `preview_limit` matched slots with their current and
            proposed fares. `preview_truncated` is true when the range is
            longer than that listing; the counts still cover everything.

            A slot that has no override today and is being written to the
            catalogue value still counts as changed: the write pins it.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: "#/components/schemas/MutationResult"
                          - type: object
                            properties:
                              total_matched: { type: integer }
                              would_update:
                                type: integer
                                description: "Dry-run only. Matched rows that will actually change; `total_matched` minus everything the setting refuses."
                              would_skip:
                                type: integer
                                description: "Dry-run only. Matched rows the setting will refuse."
                              skip_reasons:
                                type: object
                                additionalProperties: { type: integer }
                                description: "Dry-run only. Why rows will be refused, by reason — `has_active_bookings`, `capacity_below_booked`, `resource_managed_capacity`."
                              notes:
                                type: object
                                additionalProperties: { type: integer }
                                description: |
                                  Dry-run only, and the OPPOSITE of
                                  `skip_reasons`: facts about rows that will
                                  change anyway. Always present, often empty.
                                  `has_live_bookings` counts matched
                                  departures that are sold, and is emitted
                                  only when closing (`setting=booking_status`,
                                  `is_bookable: false`) — opening a sold
                                  departure is unremarkable, and everywhere
                                  else the same question is already answered
                                  by a refusal in `skip_reasons`.
                              total_changed:
                                type: integer
                                description: "`setting=pricing` dry-run only. Matched slots whose fares would actually move."
                              preview_limit:
                                type: integer
                                description: "`setting=pricing` dry-run only. How many slots `diff` spells out."
                              preview_truncated:
                                type: boolean
                                description: "`setting=pricing` dry-run only. True when more slots matched than `diff` lists."
                              status:
                                type: string
                                enum: [preview, no_op]
                              diff:
                                type: [object, "null"]
                                description: "`setting=pricing` dry-run only; null for every other setting."
                                properties:
                                  before:
                                    type: object
                                    properties:
                                      availabilities:
                                        type: array
                                        items: { $ref: "#/components/schemas/AvailabilityFarePreview" }
                                  after:
                                    type: object
                                    properties:
                                      availabilities:
                                        type: array
                                        items: { $ref: "#/components/schemas/AvailabilityFarePreview" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "409": { $ref: "#/components/responses/IdempotencyConflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /availabilities/bulk-delete:
    post:
      operationId: bulkDeleteAvailabilities
      summary: Bulk soft-delete availabilities across a date range (synchronous)
      description: |
        Soft-deletes every availability of one ProductOption inside
        `[from, to)` in a single UPDATE on `deleted_at`. Synchronous — the
        response carries the actual `total_deleted` count, no polling
        required.

        **All-or-nothing on confirmed bookings.** Before any rows are
        touched, the server scans the matched range for availabilities with
        a confirmed Booking attached. If any are found the entire request
        is rejected with 409 `AVAILABILITY_HAS_CONFIRMED_BOOKING` and
        `error.details` carries `total_blocked` plus a sample of up to 20
        availability ids. Operator must cancel/move those bookings or
        narrow the range and retry.

        **Cascade caveat.** Soft-delete is a single bulk UPDATE that
        bypasses model events, so the `Availability → pricingTiers`
        cascade does NOT run. This is intentional: pricing tiers are M:N
        with availabilities, so cascading from one row would soft-delete
        tier rows still referenced by other availabilities.

        **Channel retraction.** Because the bulk UPDATE fires no model events,
        the removal is announced explicitly: if the ProductOption is mapped to
        GetYourGuide, a `vacancies: 0` push is queued for the deleted slots.
        GYG has no delete endpoint, so a zero-vacancy push is the only
        retraction mechanism. Best-effort and asynchronous: the 200 does not
        mean GYG has been told. Only future slots inside the 90-day horizon are
        sent — a year-long range deletes every matched row but retracts only
        the near-term ones, leaving the rest to GYG's next scheduled pull. A
        datetime that still has another live availability behind it is never
        retracted. Channels other than GYG are not wired up yet.

        **No-op:** if the filter matches zero rows, returns 200 with
        `total_deleted: 0` and `status: "no_op"`.

        **Dry-run:** returns 200 with `total_matched`, `status: "preview"`
        and no side effects. The 409 confirmed-booking precheck still runs.
      tags: [Availabilities]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkDeleteAvailabilityRequest"
      responses:
        "200":
          description: |
            Deleted (real call), no-op (zero matches), or dry-run preview.
            `data.status` differentiates: `deleted` | `no_op` | `preview`.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: "#/components/schemas/MutationResult"
                          - type: object
                            properties:
                              total_matched:
                                type: integer
                                description: Number of rows the filter matched (present on dry-run).
                              total_deleted:
                                type: integer
                                description: Number of rows soft-deleted (present on real call / no-op).
                              status:
                                type: string
                                enum: [preview, no_op, deleted]
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "409":
          description: |
            Idempotency conflict, OR
            `AVAILABILITY_HAS_CONFIRMED_BOOKING` — at least one row in the
            matched range has a confirmed Booking. `error.details` carries
            `total_blocked` (count) and `sample_availability_ids` (up to 20
            ids). No rows are deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422": { $ref: "#/components/responses/ValidationError" }

  /pricing-categories:
    get:
      operationId: listPricingCategories
      summary: List pricing categories
      description: |
        Pricing categories are the parent buckets (`Adults`, `Children`, etc.)
        that pricing tiers attach to. Filter by `product_id` to scope to a
        single product.

        **No `since`.** The `pricing_categories` table carries no `created_at` /
        `updated_at` columns at all, so there is nothing for `since` to bound.
        Sending it returns 422 — deliberately, rather than a silently
        unfiltered page that a polling client would read as a delta. The
        `created_at` / `updated_at` fields on the response are always null for
        the same reason. There is no incremental-sync signal for this
        resource: list it in full and diff client-side.
      tags: [PricingCategories]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/IncludeTrashed"
        - $ref: "#/components/parameters/Cursor"
        - name: product_id
          in: query
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Page of pricing categories
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PricingCategoryPage"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "422": { $ref: "#/components/responses/ValidationError" }

    post:
      operationId: createPricingCategory
      summary: Create a pricing category
      description: |
        Creates the parent bucket that one or more pricing tiers will live
        under. The `name` is translatable (stored as the `{"en": "..."}`
        HasTranslations bag); pass a bare string and the server wraps it.
        Defaults `type` to `TRAVELLER`. The optional `min_age`/`max_age`
        let you describe the bucket's age range without baking it into the
        name. No implicit overrides — input passes through as supplied.
      tags: [PricingCategories]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePricingCategoryRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: "#/components/schemas/MutationResult"
                          - type: object
                            properties:
                              pricing_category: { $ref: "#/components/schemas/PricingCategory" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/IdempotencyConflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /pricing-categories/{id}:
    get:
      operationId: showPricingCategory
      summary: Show a pricing category
      tags: [PricingCategories]
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Pricing category
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/PricingCategory" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

    patch:
      operationId: updatePricingCategory
      summary: Update a pricing category
      tags: [PricingCategories]
      parameters:
        - $ref: "#/components/parameters/IdPath"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePricingCategoryRequest"
      responses:
        "200":
          description: Updated (or dry-run preview)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/MutationResult" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/IdempotencyConflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

    delete:
      operationId: deletePricingCategory
      summary: Soft-delete a pricing category
      description: |
        Soft-deletes the category and cascades to its pricing tiers
        (`PricingCategory::$cascadeDeletes = ['pricingTiers']`).
      tags: [PricingCategories]
      parameters:
        - $ref: "#/components/parameters/IdPath"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204": { description: Soft-deleted }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/IdempotencyConflict" }

  /pricing-categories/{id}/restore:
    post:
      operationId: restorePricingCategory
      summary: Restore a soft-deleted pricing category
      tags: [PricingCategories]
      parameters:
        - $ref: "#/components/parameters/IdPath"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Restored
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/MutationResult" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  /pricing-tiers:
    get:
      operationId: listPricingTiers
      summary: List pricing tiers
      description: |
        **Filtering:** scope by `product_id` (catalogue view) or
        `availability_id` (per-slot view).

        `product_option_id` is intentionally not supported:
        `pricing_categories.product_option_id` was renamed to `product_id`
        in 2022, so tiers scope by product, not by product option.

        Passing `availability_id` auto-scopes the result to the tiers
        reachable from the availability's product (resolved via
        `availability.bookable → ProductOption → product`) and overlays
        the per-slot `availability_pricing_tier.fare` onto each tier's
        `amount`. The response also carries `default_amount` and
        `is_override` so callers can detect and diff overrides. If the
        availability isn't tied to a ProductOption (e.g. a Resource
        availability) the response is an empty page.

        Combining `product_id` and `availability_id` returns 422 — they
        describe overlapping scopes and silently picking one would hide
        the conflict.

        **No `since`.** The `pricing_tiers` table carries no `created_at` /
        `updated_at` columns at all, so there is nothing for `since` to bound.
        Sending it returns 422 — deliberately, rather than a silently
        unfiltered page that a polling client would read as a delta. The
        `created_at` / `updated_at` fields on the response are always null for
        the same reason. There is no incremental-sync signal for this
        resource: list it in full and diff client-side.
      tags: [PricingTiers]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/IncludeTrashed"
        - $ref: "#/components/parameters/Cursor"
        - name: product_id
          in: query
          schema: { type: integer, minimum: 1 }
          description: Returns tiers belonging to this product (via the pricing_category relation).
        - name: availability_id
          in: query
          schema: { type: integer, minimum: 1 }
          description: |
            Returns tiers reachable from this availability's product
            with per-slot overrides overlaid onto `amount`. Mutually
            exclusive with `product_id`.
      responses:
        "200":
          description: Page of pricing tiers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PricingTierPage"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "422": { $ref: "#/components/responses/ValidationError" }

    post:
      operationId: createPricingTier
      summary: Create a pricing tier
      tags: [PricingTiers]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePricingTierRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: "#/components/schemas/MutationResult"
                          - type: object
                            properties:
                              pricing_tier: { $ref: "#/components/schemas/PricingTier" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "409": { $ref: "#/components/responses/IdempotencyConflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /pricing-tiers/{id}:
    get:
      operationId: showPricingTier
      summary: Show a pricing tier
      description: |
        When `availability_id` is supplied the per-slot
        `availability_pricing_tier.fare` is overlaid onto `amount` and
        the `default_amount` / `is_override` fields are added. Returns
        404 if the tier isn't reachable from the availability's product,
        since surfacing it with overlay fields would imply it applies
        to that availability when it does not.
      tags: [PricingTiers]
      parameters:
        - $ref: "#/components/parameters/IdPath"
        - $ref: "#/components/parameters/IncludeTrashed"
        - name: availability_id
          in: query
          schema: { type: integer, minimum: 1 }
          description: |
            Overlay the per-slot override for this availability onto
            `amount`. Returns 404 if the tier isn't reachable from the
            availability's product.
      responses:
        "200":
          description: Pricing tier
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/PricingTier" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

    delete:
      operationId: deletePricingTier
      summary: Delete a pricing tier (soft-delete)
      description: |
        Soft-deletes the pricing tier (sets `deleted_at`). Existing booking
        references stay valid; the tier no longer appears in active lists.
        Restore via `POST /pricing-tiers/{id}/restore`.

        **WARNING — data-loss adjacency:** `PricingTier::$cascadeDeletes = ['availabilities']`. Soft-deleting a tier soft-deletes every Availability rendered against it. Calendar data for that tier disappears. Always run `--dry-run` first; consider exporting affected availabilities before delete.
      tags: [PricingTiers]
      parameters:
        - $ref: "#/components/parameters/IdPath"
        - $ref: "#/components/parameters/IdempotencyKey"
