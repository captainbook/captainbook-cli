openapi: 3.1.0
info:
  title: CaptainBook Inventory CLI API
  version: 1.29.0
  description: |
    Internal HTTP JSON API serving the CaptainBook inventory CLI client
    (which lives in a separate repository). Primary consumer is Claude Code
    piloting the CLI on behalf of supplier-tenant operators and CB Customer
    Success engineers.

    ## Conventions

    - **Tenant resolution:** all endpoints mount under the tenant subdomain
      `{tenant_slug}.captainbook.io/api/v1/cli/*`. Tenant context is initialised via
      `Stancl\Tenancy\Middleware\InitializeTenancyByDomainOrSubdomain`,
      mirroring Octo and the Statistics API. There is no header-based or
      query-param tenant override.
    - **Auth:** Sanctum personal-access-token in `Authorization: Bearer <token>`.
      Per-token `expires_at` is enforced framework-side by Sanctum 4's
      `Guard::isValidAccessToken()`.
    - **Authorization:** the token's abilities (`cli:read` / `cli:write` /
      `cli:cs`) decide which endpoints are reachable; the *permissions of the
      user the token was issued to* decide which data comes back. Every
      endpoint runs the same policy the web UI runs for that resource — a
      caller without `view_any_booking` gets `403 FORBIDDEN` on
      `GET /bookings` even with a valid `cli:read` token. Two consequences
      worth designing for:
        - A caller holding `view_own_booking` (declared `exclusive_of`
          `view_any_booking`) sees only the bookings their linked resource is
          assigned to. List endpoints return a smaller page rather than a 403.
        - `Booking.customer.name` / `.email` / `.phone` and the inline
          `guests` array are withheld from a caller without
          `view_booker_of_booking` (`customer.id` survives, so the payload
          stays joinable); `total_amount` / `paid_amount` / `refunded_amount` /
          `transactions` are null/empty without `see_money_of_booking`; and
          `answers` is null without `view_answers_of_booking`. The keys are
          always present; only the values are withheld.
        - The dedicated child endpoints agree with those field gates rather
          than letting a caller walk around them: `GET /transactions` also
          requires `see_money_of_booking`, and `GET /guests` also requires
          `view_booker_of_booking`. A guest outside the caller's business unit
          or assigned trips reads as `404 NOT_FOUND`, not `403`, so the id
          space is not enumerable.
      `403 FORBIDDEN` is omitted from individual operation definitions to keep
      the spec terse but applies to every endpoint; consult the `Forbidden`
      shared response for the body shape.
    - **Money:** integer minor units (`15000` = 150.00 EUR; `15000` = 150 JPY).
      Currency is the tenant's currency, surfaced via `meta.currency`. It is an
      **account-level** setting and there is exactly one of it: `products`,
      `extras`, `pricing_tiers` and `available_gift_certificates` carry no
      currency column, so no per-record currency exists to choose. The
      `currency` field on those create payloads is there for symmetry with the
      read shape and is dropped on persist — but it must match the account
      currency, or the request is refused with `422 VALIDATION_FAILED` naming
      it. Do not convert amounts client-side; a caller quoting prices in
      another currency has to restate them.
    - **List filters:** a list endpoint accepts exactly the query parameters
      documented on it, plus `limit` and `cursor` where it paginates.
        - Any other key carrying a value is refused with
          `422 VALIDATION_FAILED`, the error keyed on the parameter and naming
          what the endpoint does accept. It is never ignored: an ignored
          filter returns the unfiltered list as though it had applied.
        - A parameter takes a single value unless it is documented as a list:
          `?key[]=x`, or an array or object through MCP, is a 422.
        - Any parameter sent EMPTY (`?foo=`, or `"foo": null` / `""` through
          MCP), documented or not, means no filter: it is neither refused nor
          validated. `false` is a VALUE, not an empty — `{"is_private": false}`
          on a resource that does not document `is_private` is refused, where
          dropping it would have answered with every row.
        - Every documented parameter is TYPED, and a value of the wrong type is
          a 422. This matters most over MCP, where `filters` is JSON: a number
          or a boolean on a string parameter (`{"reference": 123}`) used to
          reach MySQL as itself and be compared loosely, so `123` also matched
          `123-ABC`. An id parameter takes an integer `>= 1`, as a JSON number
          or a numeric string; `0`, a boolean and anything non-numeric are all
          refused rather than read as a filter or as none.
        - A boolean flag (`include_trashed`, `include_cancelled`,
          `include_pricing`, `has_capacity`, `auto_apply`, `required`) accepts
          `true false 1 0 yes no on off`, or a JSON boolean over MCP. Anything
          else is a 422 rather than being read as false. A flag is read from
          the QUERY STRING only — a GET body cannot override it.
        - Only a TRUE value for `has_capacity` filters; `has_capacity=false` is
          no filter, not "only full slots".
        - `/pricing-tiers/{id}`, `/segment-fields` and `/workflow-nodes`
          validate their query the same way without paginating, so they
          refuse `limit` and `cursor` too.
    - **Translatable fields:** API responses always return the English
      translation of Spatie-translatable columns (matches the Statistics API
      contract — see commit `e51d27658`).
    - **Idempotency:** every mutating endpoint accepts an
      `Idempotency-Key: <UUIDv7>` request header. The `request_hash` for
      replay matching is SHA-256 of the canonical-JSON (RFC 8785) of the
      request body, excluding the `dry_run` field. See
      `app/Support/Cli/Canonicalize.php` (vendored, fuzz-tested against
      `canonicalize` npm reference).
      A key is **bound to the request it was first used on** — its HTTP method
      and its path (including query string) as well as its body. Reusing one
      key across two resources or two endpoints returns `409
      IDEMPOTENCY_CONFLICT`, not a replay. Generate one key per operation;
      reuse it only when retrying *that* operation. The resource id lives in
      the path on nearly every mutating endpoint, so without this binding
      `POST /gift-certs/issued/A/void` and `POST /gift-certs/issued/B/void`
      share a body and the second replays the first — a `200` and a success
      envelope for an operation that never ran.
      A request refused at the gate (`401` / `403`, and the `404` returned when
      the tenant's plan does not include workflows) **releases** its key rather
      than recording it: nothing ran, so there is no outcome to replay. The key
      is free to reuse — including with a different body, since the release
      drops its hash binding too. This is what makes "fix the token, retry with
      the same key" safe. A `404` from a *handler* (the row does not exist) is
      an outcome and does replay.
    - **Dry-run:** every mutating endpoint accepts `dry_run: true` in the
      body. The handler runs validation, authorization, and computes the
      diff, but suppresses all side effects (DB transaction rolled back,
      jobs not dispatched, mail not sent, Stripe not called). Response
      includes `data.diff` and `data.would_apply: true`. Dry-run always
      returns `200 OK` regardless of the real-run status code — even on
      create endpoints (which return `201 Created` for real writes),
      because nothing was created.
    - **Pagination:** all list endpoints use forward-only cursor pagination.
      Default `limit=50`, max `200`. Backward pagination is Phase 2.
      One endpoint narrows both: `GET /resource-calendar` defaults to `25` and
      refuses more, because its rows carry two operator-authored strings and the
      MCP result ceiling is measured in Unicode-ESCAPED bytes. See `1.29.0`.
    - **Throttle:** plan-based (60 req/min on starter, 240 on ultra).
    - **Rate limit:** every endpoint may return `429 Rate Limited` with a
      `Retry-After` header (seconds). Plan-based: 60/min on starter, 240/min on
      ultra/corporate. The 429 response is omitted from individual operation
      definitions to keep the spec terse but applies universally; consult the
      `RateLimited` shared response for the body shape and stable `code`.
    - **Date-range filters (`from`/`to` on list endpoints):** half-open interval
      `[from, to)` — `from` is inclusive, `to` is exclusive. Example:
      `?from=2026-04-01&to=2026-05-01` matches April 2026 in full and excludes
      May 1. Date-typed filters (e.g. `Booking.starts_at`) are interpreted in
      the tenant's configured timezone (`Organisation.timezone`). Date-time-typed
      filters (e.g. `Transaction.created_at`) are UTC unless the supplied value
      carries an explicit `±HH:MM` offset.
    - **Timezones in responses:** trip times (`Availability.starts_at` /
      `ends_at`, and `Booking.starts_at` / `ends_at`, which are read from the
      linked availability) are emitted with the **product's** UTC offset —
      `2026-08-04T10:00:00+01:00` is a 10:00 local departure for a product in
      `Europe/London`. Every other timestamp (`created_at`, `updated_at`,
      `confirmed_at`, `cancelled_at`, `expires_at`, `deleted_at`, …) is a
      genuine UTC instant emitted as `+00:00`. Availabilities not backed by a
      product option (e.g. resource-backed rows) have no product to attribute,
      so they fall back to `+00:00`.

    ## What this API is NOT

    - Not the public reseller API (see `/api/v1/suppliers/...` and Octo).
    - Not the customer-facing widget API.
    - Not for end-traveler self-service.

    ## Changes

    `info.version` moves when the contract does, so a client vendoring this file
    byte-for-byte can tell which copy it holds by reading it. **It is a serial
    number, not a semver range** — do NOT treat a minor bump as "compatible" or
    write a `^1.0`-style constraint against it. This is an internal API with one
    known consumer; breaking changes ship here without a major bump and are
    marked **Breaking** below. The URL major (`/api/v1/cli`) is a separate axis
    and does not move.

    - **1.29.0** — New read endpoint: `GET /resource-calendar`. Additive; no
      existing endpoint changes shape.

      It answers "when is this guide or asset busy", merging three families a
      caller previously had no single way to ask about: confirmed bookings,
      synced Google Calendar time, and operator-authored blocks.
      `GET /bookings?resource_id=` already covered the booking third, and that
      was the trap — a caller reading only bookings reports a guide as FREE
      while a calendar conflict or a block says otherwise, which is a
      confidently wrong answer rather than a missing one.

      Three things about it differ from every other list endpoint here, each
      deliberately:

      - `resource_id` is **required** (one id, or up to 10). Omitting it would
        mean the whole business unit's calendar in one call, and the resource
        cap would then be bounding an empty list.
      - `limit` defaults to **25** and is refused above it, where every other
        list defaults to 50 and allows 200. The rows carry two
        operator-authored strings (`resource_name`, and `status` from a block's
        summary) and the MCP ceiling counts json_encoded bytes with Unicode
        escaped — 6 bytes a character for Greek, 12 for a non-BMP emoji. A page
        of 50 such rows measured 78,046 bytes against a 50,000-byte ceiling,
        i.e. a non-retriable refusal on an ordinary request.
      - It reports **busy intervals only, never free time.** An empty page is
        not proof a resource is available, and a response carrying
        `unavailable_resources` is incomplete for the ids it names — a guide
        with no Google connection, or a window past what we have synced. That
        key is absent when every answer is complete, so its presence is the
        signal.

      A booking on a product the operator has since DELETED still appears: the
      cascade soft-deletes the option and its availabilities, but the booking is
      live and the guide is still committed, so hiding it would be the same
      under-report the endpoint exists to remove.

    - **1.28.0** — `POST /availability-rules` refuses a `capacity` the product
      option's RESOURCES decide, and reports `rule.capacity_source`. Additive
      for every caller whose options carry no capacity-bearing resources;
      a 422 for one that sent `capacity` for an option where it could never
      have applied.


      `Availability::getCumulativeCapacity()` prefers a resource-derived total
      over `availabilities.capacity`, and `cumulative_capacity` is what the
      sellability readers use — so for such an option the `capacity` accepted
      in 1.27.0 was stored and then never consulted. The caller asked for 12,
      `rule.capacity` confirmed 12, and the season sold whatever the guides or
      the auxiliary inventory added up to. That is the same accept-and-discard
      1.27.0 closed, one layer in, and the echo made it worse rather than
      better: it stated the wrong number confidently instead of omitting it.


      `rule.capacity` is therefore the EFFECTIVE number rather than the
      requested-or-inherited one, and `rule.capacity_source` names which of
      `rule` / `product_option` / `resources` produced it. Omitting `capacity`
      on a resource-managed option is accepted and reports
      `capacity_source: resources` with the resource total.
    - **1.27.0** — `POST /availability-rules` takes `capacity`. Additive: omitting
      it keeps inheriting the product option's own capacity, which is what the
      endpoint has always done, so no existing caller changes.

      It was the one availability write with no way to say it. Both siblings
      write the same column — `POST /availabilities` REQUIRES `capacity` and
      `bulk-update` has `setting: capacity` — so a payload carrying it here was
      dropped by the validator without a word: `202`, a correct `would_create`,
      a `rule` echo with no `capacity` key at all, and a season of departures
      on sale at a number the caller never asked for. Reported by an operator
      whose agent sent `capacity: 12` after learning the field name from
      `create_availability`; it is the bulk endpoint, so the discard was
      multiplied by the span and every row was publishable to GetYourGuide and
      Viator.

      `0` is accepted and means published-but-closed — `is_bookable` is what
      decides whether a departure sells — so a client must not read this field
      with a truthiness test. A JSON boolean, a float or a non-numeric value is
      a `422`, as on every other numeric write since `1.25.0`.

      `AvailabilityRulePreview.capacity` is new and is the RESOLVED value,
      present on every response whether or not the request named one. So a dry
      run states the seats a commit will put on sale even for the ordinary
      payload that inherits; previously there was nothing on the card to read.
    - **1.26.0** — Documentation only; no request or response shape changes.
      **Ten refusals the server has always raised were named nowhere a client
      could reach from the endpoint that raises them** — measured, with the
      `$ref`s resolved — and **four of those were named nowhere in this document
      at all**, two of them on `POST /bookings/{id}/refund`. One of the four was
      additionally described with the WRONG STATUS. On that measure it is now zero:
      every code the CLI can raise is named somewhere under `paths`. Read the
      limit below before taking that for per-endpoint completeness.

      Bookings. `refund` documented its `409` as
      `#/components/responses/IdempotencyConflict` alone, so the only refusals
      a client could see were the three idempotency ones, while the endpoint
      also raises `REFUND_REQUIRES_STRIPE_CHARGE` (the booking was paid by cash
      or voucher) and `NO_CHARGE_FOUND` (nothing left to refund). A client
      receiving either had no branch for it and read the documented 409 as a
      key problem — on the endpoint that moves money. `cancel` had the same
      shape: `NO_CHARGE_FOUND` on `refund_policy: partial` against a booking with
      nothing refundable — and ONLY on `partial`, because `full` has no such
      guard and instead succeeds with `refund_amount: 0`, which is now stated
      on the operation. Plus `POLICY_AUTO_NOT_READY` for `refund_policy: auto`,
      which was described in prose but filed under no response. All four are raised from
      ANONYMOUS `CliDomainException` subclasses declared inline in
      `BookingController`, which is why no audit of `app/Exceptions/Cli/` had
      ever seen them.

      Workflows. `PATCH /workflows/{id}/trigger` on a workflow with no trigger
      said "404 if no trigger exists yet". It is a **409** with
      `error.code: WORKFLOW_TRIGGER_MISSING` and a hint naming the POST. The
      controller did `abort(404)` once and was changed deliberately — a 404
      reads as "no such workflow" when the workflow is right there — but the
      spec sentence was never moved, so a client that implemented the
      documented 404 branch could never enter it. `DELETE /workflows/{id}`
      likewise pointed its 409 at the idempotency component alone while also
      raising `WORKFLOW_HAS_EXECUTIONS`: a workflow with terminal execution
      rows cannot be deleted at all, because the run history is kept for
      support. That operation's description made the opposite promise, so
      delete read as always available when for any workflow that has been live
      it is the exception; `deactivate` is the route that stops one.

      `components.schemas.Error.code` is now the COMPLETE catalogue of every
      code the API can return, grouped by area. Measured against the previous
      revision it listed 10 of the 19 domain codes and had gone stale on
      **nine**, and it is the list a client author reads first. It stays `type: string`
      rather than becoming an `enum`, so a client keeps tolerating a code it
      does not know — an enum would make a generated client reject the next
      refusal we ship.

      Three more endpoints name the refusal they raise for the first time:
      `POST /gift-certs/issued/{id}/void` (`GIFT_CERT_ALREADY_REDEEMED`),
      `DELETE /gift-certs/available/{id}` (`RESOURCE_IN_USE`) and
      `DELETE /locations/{id}`, whose 409 described the condition in prose but
      never named the code. With those, every code the CLI can raise is named
      SOMEWHERE under `paths`, with no pinned exceptions — which is what the
      architecture test asserts.

      Read that precisely, because it is weaker than it sounds: the check is
      per-DOCUMENT, not per-operation. A code named on one operation satisfies
      it for every operation, so an endpoint can still raise a refusal its own
      `responses` do not name — `POST /bookings/{id}/comp` and
      `.../notifications/resend-confirmation` both raise
      `BOOKING_ALREADY_CANCELLED` while documenting their 409 as
      `#/components/responses/IdempotencyConflict` alone, and the same is true
      of `WORKFLOW_NOT_EDITABLE` on the step endpoints, `INVALID_STEP_CONFIG`,
      `DISCOUNT_NOT_APPLICABLE` and `WORKFLOW_NOT_ACTIVATABLE`. Proving that
      needs an operation-to-controller-method map, including the codes raised
      transitively through validators, and is tracked as captainbook#8489.

      Nothing here changes behaviour: the two workflow refusals are pinned by
      `WorkflowControllerTest`, `REFUND_REQUIRES_STRIPE_CHARGE` by
      `Phase1CTier2And3Test` and `POLICY_AUTO_NOT_READY` by
      `Phase1CCancelTest`, all under
      `tests/Feature/Controllers/Api/Cli/`. `NO_CHARGE_FOUND` had no test at
      all and gets its first one here, covering the refund site; it is raised
      from a second, separate declaration on `cancel`'s `partial` arm, which
      remains untested.

      `tests/Architecture/CliErrorCodeSpecParityTest.php` fails the build on a
      code the contract does not name, on one filed under a status it is not
      raised with, on one missing from the `Error.code` catalogue, and on two
      declarations of one code that disagree about its status. It discovers exceptions
      with the PHP tokenizer across `app/` — named classes anywhere plus the
      anonymous ones above — and resolves each status through the class, so a
      subclass inheriting `CliDomainException`'s 409 is checked rather than
      skipped. `CODES_WITHOUT_A_RESPONSE` is the exception list for codes
      named nowhere under `paths`, and it is EMPTY, so a new code cannot be
      waved through by a line in the catalogue — adding a member to it needs a
      reason in the PR.
    - **1.25.0** — **Breaking** for a caller sending a JSON boolean, a float or a
      non-numeric id to a write endpoint: those are now `422` where they used to
      be read as `1`. Every other spelling is unchanged.

      Laravel's `integer` rule is
      `filter_var($value, FILTER_VALIDATE_INT) !== false`, and `filter_var`
      STRINGIFIES first — so a JSON `true` becomes `"1"` and passes. Over MCP a
      request body is real JSON, so `{"capacity": true}` published a one-seat
      departure and `{"product_id": true}` created a row against whichever
      product owns id 1. Fifteen ids carried **no type at all**
      (`['required']`), which is the sharper half: a wrong scalar is visible in
      the response, a wrong ROW is not.

      Every integer field across the 26 write requests now carries `numeric`
      ahead of `integer` — `is_numeric()` answers false for a bool and true for
      both `5` and `"5"`, so no caller is narrowed — and every integer id is
      `PositiveIntegerId`, the component the availability writes already used.
      The two UUID ids are typed as such instead: `transaction_id` on
      `POST /bookings/{id}/refund` and `available_gift_certificate_id` on
      `POST /gift-certs/issued`, where `true` reached a varchar comparison that
      MySQL coerces to a number. `attach_to_id` on `POST /locations` is the one
      id that is neither, because it is polymorphic in KEY TYPE — `products`
      and `partners` are integer ids while an organisation's is the tenant
      string — so it is guarded as "a string or an integer" rather than typed.

      The five availability writes (`POST /availabilities`, `PATCH
      /availabilities/{id}`, `POST /availability-rules`, `POST
      /availabilities/bulk-update`, `POST /availabilities/bulk-delete`) were
      closed in `1.22.0` and do not change here. They were a separate pass
      because they share fields with each other and with nothing above: a
      value one of them refuses that stays reachable through a sibling is a
      detour rather than a fix. The requests here write other tables, which
      is why "fix the surface" meant a different surface each time.

      `tests/Architecture/CliWriteIntegerTypingTest.php` fails the build on an
      `integer` rule without `numeric`, and on an untyped id, anywhere under
      `app/Http/Requests/Api/Cli`.
    - **1.24.0** — Documentation only; no request or response shape changes.
      Two error responses were described by the SUCCESS envelope, and
      `product_option_id` was typed as a bare string on four write schemas.

      `POST /availabilities` and `PATCH /products/{id}` pointed their `422` at
      `Envelope`, which requires `meta` and `data` and declares no `error` —
      so a generated client either refuses the body or cannot reach
      `error.details`, which is the whole reason a caller reads a 422. The
      second one shipped an EXAMPLE with no `data` key beside a schema
      requiring one, so the document contradicted itself inside a single
      block; its `allOf: [Envelope, { error }]` spelling is why that read as
      correct — it names the error and still inherits `required: [meta, data]`
      from the branch beside it. Both now point at `ErrorEnvelope`, matching
      the 65 responses that use `#/components/responses/ValidationError` and
      the one inline precedent that was already right
      (`POST /workflows/{id}/activate`).

      `product_option_id` is now `PositiveIntegerId`, declared once and
      referenced by `CreateAvailabilityRequest`,
      `BulkDeleteAvailabilityRequest`, `CreateAvailabilityRuleRequest` and the
      scalar arm of `BulkUpdateAvailabilityRequest`. It was `type: string` on
      all four against rules of `['numeric', 'integer', 'min:1']`, so `"abc"`
      satisfied the published contract and was a 422. **Not `type: integer`**:
      the string spelling really is accepted — `integer` is `filter_var`,
      which stringifies first — and the operator assistant sends one, so
      documenting the number alone would contradict our own first-party
      caller. Measured against the real validator rather than read off the
      rule names.

      `tests/Architecture/OpenApiErrorResponseShapeTest.php` fails the build
      on an error response that requires `data`, in either published spec, and
      on an error example its own schema would reject.
    - **1.23.0** — Documentation only; no request or response shape changes. Every
      nullable field is now declared the way OpenAPI 3.1 reads it — a type union,
      `type: [string, "null"]`, or `oneOf` with `type: "null"` beside a `$ref` —
      replacing 331 uses of `nullable: true`.

      `nullable` was REMOVED when 3.1 aligned with JSON Schema 2020-12, and this
      document has declared `openapi: 3.1.0` throughout. A validator therefore
      ignored the keyword and a generated client typed every one of those fields
      as non-nullable, so a client could reject or mis-parse responses this API
      has always returned. **A client regenerated from 1.23.0 will type these
      fields as nullable for the first time**, which is a source-compatibility
      change in the generated code even though the wire format is untouched.

      `null` is routine rather than exceptional here, and on several fields it is
      load-bearing: `BookingResource` nulls the money fields without
      `see_money_of_booking`, the `customer` identity fields without
      `view_booker_of_booking`, and `answers` without `view_answers_of_booking` —
      where null and `[]` mean different things ("you may not see it" versus
      "nobody filled anything in"). `TenantCurrency::code()` returns null
      deliberately, because a confident wrong currency is the failure it exists to
      prevent.

      Twenty `enum` arrays gained `null` alongside the union. JSON Schema checks
      `type` and `enum` INDEPENDENTLY, so a null the union admits is still refused
      by an enum that does not list it.

      `tests/Architecture/OpenApiNullabilityTest.php` fails the build on a
      recurrence in either published spec, including the flow-mapping spelling
      (`{ type: string, nullable: true }`), which was 253 of the 331 and which a
      line-anchored check does not see.
    - **1.22.0** — **Breaking.** `POST /availabilities` gains `day_count`, and
      `end_date` is capped at one day.

      Both fields say how long ONE departure runs. Neither has ever created a
      departure per day — that is `POST /availability-rules`. But `end_date`
      is ABSOLUTE, and absolute is also how `/availability-rules` spells the
      end of a RANGE, so a caller that has just been refused a recurrence rule
      carries the field across with that meaning:
      `{date: 2027-04-01, end_date: 2027-04-18}` reads as eighteen daily
      departures and builds a single slot running 1 Apr 14:30 to 18 Apr 17:00.
      Nothing downstream treats that as a mistake; it occupies inventory and
      is published to GetYourGuide and Viator as bookable.

      **`day_count`** is the spelling to use: whole days from `date` to the
      day the departure ends on — `0` same-day, `1` overnight, `9` for a
      nine-day expedition. Same field name and same `0`-`365` bound as
      `PATCH /availabilities/{id}`, so the two endpoints now describe the same
      property of the same row the same way. A relative count has no range
      reading at all.

      **`end_date` is capped at `date + 1`.** A longer one is `422
      VALIDATION_FAILED` with a message naming both escapes: use
      `POST /availability-rules` for a departure on each day of a range, or
      `day_count` for a genuine multi-day departure. The cap is on the
      ambiguous spelling only — `day_count` is unrestricted up to 365, because
      a multi-day tour is a real product shape and
      `PATCH /availabilities/{id}` has always permitted one. Sending both
      `day_count` and `end_date` is also a 422: they are the same span in
      different units, so a payload carrying both is one whose author did not
      know which applied.

      Breaking for a caller using `end_date` to create a slot longer than a
      night. The field shipped on 2026-08-21 documented for overnights only,
      and the 422 names its replacement, so the migration is one field.

      A span over a day is reported on the response (dry run and commit alike)
      as **`notes.departure_spans_days`**, carrying the number of days.

      **Breaking, small.** Every availability WRITE endpoint now refuses a
      JSON **boolean** where it expects a number, rather than reading it as
      `1` — `POST /availabilities`, `PATCH /availabilities/{id}`,
      `POST /availability-rules`, `POST /availabilities/bulk-update` and
      `POST /availabilities/bulk-delete`. Laravel's `integer` rule stringifies
      before validating, so `true` passed and produced a one-day, one-seat
      departure; on the bulk endpoints it did so across a whole date range. A
      quoted number (`"2"`) is still accepted everywhere.

      `product_option_id` is typed on the same five endpoints, where it was
      previously unconstrained. A non-numeric id is now `422
      VALIDATION_FAILED` instead of `404 NOT_FOUND`, and a boolean one no
      longer resolves to the option with id 1 — which on
      `/availabilities/bulk-delete` soft-deleted a date range of a different
      product's departures.

      `POST /availabilities/bulk-delete` also refuses `from` equal to `to`
      with a 422, matching `/availabilities/bulk-update`. `to` is EXCLUSIVE on
      both, so that range matched nothing and the delete answered `200` with
      `total_deleted: 0` — success, having removed nothing. A single day is
      still `from=D, to=D+1`.

      Raised by Optibot on review. The rest of the CLI write surface was
      unchanged here and still accepted a boolean in these positions —
      closed in `1.25.0`. The
      operator assistant renders it on the confirmation card — nothing in a
      payload can tell a nine-day expedition from a misread field, and the
      operator is the only party who can.

      On MCP, `create_availability` had NO entry in the
      `inventory_availability` tool's action descriptions at all, so its
      schema offered it to the model as `(no description)` — the whole reason
      the range reading was reachable. It is described now, and
      `tests/Architecture/McpActionDescriptionCoverageTest.php` fails the
      build on the next action added to a dispatch table without one.

    - **1.21.0** — `view_own_availability` now grants something on the
      availability endpoints, where it previously granted nothing at all.

      Two opposite movements, both on `GET /availabilities` and
      `GET /availabilities/{id}`:

      **Widening.** A caller holding `view_own_availability` was refused with
      a flat `403` on both, because the policy behind them accepts only
      `view_any_availability`. They now get the departures of the product
      options whose resource roster includes them — the same rule the web
      calendar and the mobile app already apply, so this closes a gap rather
      than opening one. A holder on no roster gets an empty page, never the
      whole business unit.

      **Narrowing.** The single-row fetch accepted that permission with no
      ownership check whatsoever, so an own-scoped caller could read any
      departure by id while the list hid it. It is now scoped to the same
      rows the list returns, and anything else is a `403`.

      A caller holding `view_any_availability` is unaffected, which is every
      admin, manager and OCTO token. Nothing changes on the write endpoints,
      on any other resource, or in the response shape. The MCP
      `inventory_browse` tool inherits both halves, since it calls these
      controllers directly.

      Note what the rule scopes by: the OPTION's roster, not the individual
      departure's assignment. A guide sees every departure of any option they
      could be assigned to, which is what the web shows them (captainbook#8441).

    - **1.20.0** — Bookings can be filtered by the surface that sold them, and
      partners are readable.

      `GET /bookings` gains **`origin_type`** and **`partner_id`**.
      `origin_type` takes the same six values the response's `origin.type`
      already reports — `ota`, `direct_online`, `direct_offline`,
      `indirect_offline`, `reseller`, `other` — rather than the raw
      `provider_type` morph, which that block deliberately hides. A value
      outside the set is a 422.

      **`GET /partners`** is new, read-only, and gated on `view_any_partner`
      (admin, manager, reservation manager — strictly narrower than the
      booking read gate, so it widens no audience). It takes `q` (name or
      email, substring), `partner_type`, `include_trashed` and `since`.

      The two ship together because neither answers the question alone. A
      partner booking reports `origin.type = indirect_offline` with a **null**
      `origin.channel_id`, so no booking payload names the partner that sold
      it — a `partner_id` filter with nothing emitting a partner id is a
      filter nobody can use. `partner_id` needs `view_any_partner` for the
      same reason: `/partners` is the only route from a name to one of these
      ids, so without the permission the filter would be a way to probe for
      that mapping an id at a time. The 403 names `origin_type`, which needs
      no permission.

      `partner_id` matches a partner on **either** side of the morph — as the
      booking's provider (they sold it) or as its customer (they are billed
      for it). Both are `indirect_offline`, so matching one column would
      answer with a subset and nothing saying so. A retired partner still
      matches: the bookings they sold stay on the books, and those are the
      ones being reconciled.

      Shipped because the assistant could not look a partner up and so told an
      operator three times that a partner of theirs did not exist
      (captainbook#8442). Nothing is redacted or widened by this: `origin.type`
      was already on every booking row with no gate, so filtering on it
      discloses nothing the same page did not.

    - **1.19.0** — **Breaking.** One approved change can now express the whole
      request. Two endpoints, one theme.

      `POST /availabilities/bulk-update` gains a second, mutually exclusive
      scope: **`availability_ids`**, a list of up to 1000 departure ids. The
      date range could not express an EXCEPTION — an operator asked to close
      every departure on a day except the one already booked, and the verb
      was right while the scope could not say it. With ids the caller lists
      the departures, drops the ones to keep and sends the rest, and
      `would_update` becomes the length of that list rather than a prediction
      from date arithmetic. An id that resolves to no live departure of a
      product option is `422 VALIDATION_FAILED` naming it, never a silent
      narrowing — the exactness is the point of the field.

      `product_option_id` also accepts a LIST now, for "close these nine
      options for all of October". Not for `setting=pricing`: each product
      has its own pricing tiers, so there is no shared answer, and a
      multi-option pricing payload is a 422 (as is an id list spanning more
      than one option).

      **Breaking:** `to` must now be strictly `after` `from`, not
      `after_or_equal`. The range is half-open, so `from == to` matched
      nothing and answered a cheerful `200` with `total_matched: 0` — which
      is what an agent sent for "tomorrow, 30/09", and what it then reported
      as a successful close. It is a `422` naming the fix.

      A `setting=booking_status` dry run that CLOSES departures gains
      **`notes.has_live_bookings`**: how many of the matched rows are sold.
      Nothing is refused — closing cancels no booking and moves no money —
      but the operator above explicitly asked to exclude the booked one and
      nothing on the preview could tell them which those were.
      `notes` is a sibling of `skip_reasons` and means the opposite of it:
      facts about rows that WILL change. It is present (possibly empty) on
      every dry run.

      `POST /availability-rules` takes several departure times per rule.
      **`times[]`** (`[{start_time, end_time, add_days_count?}, …]`, max 24)
      is mutually exclusive with the scalar `start_time`/`end_time` pair the
      client vendors today — sending both is a 422, and two entries naming
      the same `(start_time, end_time, add_days_count)` are too. The day
      offset is part of that identity, not decoration: it moves the `to`
      DAY, so `02:30-04:30` at +0 and the same pair at +1 are a two-hour
      tour and a twenty-six-hour one leaving at the same minute, and both
      are legal. One rule, one card: an
      operator with four date ranges of three daily departures needed eleven
      calls and therefore eleven approvals, and the session that prompted
      this died at the second. A `date`-only product may send at most one
      entry; every entry would widen to the same whole day.

      **Breaking, and unrelated to the two above.** `sample_dates[].from` /
      `.to` now carry the PRODUCT's offset, where they used to carry the
      ACCOUNT's. That makes the preview agree with `GET /availabilities`,
      whose `starts_at` / `ends_at` have always been relabelled with the
      product's zone — the two surfaces previously published the same
      departure three hours apart for, say, a Europe/Athens product on a
      UTC account, and the MCP tool description tells an agent to
      cross-check exactly those two. Single-timezone accounts see no change.

      Note 1.17.0 below says `date`-only products read `+00:00`. That was
      true when written and stopped being true in the same release: the
      `shiftTimezone('UTC')` it describes was removed when the endpoint
      switched to shipping the rule rather than the expanded list, with no
      further bump. They have been emitting the account's offset since, and
      now emit the product's like everything else.

      **The stored digits move too, for some rules.** Everywhere else this
      release only relabels. But the enumeration was dropping a day and
      shifting hours whenever the ACCOUNT's zone had a DST gap covering the
      rule's own departure time, so those departures change value and not
      just label.

      Which rules: any rule whose `start_time` falls in the account's gap.
      A `date`-only rule usually omits `start_time` and so departs at
      `00:00`, which only a zone jumping at MIDNIGHT catches
      (America/Santiago, America/Havana, Asia/Beirut and friends) — but
      `start_time` is accepted on a `date`-only rule too, and it anchors the
      walk BEFORE the rows are widened to whole days, so such a rule can
      lose a day with no hour visibly wrong anywhere. A `datetime` rule is
      affected whenever its `start_time` falls in the gap — `02:30` on an
      `America/New_York` account over 13-16 Mar 2027 produced THREE
      departures where four were asked for, two of them at `03:30` rather
      than the requested `02:30`, and that is an ordinary spring-forward,
      not a midnight one. Both now produce the requested digits.

      `times[]` multiplies it, which is why the fix ships in the same
      release rather than only in #8412: every departure time in one rule is
      a fresh chance for `start_time` to land in the account's gap.

      Rows already written that way are NOT repaired by this release, and
      re-running the rule creates the corrected departures ALONGSIDE them
      rather than replacing them: the write-time skip matches `(from, to)`
      digit-exactly, so a stored `03:30` does not match a fresh `02:30`. The
      dry run reports them as `notes.dst_shifted_twin_exists` (below) so the
      count is on the card before anyone approves, but nothing reconciles
      them — reconcile before re-running a rule that spans a transition.

      Behind it, the enumeration no longer fans dates in any account's or
      product's timezone. `availabilities.from` is a wall clock with no
      instant behind it, so advancing it with DST arithmetic is wrong twice
      over: in a zone that jumps at midnight, 00:00 on the transition day
      normalises forward to 01:00, that hour rides every later iteration, and
      the last day falls past the end bound and is never written. Measured on
      `America/Santiago` over 3-7 Sep 2027: five days requested, four
      created, two of them an hour late. The walk is UTC-anchored now, so the
      digits that come out are the digits that went in — for every tenant and
      every product (captainbook#8412).

      `POST /availability-rules` refuses a rule whose own departure times
      would publish as ONE departure. Two times either side of a DST gap —
      `02:30` and `03:30` on an `America/New_York` product on 14 Mar 2027 —
      are distinct wall clocks and distinct stored rows, but both relabel to
      `03:30` because 02:30 does not exist locally, which is one trip sold
      twice. It is a `422` naming both times and the instant they land on.
      A `times` pair that collides on no date in the range is unaffected.

      The dry run also gains **`notes.dst_shifted_twin_exists`**: departures
      this rule will create that the option ALREADY has at a different hour,
      left by the pre-fix enumeration. They do not match the `(from, to)`
      skip — that is what the fix changed — so approving creates both.
      Reported rather than resolved: which hour is right is a question about
      the operator's calendar. Like `notes` on `bulk-update`, it is the
      sibling of `skip_reasons` and means the opposite of it.

      The response's `rule` block gains **`times`**: `start_time`, `end_time`,
      `add_days_count` and this rule's `total_matched` / `would_create` /
      `already_exists` **per departure time**. The top-level counts are the
      sums. It is present for the scalar shape too, as a single entry — one
      uniform list rather than a key that appears only sometimes. `rule`'s
      own `start_time`/`end_time` are the FIRST time, so a rule sent in the
      scalar shape still reads back in it.

    - **1.18.0** — **Breaking.** The six product text fields (`description`,
      `instructions`, `requirements`, `inclusions`, `exclusions`,
      `cancellation_policy`) are capped at **64 KiB — 65,535 BYTES** — on
      `POST /products` and `PATCH /products/{id}`; beyond it the request is a 422
      naming the field.

      The number satisfies two constraints at once. Three of these fields mirror
      into marketplace `TEXT` columns of exactly that width, on a database that
      runs non-strict and would otherwise truncate a longer value mid-UTF-8
      without an error. And six fields at this cap render to a 3.4 MB dashboard
      page in the worst case — measured with `"`, which after JSON and HTML
      escaping costs about seven bytes; the same page with 256 KiB fields
      measured 7.7 MB and exceeded the platform's response ceiling, which is the
      failure this cap exists to prevent.

      Nothing legitimate is near it — 64 KiB of HTML is thousands of words. A
      client storing an encoded binary in one of these fields has to stop. Note
      the cap applies to the value SUBMITTED, including one echoed back
      unchanged: a product that already holds an oversized field cannot be
      updated through any field until that field is shortened.

    - **1.17.0** — **Breaking.** `POST /availability-rules` refuses a
      `weekdays` that is not a LIST of day numbers, and no longer re-creates
      departures the option already has.

      `['required','array','min:1']` with `weekdays.* => ['integer','between:0,6']`
      reads like it already required a list and did not: an object of booleans
      — `{"monday": true, …}` — satisfied every one of those rules, because
      `filter_var(true, FILTER_VALIDATE_INT)` is `1` and `between` then sized
      the string `"1"`. The dry run and the job each read that shape their own
      way, so a preview reporting 2 departures queued 15 and a preview
      reporting 19 queued 111, with every Sunday missing. Such a body is now
      `422 VALIDATION_FAILED` naming the encoding (Sunday=0 … Saturday=6).
      A correct `[0,1,2,3,4,5,6]` is unaffected.

      The preview and the commit now share ONE enumeration — the job's — so
      the counts cannot drift again. The commit queues a single job carrying
      the rule, so the queue payload does not grow with the length of the
      range; the HTTP response is a `202`.

      Duplicate suppression holds across CONCURRENT and QUEUED requests, not
      only within one: the job re-checks each `(from, to)` at write time under
      an option-scoped lock, so retrying the same rule — or committing it
      twice before the first batch has run — creates each departure once. A
      retry is therefore safe and idempotent. Note this makes `would_create` a
      PREDICTION rather than a guarantee: it is computed when the preview runs,
      so a departure created by anything else between the preview and the
      worker is skipped at write time and the response's count will read one
      higher than the rows added.

      The response gains **`would_create`**, which is what will actually be
      written: `createAvailability` has no unique index behind it, so a
      re-run of the same rule used to write a second copy of every departure.
      Occurrences the option already has are filtered out and reported as
      `skip_reasons.already_exists`. `total_matched` keeps its meaning (dates
      the rule matched). A rule whose every departure already exists returns
      `200` with `status: no_op` and `would_create: 0` — a second way to reach
      `no_op`, which until now meant "the range matched nothing".

      Two smaller response changes fall out of the shared enumeration.
      `sample_dates` samples the occurrences that will be CREATED, not the
      first three the rule matched, so it is empty on a `no_op`. And on a
      `date`-only product its `from`/`to` now carry `+00:00` rather than the
      tenant offset: the digits are the product-local wall clock in both
      cases, and `+00:00` is what the job writes.

    - **1.16.0** — **Breaking.** Finishes 1.15.0's promise that a filter is
      never silently ignored. 1.15.0 closed the unknown-key half; these are the
      ways a DOCUMENTED key was still dropped, plus two things 1.15.0 refused
      that it should not have.

      Relaxed:

      - A documented parameter sent EMPTY (`?from=`, `?status=`,
        `?resource_id=`, or `"foo": null` / `""` over MCP) is now no filter
        rather than a 422, so a client that sends every key it knows can list.
        `false` is NOT empty — see List filters above.
      - `GET /pricing-tiers/{id}?include_trashed=true` is accepted again.
        1.15.0 made that endpoint strict without declaring the parameter it
        reads, so it answered 422.

      Refused where a value used to be dropped:

      - A list on a single-value parameter (`?key[]=x`, an array or object over
        MCP) is a 422. A controller reading one scalar either cast the array —
        a 500 — or skipped its filter.
      - A value of the wrong type is a 422. Over MCP this is the common case:
        `{"reference": 123}` compared a number to a varchar, matching
        `123-ABC`; `{"booking_id": true}` compared a uuid to `1`. A JSON
        boolean on an integer id parameter (`{"product_option_id": true}`) is
        refused too, where it would otherwise have selected the row with id 1.
      - An id parameter rejects `0`, and an unreadable boolean flag
        (`?include_trashed=maybe`) is refused rather than read as false. See
        List filters for the accepted spellings.
      - A falsy-but-real value now filters. `?code=0` on `/discounts` or
        `/gift-certs/issued`, `?country=0` on `/customers`, `?reference=0` on
        `/bookings` and about forty others answered with the whole unfiltered
        list.
      - `?include=` on `/bookings` is an enum of one value, `resources`. A
        misspelling (`?include=resourcez`) was a 200 with no resources and
        nothing saying why. It takes a list as well as a comma-separated
        string.
      - `inventory_browse`, `inventory_workflow_browse` and the segments browse
        tool refuse an `id` on a `list` action. The list endpoint never read
        it, so `bookings` plus a customer's id answered with the whole business
        unit's bookings — the incident 1.15.0 was written for, through another
        door.
      - A boolean flag is read from the query string, so a GET body no longer
        overrides the value the validator checked. `GET /bookings?q=alice` with
        a body of `{"q": null}` skipped the `view_booker_of_booking` gate and
        still ran the search.

      Search semantics:

      - `%` and `_` in a `q` term are matched literally on `/bookings`,
        `/guests`, `/customers` and `/products`. `?q=%` used to match every
        row.
      - `q` on `/bookings` matches a `reseller_reference` by prefix (it already
        matched the booking id that way).
      - `q` on `/guests` now reaches the travellers `customer_id` reaches:
        soft-deleted customer records, and records outside the caller's
        business unit on a booking they may see. It was answering "no such
        traveller" for rows the id filter found.
      - `q` and `customer_email` matching more than 500 customers are refused
        with 422 rather than truncated, on `/bookings` and `/guests`. A
        truncated id list would have dropped rows silently.

      `/workflows` and `/workflow-executions` authorize before validating, so a
      caller the policy refuses no longer learns the filter vocabulary first.

    - **1.15.0** — **Breaking.** List endpoints refuse a query parameter they
      do not document with `422 VALIDATION_FAILED` (see List filters above).
      They used to ignore it and return the unfiltered list with a `200`,
      which a caller could not tell from a filter that had matched everything.
      Three documented filters were never implemented, and this is how the
      gap went unnoticed:

      - `GET /bookings?customer_email=` now filters, by exact match on the
        booker's email.
      - `GET /bookings?q=` now searches: booking id by prefix,
        `reseller_reference`, and the booker's name and email.
      - `GET /transactions?status=` is removed. A transaction row is only
        written for a payment that succeeded, so there was nothing for it to
        select; it is now refused like any unknown key. `type` loses `comp`,
        which the server already refused.

      `q` and `customer_email` on `/bookings` match on the booker's identity,
      so they require `view_booker_of_booking` and return `403 FORBIDDEN`
      without it. New filters: `customer_id` on `/bookings` (the booker) and
      on `/guests` (the traveller), and `q` on `/guests`. Parameters the
      server already honoured are now documented: `since`, `include_trashed`,
      `status` and `date_field` on `/bookings`; `include_trashed` on
      `/transactions` and `/availabilities`; `since` and `include_trashed` on
      `/gift-certs/issued`; `since` on `/gift-certs/available`,
      `/product-options` and `/bookings/{id}/transactions`.
      `/segment-fields` and `/workflow-nodes` are held to the same rule
      without paginating, so they refuse `limit` and `cursor`.

      On MCP, `inventory_browse` passes `filters` through as these query
      parameters, so an unknown filter returns a `validation_error` naming it.

    - **1.14.0** — **Breaking.** The availability writes now run the web UI's
      permissions, which the Authorization convention above always claimed and
      four endpoints did not: they checked the token's tier and nothing else.

      | Endpoint | Now also requires |
      |---|---|
      | `POST /availabilities/bulk-update` | `update_availability` |
      | `POST /availabilities/bulk-delete` | `delete_availability` |
      | `DELETE /availabilities/{id}` | `delete_availability` |
      | `POST /availability-rules` | `create_availability` |

      A caller without it gets `403 FORBIDDEN`, and a `dry_run` is refused the
      same way, so a preview never shows a change the commit would refuse. A
      malformed body is still `422 VALIDATION_FAILED` first. On
      `DELETE /availabilities/{id}` the id is resolved before the check, so an
      unknown id is still `404 NOT_FOUND`; on `POST /availability-rules` the
      check runs before the product option is looked up, so a refused caller
      gets `403` whatever `product_option_id` it sends. On MCP the
      `inventory_availability` tool's actions (`bulk_update_availability`,
      `bulk_delete_availability`, `delete_availability`,
      `create_availability_rule`) return `permission_denied`; a committing call
      that carries an `idempotency_key` reports it instead as
      `data.http_status: 403` with `data.body.error.code: FORBIDDEN`, and the
      key is released, so the same key works once the role is fixed. A
      `dry_run` skips idempotency, so a refused preview is always
      `permission_denied`.

    - **1.13.0** — **Breaking, narrowly.** `POST /segments` refuses one
      condition shape it used to accept: a group whose `filters` is a scalar or
      a string. That was read as an empty group, so the whole clause was dropped
      and the create came back **201** describing a tree the segment did not
      have.

      `"filters": null` and `"filters": []` are still accepted, and so is an
      absent key — all three express no constraint, which is a different thing
      from expressing one the server cannot read. Only the unreadable value is
      refused; there is nothing in the other three to throw away.

      A leaf naming no field is refused as it always was, but the message now
      says so ("Every condition needs a field") instead of reporting the empty
      string as a field that does not exist.

      One payload shape is LOOSENED, on a standard column: a leaf with no
      `condition` key used to be refused (it read as the empty operator) and now
      defaults to `contains`, matching what the compiler has always done with it.
      A behavioural (`customer_event.*`) field answers its own operator list, so
      the key is not optional there and an absent one is still refused. No
      ability or status is otherwise different, and nothing a well-formed caller
      sends changes.

      The reason for the version bump is mostly on the other side of the wall:
      these checks lived as private methods on the API controller, and the in-app
      rule builder — where nearly every segment is actually authored — ran none
      of them. They are one service now, so the API and the builder agree on what
      a legal condition tree is, which they did not in 1.10.0.


    - **1.12.0** — **Breaking.** `total_amount`, `paid_amount`, `refunded_amount`
      and `transactions` on a booking are now ALSO gated on
      `see_money_of_ota_booking` when the booking came from a sales channel
      (GetYourGuide, Viator, Google Things To Do, or the CaptainBook
      marketplace). A caller holding `see_money_of_booking` but not
      `see_money_of_ota_booking` therefore gets nulls on those bookings and
      real values on back-office, widget, reseller and partner bookings. The
      keys are always present; only the values are withheld, as with the other
      field gates. `GET /transactions` agrees rather than letting a caller walk
      around it: rows whose parent booking is redacted are EXCLUDED from the
      list and from `show` (a transaction is an amount, so a redacted
      transaction object would be empty — omitting the row is the honest
      answer). The new permission is granted BY DEFAULT to every role that
      already holds `see_money_of_booking` — `admin`, `manager`,
      `reservation manager` and `user` — so no existing caller loses a value on
      deploy. Withholding channel prices is opt-in per tenant, by un-ticking it
      for a role in Settings > Roles.
    - **1.11.0** — a pricing tier can only be reparented within its own product.

      **Breaking** for `PATCH /pricing-tiers/{id}`: a `pricing_category_id`
      naming a category of a DIFFERENT product now answers
      `422 VALIDATION_FAILED` where it previously answered `200`. Both
      categories are tenant-scoped, so the unconstrained FK was satisfied by any
      category on the account and the reparent was accepted silently. That is
      not bookkeeping: a tier already sold against carries its category onto
      every ticket the next `deliverTickets()` issues, so the mobile check-in
      list would label a product-A guest with a product-B fare category, and
      `occupancyByPricingCategory()` would attribute the booking to a category
      the product does not offer. `AvailabilityFares::assertTiersBelongToOption()`
      already refused the cross-product pairing at the availability end and
      documented this endpoint as the hole it could not close; this closes it at
      the source. Remediation is delete-and-recreate under the target category.

      The refusal runs ahead of the dry-run return, so `dry_run: true` reports
      it too rather than previewing a write the commit would reject.

      Also on that endpoint: a `pricing_category_id` naming a SOFT-DELETED
      category answers `422 VALIDATION_FAILED` where it previously answered
      `404 NOT_FOUND`. The lookup is `withTrashed()` and the trashed case is
      refused by name, because a 404 read as "no such category" and sent the
      caller looking for a typo in an id they had legitimately used the day
      before. A genuinely unknown id still answers `404`.

    - **1.10.0** — customer segments reach the API, and every booking read
      carries its campaign attribution.

      New: `GET /segments`, `GET /segments/{id}`, `GET /segments/{id}/members`
      and `POST /segments`. A segment is a live rule rather than a saved list,
      so a member count is the answer as of now; `members` needs customer-read
      authority on top of segment-read, because the payload is people.

      The two tiers differ, deliberately. Reads are the STATISTICS tier — a
      segment answers the same kind of question the statistics endpoints do, off
      the same behavioural spine — while the create is `cli:write`, because an
      audience is configuration and is live the moment it exists. On MCP that
      split is expressed by SERVER (`segments_browse` on statistics,
      `inventory_segment_edit` on inventory), which is where tiers are real; the
      CLI's vocabulary is read/write/cs, so here it is the ability table above.

      `GET /segment-fields` is the vocabulary for `conditions` — per tenant and
      per business unit, with the operators each field accepts. Read it before
      composing a tree; it is the segment analogue of `GET /workflow-nodes`.

      `conditions` has no published grammar and that is not an omission: the
      legal fields are per-tenant (operator-defined custom attributes,
      behavioural fields only where the event spine is on), so any schema
      written here would be wrong for most tenants and would drift from the
      evaluator. Read an existing segment for a worked example. The create
      validates against the live catalogue in two steps — operator legality,
      then the complexity budget — and both run under `dry_run`, so a green
      preview is a create that will succeed.

      Only creation is exposed. Editing a live segment re-baselines its whole
      membership and fires enter/leave on customers who never changed, and
      archiving one silently stops every workflow bound to it; both stay in the
      builder, where the preview count shows the blast radius first.

      Segments need the CRM v2 feature and the `customer_segmentation` plan
      item. A tenant without either gets **404** rather than 403 — for them the
      resource does not exist.

      Also new, on every booking read: `attribution`, carrying the `utm_*`
      first and last touch captured at checkout. DISTINCT from `origin`, which
      says which surface created the booking — a widget booking from a paid ad
      is `origin.type = widget` with a `google` / `cpc` last touch. Two touches,
      never one: collapsing them picks a side of the attribution argument. Null
      for a tenant without the customer-event spine.

    - **1.9.0** — two things a caller could not previously do at all.

      `PATCH /availabilities/{id}` now takes `start_time`, `end_time` and
      `day_count`, so ONE departure can be moved. The only route before was
      `POST /availabilities/bulk-update` with `setting=start_time`, which is
      date-range scoped and therefore rewrites every session on each date it
      matches — asked to move one of two departures on a day, a caller moved
      both. Both times are the product's LOCAL wall clock in `HH:MM`, written
      verbatim, matching how `starts_at` reads back. `start_time` alone shifts
      the slot and preserves its duration. New refusal:
      `409 AVAILABILITY_HAS_ACTIVE_BOOKING` when the slot carries a booking that
      has not been cancelled — the same predicate bulk-update uses to decide
      which rows a time change may touch, except that bulk skips those rows
      silently and this refuses out loud. Raised in dry-run too. A committed
      move republishes the slot at its new hour and retracts the instant it
      left, since GetYourGuide keys inventory on `(productId, dateTime)` and
      exposes no delete.

      `POST /workflows` now optionally takes `trigger` and `steps` and writes
      the whole draft in one transaction. Nothing is removed: the three-call
      shape (create → `POST /trigger` → `POST /steps`) is unchanged. It was
      simply unusable by a caller that gets one shot — CaptainBook AI parks one
      change per turn for the operator to approve, so it created the shell, was
      refused on the second call, and the operator approved a card that produced
      a workflow with no trigger and no steps. Branching inside the payload uses
      caller-chosen `ref` / `parent_ref` rather than ids, since none of the
      steps exists yet; a `parent_ref` not named EARLIER in the same list is a
      422 rather than a branch flattened onto the main line. Every node's
      `config` is validated against its own `rules()` in dry-run as well as on
      commit. The workflow is still created in DRAFT and `POST /activate`
      remains a separate call.

      New: `GET /workflow-nodes`, the trigger + action catalogue with each
      node's `step_type` and `config` shape. `action_type` is validated as a
      bare string on the step endpoint and with `Rule::enum` on the trigger one,
      neither of which a client can read as a closed set, so an API caller had
      no way to learn the vocabulary and was guessing names against a validator.
    - **1.8.0** — **Breaking.** `use_alternate_tier_pricing` is refused with
      `422 VALIDATION_FAILED` when the write would leave it set on a product
      that is not per-person tier priced. The flag tells the tier lookup to key
      on the party total instead of the per-category quantity, so it only means
      anything on a product that is BOTH `is_priced_per_person: true` and
      `is_tier_priced: true`. Anywhere else it made
      `Product::tiersMatchOnTotalQuantity()` answer true for a product with no
      tier semantics at all, and that predicate branches pricing in 16 places.
      Two combinations now come back 422 instead of `201`/`200`:
      `use_alternate_tier_pricing: true` with `is_tier_priced: false`, and with
      `is_priced_per_person: false` — the second used to reach the package's
      write-time guard and surface as a **500**.
      Only on a PRIVATE product, in practice: a shared product
      (`is_private: false`) has already had `use_alternate_tier_pricing` forced
      to `false` by the implicit overrides documented on
      `POST /products`, and that behaviour is unchanged.
      The refusal names the field under `error.details.use_alternate_tier_pricing`
      and says which flag to send alongside. It is raised before any write, so
      it releases its `Idempotency-Key` — resend the corrected body under the
      same key. `dry_run: true` is refused too: a preview that answers
      `would_apply: true` for a body the commit refuses is worse than no
      preview.
      A row already stored in one of those states is NOT a trap: a `PATCH` that
      leaves all three pricing flags exactly as it found them is still accepted,
      so an edit to the title, and a read-modify-write round trip that echoes
      the stored values back, both keep working. Only a write that MOVES one of
      the three while the conflict stands is refused.

    - **1.7.0** — `PRODUCT_BEING_DUPLICATED` (409) is a new refusal on every
      write that touches a product while a copy of it is in flight:
      `PATCH /products/{id}`, `DELETE /products/{id}`,
      `POST /products/{id}/restore`, `POST /product-options`,
      `PATCH /product-options/{id}`, `DELETE /product-options/{id}` and
      `POST /product-options/{id}/restore`.
      Duplicating an experience is a background job that reads the source for a
      couple of minutes while it builds the copy, and it snapshots the source's
      options with a single `options()->get()`. Any write in that window either
      mutates a product the job is still reading, or moves the option set out
      from under that snapshot — adding, removing and restoring an option are
      the same mutation from three directions — so the copy silently comes out
      wrong, carrying or missing rows purely on timing. Deleting the source also
      cascade-soft-deletes its options into a running job, which 404s the edit
      screens. The web UI was already gated
      by `ProductPolicy`; these controllers never run it (their form requests
      only check auth), so the CLI and MCP surfaces were the way around it.
      **Retriable, and deliberately so**: the lock clears on its own when the
      copy finishes, and the refusal releases its `Idempotency-Key`, so
      resending the identical request under the same key is the intended
      recovery — `error.retriable` is `true`, the only code besides
      `BOOKING_RESOURCE_STATE_STALE` that says so.
      `dry_run: true` is never refused: a preview mutates nothing, so it still
      answers 200 and is the way to check what a write would do while you wait.

    - **1.6.0** — a booking's resources are addressed in THREE parts instead of
      two. A booking holds exactly one **main** resource (the guide or the
      asset), many **equipment** resources, and many **auxiliary** ones. The
      split is `resourceables.capacity` — the product option's pivot — not
      `Resource.category`: a capacity-bearing non-auxiliary resource competes
      for the single main slot, a null-capacity one is equipment.
      `Booking::attachResources()` has always worked that way, and the two
      agree in practice because an `equipment` resource is forced to a null
      capacity.
      New: `equipment_resource_ids` on `UpdateBookingResourcesRequest` (full
      desired set, omit to leave equipment untouched) and
      `GET /bookings/{id}/resources/equipment/available` for the candidates,
      also reachable over MCP as
      `inventory_browse` → `booking-equipment-resources-available`. Asking for a
      capacity-bearing resource in that list is refused with
      `EQUIPMENT_RESOURCE_IS_MAIN` rather than quietly putting a second main on
      the booking.
      Also new: `main_resource_id` now makes the FIRST assignment on a booking
      that has none, instead of refusing with
      `MAIN_RESOURCE_NOT_ASSIGNABLE_NO_CURRENT` ("no current main resource to
      switch from"). That code is gone. Switching was previously the only
      assignment path and it needs something to switch away from, so a booking
      that never got a guide — `Booking::attachResources()` throws rather than
      assign when nothing fits at creation — or that had one detached by hand
      could not be given one through the API at all. The request is unchanged:
      `main_resource_id` replaces the current main if there is one and assigns
      if there is not.
      Asking for a SECOND guide or asset is still refused, since the only way to
      express it is to name a capacity-bearing resource under one of the plural
      fields: `EQUIPMENT_RESOURCE_IS_MAIN` / `AUXILIARY_RESOURCE_IS_MAIN`.
      The rejection codes are reorganised around which FIELD the id was put in
      and which kind it turned out to be — `<FIELD>_RESOURCE_NOT_ON_PRODUCT_OPTION`
      and `<FIELD>_RESOURCE_IS_<KIND>`, plus `MAIN_RESOURCE_NOT_AVAILABLE` and
      `AUXILIARY_RESOURCE_NOT_AVAILABLE` for a right-kind resource that is busy.
      `EQUIPMENT_RESOURCE_NOT_AVAILABLE` is gone with them: equipment is never
      rationed per booking, so it is either on the option or it is not.
      **Breaking**: `POST /bookings/{id}/resources` now answers
      `422 VALIDATION_FAILED` for an unrecognised field instead of dropping it.
      Every field on this request is optional, so a body carrying only a
      misspelt or invented instruction validated, planned no change and returned
      `200` with `before` equal to `after` — a caller reading that as "assigned"
      was believing what the API told them. Reported by a CLI user who sent
      `auto_assign: true`, a field this endpoint has never had, and got success
      with nothing assigned.
      **Breaking for a caller writing resources on a booking that carries
      equipment.** `main_resource_id` was previously diffed against
      `resources.first(not auxiliary)`, and equipment is not auxiliary — on an
      unordered relation that could be any row, so the same request could
      no-op, switch, or come back `MAIN_RESOURCE_NOT_AVAILABLE` on identical
      data. It is now diffed against the capacity-bearing assignment, so a
      request that happened to work against the arbitrary row may now resolve
      differently. Bookings with no equipment are unaffected.
      **Breaking for a typed client reading a dry run.** `diff.after.resources`
      rows now carry the same shape as `diff.before.resources` and as the
      committed `diff.after` — `id`, `name`, `type`, `capacity`, `category`,
      `source`, `user`. A preview used to build changed rows from a wider
      serializer and ship `seniority`, `pivot_capacity` and
      `custom_attributes` alongside them, so a preview and the commit that
      followed it described the same assignment with different keys. Two
      related preview bugs go with it: a main switch no longer drops the
      booking's equipment from `after` (the commit re-attaches it, so the
      preview was simply wrong), and a row this mutation attaches now reads
      `source: manual` rather than `auto`.
      **Breaking** for `POST /resources`, `PATCH /resources/{id}` and
      `POST /product-options/{id}/resources`: a `capacity` sent for a resource
      whose category is `equipment` now answers `422 VALIDATION_FAILED` where
      it previously answered `201` / `200` / `201`. Both web write paths null
      that field on save; the CLI wrote it through, so an agent could create
      `category: equipment, capacity: 12`, attach it to an option, and have it
      compete for the main slot by seniority — while `ComputeIsOpenForBooking`
      and `UpdateIsFullyBookedJob`, which exclude EQUIPMENT by category, sized
      the availability as though it did not exist. Refused rather than nulled
      because the alternative is the silent discard 1.4.0 removed from the
      `currency` fields: the caller is told the resource holds twelve seats and
      nothing downstream ever contradicts it. Remediation is to omit
      `capacity`, or to send `guide` / `asset` if the resource really does
      carry seats.
    - **1.5.0** — `delivery_method` and `redemption_method` (the product's
      "Ticket type" and "Redemption method") are now readable on `Product` and
      writable on `POST /products` and `PATCH /products/{id}`. Additive: a
      caller that never sends them keeps the previous behaviour, and the
      columns keep their DB defaults (`VOUCHER` / `MANIFEST`). Two conditions
      attach to the write, both mirroring the Ticketing form rather than being
      invented here:
        - CHANGING either field requires the `update_delivery_method`
          permission, which is what the form's Update button carries. A caller
          without it gets `403 FORBIDDEN`. The gate is on the change, not on
          the key: since both fields are now on the read shape, the ordinary
          read-modify-write client PATCHes them straight back, and refusing
          that echo would `403` a caller over a value they never moved. On
          `POST /products` there is no stored row, so the comparison is
          against the column default — sending a field at its default, or
          omitting it, needs no permission, which keeps "GET a product, POST
          it back to clone it" working for a caller who never touches
          ticketing.
        - Changing `delivery_method` on a product that has bookings is refused
          with `422 TICKET_REISSUE_NOT_CONFIRMED` unless the payload carries
          `confirm_ticket_reissue: true`. The change deletes every ticket on
          those bookings and issues new ones, so the QR codes customers are
          already holding stop scanning, and nothing notifies them. `dry_run:
          true` is never refused — it is how you read
          `ticket_reissue.affected_bookings` before deciding. The refusal is
          raised before the write, so like every other `422` here it releases
          its `Idempotency-Key`: the retry carrying the confirmation may reuse
          the same key.
      **Breaking for a typed client** on the read half only: `Product` gains
      two properties.
    - **1.4.0** — `currency` on a create or update payload is now validated
      against the account currency instead of being silently discarded.
      **Breaking** for a caller that sent a currency the account does not trade
      in: `POST` and `PATCH` on `/products`, `/extras`, `/pricing-tiers` and
      `/gift-certs/available` now answer `422 VALIDATION_FAILED` where they
      previously answered `201` (create) or `200` (update). `POST
      /gift-certs/issued` accepts the same optional field on the same terms.
      The update verb did not even list the field, so it was dropped by
      `validated()` before the controller ran — the same silent discard as
      create, one layer earlier.
      Those tables have no currency column — the field was dropped on persist
      and the amounts stored as bare minor units — so the old `200` reported a
      product priced in GBP that the account would sell in EUR, with nothing
      downstream to contradict it. An agent driving the MCP tools hit this
      hardest: it asked the operator which currency to use, was told GBP, and
      relayed the `200` back as confirmation. Remediation is to send the
      account currency from `meta.currency`, or omit it where the field is
      optional. Also in 1.4.0, and the same bug read backwards: the `currency`
      on the Product, Extra, PricingTier, EmbeddedPricingTier,
      AvailableGiftCertificate and GiftCertificate read shapes was always
      `null` or a hardcoded `EUR` (it was read off a column that does not
      exist). It now carries the tenant's currency, so a non-EUR account no
      longer reads `EUR` on every priced row. `Booking.currency` and
      `Transaction.currency` keep their real per-row column and fall back to
      the tenant's currency only when the row carries none (a booking with no
      transaction yet), where they previously fell back to `EUR`.
      **Breaking for a typed client** on the read half too: `Extra.currency`,
      `PricingTier.currency`, `EmbeddedPricingTier.currency`,
      `GiftCertificate.currency`, `Booking.currency` and
      `Transaction.currency` move from non-nullable `string` to
      `string | null`. The null arm is unreachable through any route (all are
      tenant-identified) but a generated client must accept it. There is no
      default behind it: `config('utils.default_currency')` is
      `env('CURRENCY', 'EUR')`, the same hardcoded EUR one indirection out, so
      the field is `null` rather than guessed when no tenant is bound — which
      no route can reach.
      Also in 1.4.0: a `422` now RELEASES its `Idempotency-Key` instead of
      recording it, joining `401` / `403` / `429` and the plan-gate `404` from
      1.2.0. Validation rejects a request before the controller runs, so
      nothing was applied and there is no outcome to make idempotent.
      Previously a caller who corrected the body and retried with the same key
      — which this spec instructs — got `409 IDEMPOTENCY_CONFLICT`
      (`retriable: false`) for a mutation that never happened, and an
      uncorrected retry replayed the stale `422` forever.
    - **1.3.0** — No endpoint, payload or ability requirement changed. What
      changed is who may MINT a token carrying an ability: `cli:read`,
      `cli:write` and `cli:cs` are now gated on `issue_cli_read_token`,
      `issue_cli_write_token` and `issue_cli_cs_token` respectively, and
      attributing a token to another user needs `issue_api_token_for_other_users`.
      **Not breaking for an existing token** — the check is at issue time, not at
      call time, so nothing in flight stops working. It can bite on a rotation:
      whoever minted a `cli:cs` token may no longer be able to re-issue it, and
      needs the permission granted in Settings → Roles first. Device-login tokens
      from the mobile app also stopped carrying Sanctum's `*` wildcard, which had
      satisfied every `abilities:` gate including `cli:cs`.
    - **1.2.0** — an `Idempotency-Key` is now scoped to the method and path of
      its first use, not to the request body alone. **Breaking** for a client
      that reuses one key across several operations: the second operation now
      gets `409 IDEMPOTENCY_CONFLICT` (`retriable: false`) where it previously
      got a `200` replaying the first operation's response — a success envelope
      for a mutation that never ran, carrying the first resource's data. A
      client that already generates one key per operation is unaffected.
      Keys issued before this shipped carry no recorded scope; they keep
      replaying on the body hash alone for 24 hours (so a retry spanning the
      deploy still replays rather than re-executing) and are refused with
      `409 IDEMPOTENCY_CONFLICT` after that.
      Also in 1.2.0: the `404` from the workflows plan gate releases its key
      instead of recording it, matching the `401` / `403` rule added in 1.1.0.
      An operator whose plan did not cover workflows would otherwise upgrade,
      retry with the same key, and have the stale `404` replayed forever.
    - **1.1.0** — `POST /gift-certs/issued/{id}/void` moved from `cli:write` to
      `cli:cs`. **Breaking, no grace period:** a `cli:write`-only token now gets
      `403 FORBIDDEN` on that route. Remediation is a checkbox — edit the token
      in Captainbook (Settings → API tokens) to add `cli:cs`, or re-issue it.
      `GET /whoami` returns `token.abilities`, so a client can self-diagnose
      before calling. Retrying with the same `Idempotency-Key` after fixing the
      token is safe: a 403 releases the key rather than recording it.
      Also in 1.1.0: `void` now runs `GiftCertificatePolicy::delete`
      (`delete_gift_certificate`, admin-only by default) like the web UI does,
      so the `cli:cs` ability is no longer the whole gate. A CS token held by a
      user without that permission gets `403 FORBIDDEN`. Also **breaking**, and
      the same rule the read endpoints have always followed: the token's
      abilities decide which endpoints are reachable, the user's permissions
      decide what they may do.
      And applying to **every** endpoint: an ability denial's
      `error.message` now names the missing ability ("This token is not scoped
      to the `cli:cs` ability.") instead of Sanctum's generic "Invalid ability
      provided.", and carries a `hint`. Match on `error.code` (`FORBIDDEN`),
      never on the message text.
    - **1.0.0** — Phase 1 surface.

    ## Status

    Phase 1 surface. The endpoints listed here are the V1 contract; Phase 2
    will extend with full CRUD, internal notes on bookings, bulk booking
    operations, and a localized render-preview for resend confirmation.

  contact:
    name: CaptainBook Engineering

servers:
  - url: "{scheme}://{tenant_slug}.captainbook.io/api/v1/cli"
    description: Tenant subdomain
    variables:
      scheme:
        default: https
      tenant_slug:
        default: demo

security:
  - bearerAuth: []

tags:
  - name: Auth
    description: Token validation and identity probe
  - name: Products
    description: Product catalog and CRUD (soft-deletable)
  - name: ProductOptions
    description: Product option (variant) catalog and CRUD (soft-deletable)
  - name: Categories
    description: Product category catalog (read-only; managed centrally)
  - name: Availabilities
    description: Per-date capacity reads, single update, and async bulk update
  - name: PricingTiers
    description: Pricing tier catalog and CRUD (soft-deletable)
  - name: Locations
    description: Meeting / start / end location catalog and CRUD
  - name: Partners
    description: Selling and channel partners (read-only).
  - name: Media
    description: Product image and document attachments
  - name: Discounts
    description: Discount catalog, apply, and cancel
  - name: GiftCertificates
    description: Sellable gift-cert SKUs and issued instances (issue / void / resend)
  - name: Bookings
    description: Booking reads + cancel / refund / comp commands
  - name: Transactions
    description: Booking transaction reads
  - name: Customers
    description: Customer catalog (vendor `Customer` model)
  - name: Guests
    description: Per-booking guest reads + edits
  - name: Extras
    description: Extras / add-ons catalog and CRUD (soft-deletable)
  - name: Questions
    description: Booking questions catalog and CRUD (soft-deletable)
  - name: Notifications
    description: Customer notification commands
  - name: Segments
    description: Customer segments — saved audiences, their live membership, and creation

paths:
  /whoami:
    get:
      operationId: whoami
      summary: Identity probe
      description: |
        Validates the bearer token and returns the actor + tenant context.
        The CLI client uses this on `cb login` to verify credentials.
      tags: [Auth]
      responses:
        "200":
          description: Token is valid
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/WhoamiData"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /products:
    get:
      operationId: listProducts
      summary: List products
      tags: [Products]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/IncludeTrashed"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Q"
        - $ref: "#/components/parameters/Since"
        - name: status
          in: query
          schema: { type: string, enum: [draft, published] }
          description: |
            Filters on the `is_active` column (`published` → true, `draft` →
            false). `is_active` is a two-state boolean, so there is no archived
            state; any other value returns 422 `VALIDATION_FAILED`.
        - name: category
          in: query
          description: A `ProductCategory` id. `0` is refused rather than ignored.
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Page of products
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductPage"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "422": { $ref: "#/components/responses/ValidationError" }

    post:
      operationId: createProduct
      summary: Create a product
      description: |
        Creates a Product and mirrors the supplier-side metadata to
        `central_products` via `App\Observers\ProductObserver`. The
        controller enforces the same implicit-override rules the Livewire
        form runs (see `app/Livewire/Product/Edit.php::update()`):

        - When `must_validate_cancellation_policy` is `false` (default), both
          `cancellation_policy` and `cancellation_policy_link` are nulled,
          even if the caller supplied them. Set
          `must_validate_cancellation_policy: true` to retain the policy
          fields.
        - When `is_private` is `false`, `is_priced_per_person` is forced to
          `true` and `use_alternate_tier_pricing` to `false`. Shared
          experiences must price per traveler.

        Beyond the overrides, one combination is REFUSED rather than coerced:
        `use_alternate_tier_pricing: true` on a product that is not per-person
        tier priced comes back `422 VALIDATION_FAILED`, keyed on
        `use_alternate_tier_pricing`. The flag keys the tier on the party total
        instead of the per-category quantity, so it needs both
        `is_priced_per_person: true` and `is_tier_priced: true` to mean
        anything. Reachable only on a private product — on a shared one the
        override above has already cleared the flag.

        After persistence the controller calls `Product::updateCanBeSold()`
        which re-derives the `can_be_sold` column. New products have no
        Availabilities yet, so the inventory cascade jobs that fire on
        update do not run on create.

        **Ticketing.** `delivery_method` and `redemption_method` are accepted
        here. Asking for a value other than the column default requires the
        `update_delivery_method` permission — the same single permission the
        Ticketing form's Update button carries for both fields. Sending a
        field AT its default (`VOUCHER` / `MANIFEST`) does not, because that
        asks for exactly what omitting it produces: a caller cloning a product
        by posting its read shape back is not choosing a ticketing setup.
        Omitting both is likewise unrestricted. A brand new product has no
        bookings, so nothing is reissued and `confirm_ticket_reissue` has no
        meaning on create.
      tags: [Products]
      parameters:
