        "422": { $ref: "#/components/responses/ValidationError" }

  /products/{id}:
    get:
      operationId: showProduct
      summary: Show a product
      tags: [Products]
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Product
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Product" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

    delete:
      operationId: deleteProduct
      summary: Delete a product
      description: |
        Soft-deletes the Product (sets `deleted_at`). The row remains in the database; list endpoints exclude it by default. Restore via `POST /products/{id}/restore`.

        **Cascade behavior** (per `Product::$cascadeDeletes = ['options']`):
        soft-delete cascades to product options. Each soft-deleted option
        in turn cascades to its `virtualProductOption` and `discount`.
        PricingTiers and Availabilities are NOT cascaded by Product deletion —
        they remain readable and can be cleaned up separately.
      tags: [Products]
      parameters:
        - $ref: "#/components/parameters/IdPath"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204":
          description: Soft-deleted
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/IdempotencyConflictOrProductBeingDuplicated" }
    patch:
      operationId: updateProduct
      summary: Update a product
      description: |
        Updates the Product and runs the same side-effect chain the Livewire
        form does in `app/Livewire/Product/Edit.php::update()`. The whole
        flow runs inside a single DB transaction; partial failures roll back.

        **Implicit overrides** (applied before persistence — same rules as
        `POST /products`):

        - `must_validate_cancellation_policy=false` → both
          `cancellation_policy` and `cancellation_policy_link` are nulled.
        - Effective `is_private=false` → `is_priced_per_person` is forced
          to `true` and `use_alternate_tier_pricing` to `false`.

        **Refused, not coerced:** a write that would leave
        `use_alternate_tier_pricing` set on a product that is not per-person
        tier priced comes back `422 VALIDATION_FAILED` — including under
        `dry_run`. The effective state is the payload laid over the stored row,
        so a `PATCH` sending only `is_tier_priced: false` on a product that
        already has the flag set is refused just as a full body would be. A
        product ALREADY stored in that state is exempt as long as the write
        moves none of `is_priced_per_person` / `is_tier_priced` /
        `use_alternate_tier_pricing`, so editing its other fields — and echoing
        its own values back — still works.

        **Cascading side effects** (only fire when the relevant input
        actually changed; under dry-run they're surfaced via the
        `MutationResult.side_effects` array rather than executed):

        - `is_private` toggled — every Availability of every related
          ProductOption is bulk-updated to match, then dispatches
          `UpdateBookedQuantityJob`, `UpdateCumulativeCapacityJob`,
          `UpdateIsFullyBookedJob`, `UpdateIsOpenForBookingJob`,
          `UpdateAvailableResourcesCountJob`,
          `UpdateMaxHostableGuestsNumberJob`, and `UpdateVacanciesJob`
          per chunk of 1000 Availabilities.
        - `schedule_type` switched to `date` — Availability `from`/`to`
          windows are collapsed to full-day spans and any
          `resourceables` rows for the related ProductOptions are deleted
          (DATE products are inherently resource-less).
        - `capacity` changed (only when the `ProductLevelCapacity` feature
          flag is on) — cascades to all options, then to all future
          Availabilities, and re-runs the inventory derivation jobs.
          Deferred via `defer()` so the response returns before the heavy
          fan-out runs.

        **Ticket reissue.** Changing `delivery_method` dispatches
        `DeliverTicketOrVoucher`, which deletes every ticket on every booking
        departing in the next 10 years and issues replacements in the new
        shape. The QR codes those customers are already holding stop
        scanning, and **nothing notifies them** — the operator has to resend.
        So the change is refused with `422 TICKET_REISSUE_NOT_CONFIRMED`
        unless the payload carries `confirm_ticket_reissue: true`, mirroring
        the confirmation modal the Ticketing form shows. The refusal's
        `error.details` is the same `TicketReissue` block the 200 returns —
        `delivery_method_from`, `delivery_method_to`, `affected_bookings`,
        `customers_notified` — so one renderer covers the preview and the
        refusal.

        Not refused when: the product has no bookings in that window
        (`affected_bookings` is 0 — nothing to invalidate), the submitted
        `delivery_method` equals the stored one (not a change), or `dry_run:
        true`. The dry run is the intended way to find out: it answers 200
        with `data.ticket_reissue` — `{delivery_method_from,
        delivery_method_to, affected_bookings, customers_notified: false}` —
        and the suppressed job in `data.side_effects`. The committed response
        carries the same `ticket_reissue` block.

        CHANGING `delivery_method` or `redemption_method` also requires the
        `update_delivery_method` permission — echoing back the value already
        stored does not, so a read-modify-write round trip is safe without it.
        See `POST /products`, where presence is the trigger because there is no
        stored value to compare against.

        Finally, `Product::updateCanBeSold()` re-derives the canonical
        `can_be_sold` column, matching the UI flow.
      tags: [Products]
      parameters:
        - $ref: "#/components/parameters/IdPath"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProductRequest"
      responses:
        "200":
          description: Updated (or dry-run preview)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: "#/components/schemas/MutationResult"
                          - type: object
                            properties:
                              ticket_reissue: { $ref: "#/components/schemas/TicketReissue" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/IdempotencyConflictOrProductBeingDuplicated" }
        "422":
          description: |
            Either an ordinary validation failure (`VALIDATION_FAILED`) or the
            ticket-reissue confirmation refusal (`TICKET_REISSUE_NOT_CONFIRMED`).
            Both release the `Idempotency-Key`, so the corrected retry may reuse
            it — that is what makes "add the confirmation and resend" safe.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              examples:
                ticketReissueNotConfirmed:
                  summary: delivery_method would reissue existing tickets
                  value:
                    error:
                      code: TICKET_REISSUE_NOT_CONFIRMED
                      message: >-
                        Changing the ticket type reissues tickets for 12 existing booking(s)
                        and invalidates the tickets or vouchers customers already received.
                        Customers will NOT be notified automatically — you will need to
                        resend their tickets.
                      hint: >-
                        Preview it with dry_run: true, then resend with
                        confirm_ticket_reissue: true to go ahead.
                      retriable: false
                      details:
                        delivery_method_from: VOUCHER
                        delivery_method_to: TICKET
                        affected_bookings: 12
                        customers_notified: false

