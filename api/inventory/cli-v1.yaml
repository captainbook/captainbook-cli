    Category:
      type: object
      description: |
        Read-only resource (no Create/Update endpoints — Phase 1B + commit
        9bce20074). Mirrors `CategoryResource::toArray()`. The
        `product_categories` table only persists `id` + `name`; `slug`,
        `description`, and `position` are surfaced because the
        `ProductCategory` model has accessors for them, but they read as null
        / 0 against today's schema. It carries no timestamp columns either, so
        `created_at` is always null and `GET /categories?since=` is refused
        with 422.
      properties:
        id: { type: string }
        name: { type: [string, "null"], description: "English translation of the `name` column." }
        slug: { type: [string, "null"], description: "No underlying column — null today." }
        description: { type: [string, "null"], description: "No underlying column — null today." }
        position: { type: [integer, "null"], description: "No underlying column — null today." }
        product_count: { type: [integer, "null"], description: "Set only when the `products` relation is eager-loaded; otherwise null." }
        created_at: { type: [string, "null"], format: date-time, description: "Always null — no such column on `product_categories`." }

    Resource:
      type: object
      description: |
        Physical or human inventory bound to a ProductOption (a boat, a
        guide, a yoga studio). `category` is the kind of resource;
        `type` is a free-form label tenants pick (`Sailboat`, `Senior
        Guide`, etc.). `capacity` is optional — null means the resource
        doesn't constrain seat count by itself.
      properties:
        id: { type: string }
        name: { type: [string, "null"] }
        type: { type: [string, "null"] }
        category:
          type: [string, "null"]
          enum: [guide, asset, equipment, auxiliary, null]
        capacity: { type: [integer, "null"] }
        rating: { type: [number, "null"], format: float }
        deleted_at: { type: [string, "null"], format: date-time }
        created_at: { type: [string, "null"], format: date-time }
        updated_at: { type: [string, "null"], format: date-time }

    Partner:
      type: object
      description: |
        Mirrors `PartnerResource::toArray()`. A selling partner (an agency
        that books on a traveller's behalf) or a channel partner. Read-only
        over the CLI: creating one sets a commission rate, and the web form
        carries plan-limit rules a CLI create would have to restate.

        A partner can be a booking's PROVIDER or its CUSTOMER; both report
        `origin.type = indirect_offline` on the booking, which carries a null
        `origin.channel_id` — so `GET /bookings?partner_id=` is the only way
        to go from a partner to their bookings.
      properties:
        id: { type: string }
        name: { type: [string, "null"] }
        email: { type: [string, "null"] }
        phone: { type: [string, "null"] }
        partner_type:
          type: [string, "null"]
          enum: [channel, selling_partner, null]
        commission:
          type: [number, "null"]
          format: float
          description: |
            Per cent of the fare the partner keeps. A RATE, not money — unlike
            every priced field on this API it is a float and carries no
            currency.
        created_at: { type: [string, "null"], format: date-time }
        updated_at: { type: [string, "null"], format: date-time }
        deleted_at: { type: [string, "null"], format: date-time }

    PartnerPage:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/Partner" }

    Location:
      type: object
      description: |
        Mirrors `LocationResource::toArray()`. The `locations.type` column is
        a MySQL enum with values `PRIMARY|START|END|VISITED|SECONDARY` (no
        `MEETING` — earlier spec drafts listed it but it was never a valid
        value; the column write would silently coerce to NULL).
        `address` is a derived accessor (`getAddressAttribute()` composing
        `street_address` + city + country). `timezone` and `notes` have no
        underlying columns and read as null today.
      properties:
        id: { type: string }
        type:
          type: [string, "null"]
          enum: [PRIMARY, START, END, VISITED, SECONDARY, null]
        name: { type: [string, "null"] }
        address: { type: [string, "null"], description: "Derived from `street_address` (+ optional city/country)." }
        latitude: { type: [number, "null"], format: float }
        longitude: { type: [number, "null"], format: float }
        google_place_id: { type: [string, "null"] }
        timezone: { type: [string, "null"], description: "Always null today — no underlying column." }
        notes: { type: [string, "null"], description: "Always null today — no underlying column." }
        created_at: { type: [string, "null"], format: date-time }

    Media:
      type: object
      properties:
        id: { type: string }
        product_id: { type: string }
        type:
          type: string
          enum: [image, document]
        url: { type: string, format: uri }
        thumbnail_url: { type: [string, "null"], format: uri }
        original_filename: { type: string }
        mime_type: { type: string }
        size_bytes: { type: integer }
        alt_text: { type: [string, "null"] }
        position: { type: integer }
        created_at: { type: string, format: date-time }

    CategoryPage:
