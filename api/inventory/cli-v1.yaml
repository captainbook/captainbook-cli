  # ──────────────────────────────────────────────────────────────────────
  # Workflows
  #
  # Tenant-level gate: every workflow endpoint is additionally wrapped by
  # the `WorkflowsIncludedInSubscription` middleware. A tenant whose plan
  # does not include workflows (`tenant->getPlanLimit('workflows') === 0`)
  # gets a 404 from EVERY workflow endpoint, matching the UI's upgrade-
  # gate behavior in `app/Policies/WorkflowPolicy::workflowsIncludedInPlan`.
  #
  # Step structure (parent_step_id, branch_type, order, step_type,
  # action_type) is immutable post-create. PATCH /steps/{id} only accepts
  # a `config` payload. To move or reshape a step, delete and re-create.
  # There is no reorder endpoint (the UI doesn't expose reorder either).
  #
  # The trigger is a singleton per workflow (one row with step_type=TRIGGER,
  # order=0) managed via /workflows/{id}/trigger. POST creates or replaces
  # the trigger atomically. Step CRUD via /steps* does not accept
  # step_type=TRIGGER.
  #
  # Workflow status is one of DRAFT, PAUSED, ACTIVE. Any write to
  # /trigger or /steps* on an ACTIVE workflow returns 409
  # WORKFLOW_NOT_EDITABLE — the executor would otherwise see a half-
  # changed step shape mid-execution. Shell PATCH (name, description,
  # notify_on_fail, max_credits_per_run) is allowed on ACTIVE.
  # ──────────────────────────────────────────────────────────────────────
  /workflow-nodes:
    get:
      operationId: listWorkflowNodes
      summary: The trigger + action catalogue for composing a workflow
      description: |
        Read-only, and not a resource — there is no row behind it. It answers
        the one question a caller composing a workflow cannot answer any other
        way: which `action_type` values exist, which `step_type` each belongs
        to, and what each one's `config` bag must contain.

        The in-product Builder answers it with a clickable palette. This API had
        no equivalent: `POST /workflows/{id}/steps` types `action_type` as a
        bare string, so every API caller was guessing a name and a config shape
        against a validator.

        Tenant-shaped: an action whose required app the tenant does not have is
        omitted, so a caller is never told about a node they cannot run.

        `config` values are the node's own Laravel rules flattened to a string.
        Rule OBJECTS are dropped rather than printed — a class name is not
        something a caller can act on — so this is a guide, not the gate: the
        write path still runs the real `rules()`.
      tags: [Workflows]
      parameters:
        - name: kind
          in: query
          required: false
          schema:
            type: string
            enum: [trigger, action, logic]
          description: |
            Narrow the catalogue. Omitted, all three groups are returned, which
            is a large payload for a caller that already knows which half it
            wants.
      responses:
        "200":
          description: The node catalogue
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          triggers:
                            type: array
                            items: { $ref: "#/components/schemas/WorkflowNode" }
                          actions:
                            type: array
                            items: { $ref: "#/components/schemas/WorkflowNode" }
                          logic:
                            type: array
                            items: { $ref: "#/components/schemas/WorkflowNode" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /workflows:
    get:
      operationId: listWorkflows
      summary: List workflows
      tags: [Workflows]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/IncludeTrashed"
        - $ref: "#/components/parameters/Since"
        - name: status
          in: query
          schema: { type: string, enum: [draft, paused, active] }
      responses:
        "200":
          description: Page of workflows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowPage"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

    post:
      operationId: createWorkflow
      summary: Create a workflow (DRAFT)
      description: |
        Creates a workflow with `status=DRAFT`. `business_unit_id` defaults to
        the calling user's current business unit when omitted.

        **Send `trigger` and `steps` with it.** Without them you get an empty
        shell: a workflow that triggers on nothing, does nothing, and cannot be
        activated. The three-call shape (create → `POST /trigger` →
        `POST /steps`) still works and is unchanged, but it is only usable by a
        caller that can make three calls — CaptainBook AI parks exactly one
        change per turn for the operator to approve, so it created the shell,
        was refused on the second call, and the operator approved a card that
        produced an empty workflow.

        The whole draft is written in ONE transaction. Every node's `config` is
        validated against its own `rules()` through the same `StepConfigValidator`
        the dedicated endpoints use, in dry-run as well as on commit — a preview
        that succeeded where the commit would 422 is a card the operator can
        approve into a failure.

        **Branching uses refs, not ids.** None of these steps exists yet, so
        there is no `parent_step_id` to send. Give a step a caller-chosen `ref`
        and point a later step at it with `parent_ref` + `branch_type`. A
        `parent_ref` naming a step that is not listed EARLIER is a 422, never a
        silently-flattened branch.

        `order` defaults to the step's position in the list (the trigger holds
        order 0, so the first step is 1).

        The valid `action_type` values and the `config` shape each one needs come
        from `GET /workflow-nodes`. Nothing else on this API describes them.

        Still DRAFT afterwards: a composed create writes a workflow that is ready
        to arm, never an armed one. `POST /activate` remains a separate,
        deliberate call.
      tags: [Workflows]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkflowRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: "#/components/schemas/MutationResult"
                          - type: object
                            properties:
                              id: { type: string, description: UUID }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/IdempotencyConflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /workflows/{id}:
    get:
      operationId: showWorkflow
      summary: Show a workflow with its trigger + step tree
      tags: [Workflows]
      parameters:
        - $ref: "#/components/parameters/IdPath"
        - $ref: "#/components/parameters/IncludeTrashed"
      responses:
        "200":
          description: Workflow
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Workflow" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

    patch:
      operationId: updateWorkflow
      summary: Update workflow shell fields
      description: |
        Updates name, description, notify_on_fail, max_credits_per_run.
        Allowed on ANY status including ACTIVE — these fields have no
        execution-time impact. For status changes use
        /activate and /deactivate.
      tags: [Workflows]
      parameters:
        - $ref: "#/components/parameters/IdPath"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateWorkflowRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/MutationResult" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/IdempotencyConflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

    delete:
      operationId: destroyWorkflow
      summary: Soft-delete a workflow (cascades to steps)
      description: |
        Soft-deletes the workflow and cascade-soft-deletes its steps via the
        `WorkflowObserver`. Execution rows are retained: the
        `workflow_executions.workflow_id` FK is SET NULL on hard-delete, but
        soft-delete leaves the FK pointing at the trashed workflow which can
        still be restored.

        A waiting execution whose parent workflow is soft-deleted will resolve
        to FAILED with `fail_reason=workflow_deleted_mid_run` when the queued
        ProcessWorkflowJob picks it up next.

        **A workflow that has ever finished a run cannot be deleted at all.**
        Terminal execution rows (COMPLETED / FAILED) are refused with
        `409 WORKFLOW_HAS_EXECUTIONS`, matching the Builder UI, because the
        run history is load-bearing for support. That is the common case for
        any workflow that has been live, so treat delete as the exception and
        `POST /workflows/{id}/deactivate` as the way to stop one — pausing
        keeps the history and stops new runs. In-flight rows
        (PENDING / RUNNING / WAITING) do NOT block the delete; they are the
        `workflow_deleted_mid_run` path above.
      tags: [Workflows]
      parameters:
        - $ref: "#/components/parameters/IdPath"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                dry_run: { type: boolean, default: false }
      responses:
        "200":
          description: Soft-deleted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/MutationResult" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            Either an idempotency conflict — see
            `#/components/responses/IdempotencyConflict`, which enumerates
            `IDEMPOTENCY_CONFLICT`, `IDEMPOTENCY_IN_PROGRESS` (retriable) and
            `IDEMPOTENCY_UNKNOWN` (reconcile by hand) — or
            `WORKFLOW_HAS_EXECUTIONS`: the workflow has terminal execution
            rows (COMPLETED / FAILED) and cannot be deleted at all. Match on
            `error.code`, not on the status. Only
            `IDEMPOTENCY_IN_PROGRESS` is worth retrying; the rest, including
            `WORKFLOW_HAS_EXECUTIONS`, are dead ends for the request as sent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /workflows/{id}/restore:
    post:
      operationId: restoreWorkflow
      summary: Restore a soft-deleted workflow
      description: |
        Clears `deleted_at` and cascade-restores steps that were trashed by
        this workflow's prior soft-delete (matched via the
        `workflow_steps.cascade_deleted_by` token). Steps the user trashed
        individually before the workflow are left alone. Idempotent: restore
        on a live workflow returns the row unchanged.
      tags: [Workflows]
      parameters:
        - $ref: "#/components/parameters/IdPath"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                dry_run: { type: boolean, default: false }
      responses:
        "200":
          description: Restored
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/MutationResult" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/IdempotencyConflict" }

  /workflows/{id}/activate:
    post:
      operationId: activateWorkflow
      summary: Validate the tree and flip to ACTIVE
      description: |
        Runs `WorkflowActivationValidator` over the workflow's full step
        tree. ALL errors are returned in a single response — the validator
        does not short-circuit on the first failure. Checks:

        1. Workflow has a TRIGGER step.
        2. Workflow has at least one non-TRIGGER step.
        3. Every step's `parent_step_id` (when set) references another step
           in the same workflow.
        4. Every step's config validates against the action's `rules()`
           schema (the contract added in Lane A).
        5. Sum of step `creditsCost()` ≤ `max_credits_per_run` (when set).

        On failure, returns 422 WORKFLOW_NOT_ACTIVATABLE with
        `error.details.errors[]` carrying one entry per check. Each entry
        has `code` (NO_TRIGGER, NO_STEPS, ORPHAN_PARENT_REF,
        INVALID_STEP_CONFIG, INVALID_STEP_TYPE, CREDIT_LIMIT_EXCEEDED) and
        a human-readable `message`; step-level errors include `step_id`.

        On success, flips status to ACTIVE. Idempotent: activate on an
        already-ACTIVE workflow returns the row unchanged.
      tags: [Workflows]
      parameters:
        - $ref: "#/components/parameters/IdPath"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                dry_run: { type: boolean, default: false }
      responses:
        "200":
          description: Activated (or already active)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/MutationResult" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/IdempotencyConflict" }
        "422":
          description: Validation gate failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /workflows/{id}/deactivate:
    post:
      operationId: deactivateWorkflow
      summary: Flip to PAUSED (idempotent)
      tags: [Workflows]
      parameters:
        - $ref: "#/components/parameters/IdPath"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                dry_run: { type: boolean, default: false }
      responses:
        "200":
          description: Paused (or already paused)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/MutationResult" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/IdempotencyConflict" }

  /workflows/{id}/trigger:
    post:
      operationId: createWorkflowTrigger
      summary: Create or replace the trigger (singleton)
      description: |
        Atomic create-or-replace. If the workflow already has a trigger, it is
        force-deleted and the new trigger is written in the same request.
        Per-trigger `config` is validated against the resolved trigger's
        `rules()` schema; failures return 422 INVALID_STEP_CONFIG with
        Laravel-shaped field=>messages in `error.details.errors`.

        Requires workflow.status ∈ {DRAFT, PAUSED}. ACTIVE returns 409
        WORKFLOW_NOT_EDITABLE.
      tags: [Workflows]
      parameters:
        - $ref: "#/components/parameters/IdPath"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkflowTriggerRequest"
      responses:
        "200":
          description: Trigger replaced
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: "#/components/schemas/MutationResult"
                          - type: object
                            properties:
                              id: { type: integer }
        "201":
          description: Trigger created (no prior trigger)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: "#/components/schemas/MutationResult"
                          - type: object
                            properties:
                              id: { type: integer }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Workflow not editable (ACTIVE) or idempotency conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422": { $ref: "#/components/responses/ValidationError" }

    patch:
      operationId: updateWorkflowTrigger
      summary: Update trigger config only
      description: |
        Replaces the trigger's `config` payload. The trigger's `action_type`
        is immutable — to change it, call POST /trigger (which atomically
        replaces). 409 `WORKFLOW_TRIGGER_MISSING` if no trigger exists yet
        (use POST first) — **not** a 404, because the workflow itself does
        exist and a 404 would read as "no such workflow"; the hint names the
        POST. 409 `WORKFLOW_NOT_EDITABLE` if status=ACTIVE. A 404 here means
        the WORKFLOW was not found.
      tags: [Workflows]
      parameters:
        - $ref: "#/components/parameters/IdPath"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateWorkflowTriggerRequest"
      responses:
        "200":
          description: Trigger updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/MutationResult" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            `WORKFLOW_TRIGGER_MISSING` (no trigger to patch — POST one
            first), `WORKFLOW_NOT_EDITABLE` (status=ACTIVE), or an
            idempotency conflict. Match on `error.code`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422": { $ref: "#/components/responses/ValidationError" }

  /workflows/{id}/steps:
    post:
      operationId: createWorkflowStep
      summary: Create a step (tree-shaped)
      description: |
        Creates a non-trigger step (ACTION, CONDITION, DELAY, DELAY_UNTIL,
        LOOP). Steps form a tree via `parent_step_id` + `branch_type`. The
        parent must belong to the same workflow — cross-workflow refs are
        rejected with 422.

        Config is validated against the resolved action's `rules()` schema
        before persistence; failures return 422 INVALID_STEP_CONFIG.

        step_type=TRIGGER is rejected here — use /workflows/{id}/trigger
        for the trigger singleton.

        Requires workflow.status ∈ {DRAFT, PAUSED}.
      tags: [Workflows]
      parameters:
        - $ref: "#/components/parameters/IdPath"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkflowStepRequest"
      responses:
        "201":
          description: Step created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: "#/components/schemas/MutationResult"
                          - type: object
                            properties:
                              id: { type: integer }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Workflow not editable (ACTIVE) or idempotency conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422": { $ref: "#/components/responses/ValidationError" }

  /workflows/{id}/steps/{stepId}:
    patch:
      operationId: updateWorkflowStep
      summary: Update step config only
      description: |
        Updates the step's `config` payload. Structure (`parent_step_id`,
        `branch_type`, `order`, `step_type`, `action_type`,
        `condition_type`) is immutable post-create — to move or reshape a
        step, delete and re-create. Requires workflow.status ∈ {DRAFT,
        PAUSED}.
      tags: [Workflows]
      parameters:
        - $ref: "#/components/parameters/IdPath"
        - name: stepId
          in: path
          required: true
          schema: { type: integer }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateWorkflowStepRequest"
      responses:
        "200":
          description: Step updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/MutationResult" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Workflow not editable (ACTIVE) or idempotency conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422": { $ref: "#/components/responses/ValidationError" }

    delete:
      operationId: destroyWorkflowStep
      summary: Soft-delete a step
      tags: [Workflows]
      parameters:
        - $ref: "#/components/parameters/IdPath"
        - name: stepId
          in: path
          required: true
          schema: { type: integer }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                dry_run: { type: boolean, default: false }
      responses:
        "200":
          description: Soft-deleted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/MutationResult" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Workflow not editable (ACTIVE) or idempotency conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  # ──────────────────────────────────────────────────────────────────────
  # Workflow executions — read-only (Eng D3).
  # No trigger/cancel/retry endpoints in v1. Support uses the Builder UI
  # for those operations.
  # ──────────────────────────────────────────────────────────────────────
  /workflow-executions:
    get:
      operationId: listWorkflowExecutions
      summary: List workflow executions
      description: |
        Filterable list of workflow execution rows. Default ordering: latest
        first (`created_at DESC, id DESC`) — the most common support query
        is "what failed in the last hour".
      tags: [WorkflowExecutions]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: workflow_id
          in: query
          schema: { type: string, maxLength: 255, description: UUID }
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, running, waiting, completed, failed]
        - name: fail_reason
          in: query
          schema: { type: string, maxLength: 255, description: "e.g. workflow_deleted_mid_run" }
        - name: date_from
          in: query
          schema: { type: string, format: date-time }
        - name: date_to
          in: query
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Page of executions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowExecutionPage"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /workflow-executions/{id}:
    get:
      operationId: showWorkflowExecution
      summary: Show an execution (with embedded failed log)
      description: |
        Returns the execution row plus `failed_log` — the first
        WorkflowExecutionLog row with status=FAILED, so support can debug
        a failed run without a second /logs round-trip. For full per-step
        log history, use /workflow-executions/{id}/logs.
      tags: [WorkflowExecutions]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Execution with embedded failed log
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/WorkflowExecution" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  /workflow-executions/{id}/logs:
    get:
      operationId: listWorkflowExecutionLogs
      summary: Paginated per-step logs for an execution
      tags: [WorkflowExecutions]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: step_id
          in: query
          schema: { type: integer, minimum: 1, description: "Filter to one step's history." }
      responses:
        "200":
          description: Page of execution logs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowExecutionLogPage"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum PAT
      description: |
        Sanctum personal-access-token. Issued via the Provider panel (UI).
        Tenant-scoped; attempting to use a token outside its tenant returns 401.
        Per-token `expires_at` enforced by Sanctum 4 framework-side.

        **Abilities (token scopes).** Tokens carry an `abilities` array.
        Endpoints check abilities at the route layer; missing abilities → 403.

        | Ability     | Required for                                                           |
        | ----------- | ---------------------------------------------------------------------- |
        | `cli:read`  | Always granted alongside read endpoints; not enforced explicitly.      |
        | `cli:write` | Every mutating endpoint **not** listed under `cli:cs`: products, product-options, availabilities (incl. availability-rules, bulk-update, bulk-delete), pricing-categories, pricing-tiers, discounts (incl. apply), gift-certs (available CRUD + issue / resend), guests, extras, questions, resources (incl. attach / detach on product-options and `POST /bookings/{id}/resources`), locations, media, workflows (incl. steps + trigger), segments (create). Stated as the complement of `cli:cs` on purpose: an enumeration drifts every time a resource is added. |
        | `cli:cs`    | CS-only sensitive ops: booking **cancel**, comp, refund, and confirmation resend, plus issued gift-cert **void** — the five routes gated on `abilities:cli:cs` (they sit in two groups in `routes/api_cli_v1.php`, not one). Cancel is CS for **every** `refund_policy` value, `none` (which moves no money) included; void is CS because it kills an instrument the customer paid for. Ticking it requires the `issue_cli_cs_token` permission (admin by default), so it is a privilege boundary rather than only a blast-radius control. |

        Recommended issuance: a dedicated `cli:read` token for scripted
        reporting, a `cli:read` + `cli:write` token for inventory editors, and
        a `cli:read` + `cli:write` + `cli:cs` token for CS engineers.

        **Who may issue which tier.** Each ability has a matching permission —
        `issue_cli_read_token` (admin / manager / reservation manager by
        default), `issue_cli_write_token` and `issue_cli_cs_token` (admin) —
        checked when the token is created or edited, mirroring
        `issue_inventory_*_mcp_token` on the MCP side. A user without the
        permission is not offered the checkbox and is refused if they submit it
        anyway. Attributing a token to another user is separately gated on
        `issue_api_token_for_other_users`, and a token issued for a colleague is
        capped at what the ISSUER may issue, not at what the colleague holds.

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      description: Resource ID (ULID, UUID, or numeric, depending on resource)
      schema:
        type: string
    Limit:
      name: limit
      in: query
      description: Page size (1-200, default 50)
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor returned by previous page's `pagination.cursor_next`
      schema:
        type: string
    Q:
      name: q
      in: query
      description: |
        Free-text search across primary string fields (name, email, reference).
        `%` and `_` in the term are matched literally, so `?q=%` finds the rows
        containing a percent sign rather than every row.
      schema:
        type: string
        maxLength: 255
    Since:
      name: since
      in: query
      description: >-
        ISO 8601 lower-bound on `updated_at`. Only offered by endpoints whose
        table actually carries timestamps — `questions`, `pricing-categories`,
        `pricing-tiers`, `guests` and `categories` have no `updated_at` column
        and refuse the parameter with 422 instead of returning an unfiltered
        page.
      schema:
        type: string
        format: date-time
    SinceMediaUpdatedAt:
      name: since
      in: query
      description: >-
        ISO 8601 lower-bound on `media_updated_at` — the column this endpoint
        publishes as the resource's `created_at`. `product_attachments` carries
        no Laravel timestamps, so it has no `updated_at` to bound; that is why
        this endpoint does not use the shared `Since` parameter.
      schema:
        type: string
        format: date-time
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        UUIDv7 recommended. **One key per operation.** A key is bound to the
        method, path and body of its first use; replays of completed keys
        matching all three return the original response. A conflicting body,
        or the same key aimed at a different endpoint or resource, returns 409
        IDEMPOTENCY_CONFLICT. In-flight (request in progress on server) returns
        409 IDEMPOTENCY_IN_PROGRESS. Swept (server crashed) returns 409
        IDEMPOTENCY_UNKNOWN. Required for production use; optional for
        ad-hoc CLI invocations where the server auto-generates one.

        **Dry-run interaction:** when `dry_run: true`, the server does NOT
        persist an idempotency row. The same key may be reused once for the
        real (non-dry-run) call — the dry-run is a "free" preview. If the
        same key is sent on two real calls, normal idempotency rules apply.
      schema:
        type: string
        format: uuid

    IncludeTrashed:
      name: include_trashed
      in: query
      description: |
        Include soft-deleted rows in the response (default false).
        Only applies to resources that use Laravel's `SoftDeletes` trait
        (products, product options, pricing tiers, extras, questions).
        Accepts `true false 1 0 yes no on off`, or a JSON boolean over MCP;
        anything else is a 422 rather than being read as false.
      schema:
        type: boolean
        default: false

  responses:
    Unauthenticated:
      description: Missing, invalid, or expired bearer token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            unauthenticated:
              value:
                meta:
                  request_id: req_01HXY...
                  api_version: v1
                error:
                  code: UNAUTHENTICATED
                  message: Missing or invalid bearer token.
                  retriable: false
    Forbidden:
      description: Token valid but lacks the ability for this action, the token's user lacks the role permission the web UI requires for it, or the request attempts cross-tenant access
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: Resource not found in this tenant
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ValidationError:
      description: Request body or query failed validation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            validation:
              value:
                meta:
                  request_id: req_01HXY...
                  api_version: v1
                error:
                  code: VALIDATION_FAILED
                  message: The request body has invalid fields.
                  hint: See `error.details` for per-field issues.
                  retriable: false
                  details:
                    capacity: ["The capacity must be at least 0."]
                    from: ["The from field is required."]
    IdempotencyConflict:
      description: |
        Idempotency-Key already used. One of:
        - `IDEMPOTENCY_CONFLICT` — same key, different request. Either a different body, or a different method/path (the key is bound to the operation it was first used on). Also returned for a key issued before scoping shipped once it is more than 24h old.
        - `IDEMPOTENCY_IN_PROGRESS` — request still executing.
        - `IDEMPOTENCY_UNKNOWN` — server crashed mid-flight, swept by the `cli:prune-stale` artisan command (runs every 5 min against the central `cli_idempotency_keys` table). Caller must check Stripe/mailer logs by `request_id`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    IdempotencyConflictOrProductBeingDuplicated:
      description: |
        Either an ordinary `Idempotency-Key` conflict (see
        `#/components/responses/IdempotencyConflict` for the three codes), or:
        - `PRODUCT_BEING_DUPLICATED` — the product, or the parent product of the
          option, is mid-duplication. The copy job reads the source for a couple
          of minutes and snapshots its option set in one query, so a write in
          that window either mutates a product the job is still reading or moves
          that set out from under it. **Transient and retriable**
          (`error.retriable` is `true`): the refusal releases the
          `Idempotency-Key`, so resending the identical request under the same
          key once the copy finishes is the intended recovery. `dry_run: true`
          is never refused.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    RateLimited:
      description: Plan-based throttle exceeded
      headers:
        Retry-After:
          description: Seconds to wait before retrying
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    InternalError:
      description: Unhandled server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"

  schemas:
    Envelope:
      type: object
      required: [meta, data]
      properties:
        meta:
          $ref: "#/components/schemas/Meta"
        data:
          description: Per-endpoint payload (overridden via allOf in concrete responses)
        pagination:
          $ref: "#/components/schemas/Pagination"

    Meta:
      type: object
      required: [api_version, request_id, tenant_slug, generated_at]
      properties:
        api_version:
          type: string
          example: v1
        request_id:
          type: string
          description: ULID `req_<26 chars>`
          example: req_01HXY12345ABCDEFGHJKMNPQRS
        tenant_slug:
          type: string
          example: acme-tours
        actor:
          type: object
          properties:
            user_id: { type: integer }
            source:
              type: string
              description: Derived from request User-Agent (server does not trust client claims)
              example: cli/0.3.1
            is_cs:
              type: boolean
              description: Whether the actor token has CS-level abilities
        currency:
          type: string
          description: ISO 4217 code of the tenant
          example: EUR
        generated_at:
          type: string
          format: date-time
        dry_run:
          type: boolean
        idempotency_key:
          type: [string, "null"]

    Pagination:
      type: object
      required: [limit]
      properties:
        limit: { type: integer }
        cursor_next:
          type: [string, "null"]
          description: Opaque cursor for next page; null at end
        cursor_prev:
          type: [string, "null"]
          description: |
            Reserved for Phase 2 backward pagination. Always `null` in V1.
            Documented now so adding backward pagination later is non-breaking.

    PositiveIntegerId:
      description: |
        A positive integer id, in either spelling this API accepts.

        The validator is `['numeric', 'integer', 'min:1']`, and Laravel's
        `integer` is `filter_var(..., FILTER_VALIDATE_INT)`, which
        STRINGIFIES first — so a digit string is accepted as readily as a
        number, and the operator assistant sends one (`(string) $option->id`).
        Measured against the real validator: `5` and `"5"` are accepted;
        `"abc"`, `"05"`, `"1e0"`, `"5.0"`, `true`, `0` and `-1` are all 422.

        `"+5"` and a leading-space `" 5"` are accepted too, by accident of
        `filter_var`, and are deliberately NOT described here: a contract
        that advertises them invites a client to rely on them. So this schema
        is narrower than the validator on exactly those two spellings, which
        is the safe direction — both still work if sent, and nothing a client
        generates from this document can fail to be accepted.
      oneOf:
        - { type: integer, minimum: 1 }
        - { type: string, pattern: "^[1-9][0-9]*$" }

    ErrorEnvelope:
      type: object
      required: [meta, error]
      properties:
        meta:
          type: object
          required: [api_version, request_id, generated_at]
          properties:
            api_version: { type: string, example: v1 }
            request_id: { type: string, example: req_01HXY12345ABCDEFGHJKMNPQRS }
            currency: { type: [string, "null"], description: "The tenant's currency, mirroring the success envelope. Null before tenancy is initialized." }
            tenant_slug:
              type: [string, "null"]
              description: |
                Set on errors returned after tenant resolution (most 4xx/5xx).
                Null on errors returned BEFORE tenancy is initialized
                (e.g. unauthenticated requests, tenant-not-found responses).
            generated_at: { type: string, format: date-time }
        error:
          $ref: "#/components/schemas/Error"

    Error:
      type: object
      required: [code, message, retriable]
      properties:
        code:
          type: string
          description: |
            Machine-readable error code. Stable across versions, and the ONLY
            part of a refusal to branch on — never the `message`.

            Deliberately `type: string` rather than an `enum`: a client must
            tolerate a code it does not know, because a new domain refusal can
            ship in a minor version. Treat an unrecognised code as
            non-retriable and surface `message` plus `hint`.

            The list below is COMPLETE as of this version — every refusal the
            API can return is named here, and
            `tests/Architecture/CliErrorCodeSpecParityTest.php` fails the build
            if a code the server raises is missing from it.

            Transport and envelope:
            UNAUTHENTICATED, FORBIDDEN, NOT_FOUND, VALIDATION_FAILED,
            RATE_LIMITED, INTERNAL_ERROR.

            Idempotency (see `#/components/responses/IdempotencyConflict`):
            IDEMPOTENCY_CONFLICT, IDEMPOTENCY_IN_PROGRESS (retriable),
            IDEMPOTENCY_UNKNOWN.

            Bookings and money:
            BOOKING_ALREADY_CANCELLED, REFUND_AMOUNT_EXCEEDS_CHARGE,
            REFUND_REQUIRES_STRIPE_CHARGE, NO_CHARGE_FOUND,
            POLICY_AUTO_NOT_READY, BOOKING_RESOURCE_STATE_STALE,
            BOOKING_RESOURCE_CONFLICT, GIFT_CERT_ALREADY_REDEEMED,
            DISCOUNT_NOT_APPLICABLE.

            Catalogue and inventory:
            PRODUCT_BEING_DUPLICATED, TICKET_REISSUE_NOT_CONFIRMED,
            AVAILABILITY_HAS_ACTIVE_BOOKING, AVAILABILITY_HAS_CONFIRMED_BOOKING,
            RESOURCE_IN_USE.

            Workflows:
            WORKFLOW_NOT_ACTIVATABLE, WORKFLOW_NOT_EDITABLE,
            WORKFLOW_HAS_EXECUTIONS, WORKFLOW_TRIGGER_MISSING,
            INVALID_STEP_CONFIG.
        message:
          type: string
        hint:
          type: string
          description: Human-readable next-step guidance
        retriable:
          type: boolean
        details:
          type: object
          description: Per-field validation errors or domain-specific context
          additionalProperties: true

    TicketReissue:
      type: object
      description: |
        Present on `PATCH /products/{id}` — both the dry-run preview and the
        committed response — ONLY when the request moves `delivery_method`.
        Absent when the field is omitted, or carries the value the product
        already has (that is not a change and reissues nothing).

        `affected_bookings` is the number of bookings whose tickets the change
        deletes and reissues, counted over the same 10-year departure window
        `DeliverTicketOrVoucher` then walks. It is NOT scoped to the caller's
        business unit, because the job is not either — a scoped number would
        promise a smaller blast radius than the one that actually lands.

        The same four keys are returned as `error.details` on the `422
        TICKET_REISSUE_NOT_CONFIRMED` refusal, so a client can render one shape
        for both the preview and the refusal.
      required: [delivery_method_from, delivery_method_to, affected_bookings, customers_notified]
      properties:
        delivery_method_from:
          type: string
          enum: [TICKET, VOUCHER]
          description: The stored value the change moves away from.
        delivery_method_to:
          type: string
          enum: [TICKET, VOUCHER]
          description: The submitted value.
        affected_bookings:
          type: integer
          minimum: 0
          description: >-
            Bookings whose tickets the change would reissue, counted just before
            the write. It is an ESTIMATE, not an outcome: the job runs
            afterwards and re-reads its own window, so a booking taken in
            between is reissued without being counted here. `0` means nothing is
            currently invalidated, and the confirmation is not required.
        customers_notified:
          type: boolean
          description: Always `false` — reissuing sends nothing. The operator has to resend the tickets themselves.

    MutationResult:
      type: object
      description: Common shape for mutation responses (and dry-run previews)
      properties:
        would_apply:
          type: boolean
          description: True only when the request was a dry-run
        diff:
          type: object
          description: Before/after summary (always present on dry-run, optional on commit)
          properties:
            before: { type: object, additionalProperties: true }
            after: { type: object, additionalProperties: true }
        side_effects:
          type: array
          description: List of jobs/mails/Stripe calls that ran (or would run on dry-run)
          items:
            type: object
            properties:
              type: { type: string, enum: [job, mail, broadcast, stripe, event] }
              identifier: { type: string }
              payload_summary: { type: string }

    Money:
      type: integer
      description: Amount in minor units of the tenant currency (cents for EUR/USD; whole units for JPY/HUF/etc)
      example: 15000

    WhoamiData:
      type: object
      properties:
        actor:
          type: object
          properties:
            user_id: { type: integer }
            email: { type: string, description: "Read-only — not validated as RFC-5322. Some legacy/imported rows carry malformed emails." }
            name: { type: string }
            is_cs: { type: boolean }
        tenant:
          type: object
          properties:
            slug: { type: string }
            name: { type: string }
            currency: { type: string }
            timezone: { type: string }
        token:
          type: object
          properties:
            name: { type: string }
            abilities:
              type: array
              items: { type: string }
            expires_at:
              type: [string, "null"]
              format: date-time

    Product:
      type: object
      description: |
        Mirrors `ProductResource::toArray()`. Translatable text fields
        (`title`, `description`, `instructions`, `requirements`, `inclusions`,
        `exclusions`) are returned in English via
        `toArrayWithTranslations('en')`. `description`, `instructions`, and
        `requirements` are rich-text (HTML accepted). `inclusions` and
        `exclusions` are plain text — the dashboard renders them as a bullet
        list, splitting on newlines. `status` is derived from `is_active`
        (`is_active` is also surfaced directly for clients that prefer the
        canonical boolean).

        A value READ here can exceed the 65,535-byte cap the write schemas
        enforce. The cap arrived in 1.17.0 and rows written before it were not
        rewritten, and an image pasted into the dashboard editor lands as an
        inline base64 data URI. So a read-modify-write that echoes one of these
        fields back unchanged is a 422 naming that field, on a request that
        meant to change something else entirely. Shorten or clear the named
        field; retrying the same body cannot succeed.
      properties:
        id: { type: string }
        product_code: { type: [string, "null"], description: "Tenant-supplied SKU. Auto-generated when `CreateProductRequest` omits it." }
        title: { type: [string, "null"] }
        description: { type: [string, "null"] }
        instructions: { type: [string, "null"], description: "Translatable rich-text shown to confirmed customers." }
        requirements: { type: [string, "null"], description: "Translatable rich-text — what the customer needs to bring / know." }
        inclusions: { type: [string, "null"], description: "Plain text — what's included. One bullet per newline. Translatable. NOT rich-text — HTML/Markdown will render literally on the customer site, and the server rejects payloads containing HTML tags with 422." }
        exclusions: { type: [string, "null"], description: "Plain text — what's not included. One bullet per newline. Translatable. NOT rich-text — HTML/Markdown will render literally on the customer site, and the server rejects payloads containing HTML tags with 422." }
        status:
          type: string
          enum: [draft, published]
          description: "Derived from `is_active` (`true` → published, `false` → draft)."
        is_active: { type: boolean, description: "Canonical boolean from the `is_active` column." }
        is_private: { type: [boolean, "null"], description: "`true` = private (a single party books the whole experience); `false` = shared (multiple parties share the slot)." }
        is_priced_per_person: { type: [boolean, "null"], description: "`true` = price applies per traveler; `false` = price applies per group/booking." }
        is_tier_priced: { type: [boolean, "null"], description: "Whether pricing tiers (qty-based pricing) apply." }
        use_alternate_tier_pricing: { type: [boolean, "null"], description: "Alternate tier-pricing rendering / calculation." }
        show_last_tier: { type: [boolean, "null"], description: "Whether the last tier is displayed in customer-facing pricing." }
        displayable: { type: [boolean, "null"], description: "Whether the product is shown in widgets / catalog." }
        must_validate_cancellation_policy: { type: [boolean, "null"], description: "Customer must explicitly accept the cancellation policy at checkout." }
        schedule_type:
          type: [string, "null"]
          enum: [date, datetime, null]
          description: "`date` = customer picks a date only; `datetime` = customer picks a date and a starting time."
        delivery_method:
          type: [string, "null"]
          enum: [TICKET, VOUCHER, null]
          description: "\"Ticket type\" in the dashboard. `VOUCHER` = one ticket for the whole booking; `TICKET` = one per guest. Decides the shape of the QR tokens a booking carries, and therefore how attendance is counted. Null only on the unsaved preview a `dry_run` create returns — the column has a `VOUCHER` default, so a persisted row always has one."
        redemption_method:
          type: [string, "null"]
          enum: [MANIFEST, DIGITAL, PRINT, null]
          description: "How the customer proves they are booked: `MANIFEST` = no identification needed, `DIGITAL` = digital or printed tickets accepted, `PRINT` = printed only. Null only on a `dry_run` create preview; the column defaults to `MANIFEST`."
        from_price:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Money"
        from_price_label: { type: [string, "null"], description: "Caption shown next to `from_price` (e.g., `From €50/person`)." }
        currency: { type: [string, "null"], description: "The tenant's currency — no column on `products`; `from_price` and every downstream fare are denominated in it. Null only when no tenant is bound, which no route can reach; there is no default." }
        capacity: { type: [integer, "null"] }
        cancellation_policy: { type: [string, "null"], description: "Inline policy text. Mutually exclusive with `cancellation_policy_link` in the UI." }
        cancellation_policy_link: { type: [string, "null"], format: uri, description: "External URL with the policy. Mutually exclusive with `cancellation_policy` in the UI." }
        locale: { type: [string, "null"], description: "Default content locale for this product." }
        timezone: { type: [string, "null"] }
        category_ids:
          type: array
          items: { type: string }
          description: "IDs of attached `ProductCategory` rows; empty array when the relation isn't eager-loaded."
        deleted_at: { type: [string, "null"], format: date-time, description: "Set when soft-deleted; null otherwise" }
        created_at: { type: [string, "null"], format: date-time }
        updated_at: { type: [string, "null"], format: date-time }

    ProductOption:
      type: object
      description: |
        Mirrors `ProductOptionResource::toArray()`. The underlying
        `product_options` table column is `name`, but the wire shape exposes it
        as `title` for symmetry with Product (the controller maps
        `title` ↔ `name` on write). ProductOption has no `description` of its
        own — that lives on the parent Product. ProductOption likewise has no
        active/published flag; visibility is governed by the parent Product's
        `is_active`.
      properties:
        id: { type: string }
        product_id: { type: string }
        title: { type: [string, "null"], description: "Sourced from the `name` column (no translatable layer)." }
        option_code: { type: [string, "null"], description: "Tenant-supplied SKU. Auto-generated from the title slug + random suffix when omitted on create." }
        capacity: { type: [integer, "null"] }
        min_age: { type: [integer, "null"] }
        max_age: { type: [integer, "null"] }
        deleted_at: { type: [string, "null"], format: date-time, description: "Set when soft-deleted; null otherwise" }
        created_at: { type: [string, "null"], format: date-time }
        updated_at: { type: [string, "null"], format: date-time }

    AvailabilityRulePreview:
      type: object
      description: |
        Echo of the recurrence rule the server expanded plus a small sample
        of the resulting (from, to) windows for human inspection.
      properties:
        product_option_id: { type: string }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }
        weekdays:
          type: array
          items: { type: integer, minimum: 0, maximum: 6 }
          description: "PHP `format('w')` — Sunday=0 through Saturday=6."
        start_time:
          type: string
          example: "14:00"
          description: >
            The FIRST departure time, so a rule sent in the scalar shape
            reads back in it. With `times`, see `times[].start_time` for the
            rest.
        end_time: { type: string, example: "18:00", description: "The FIRST departure time's end." }
        add_days_count: { type: integer, minimum: 0 }
        capacity:
          type: integer
          minimum: 0
          example: 12
          description: >
            Seats every departure will be created with — the EFFECTIVE value,
            so it is present whether or not the request named one. It reads
            the product option's own capacity when the request named none, and
            the total this option's resources impose when they are what
            decides (see `capacity_source`). This is the number a commit puts
            on sale; read it on the dry run.
        capacity_source:
          type: string
          enum: [rule, product_option, resources]
          example: rule
          description: >
            Which of three things decided `capacity`. `rule` — the request
            named it. `product_option` — it did not, so the option's own
            column applies. `resources` — this option takes its capacity from
            its resources (guides, or auxiliary inventory), so
            `availabilities.capacity` is written but never consulted and the
            figure above is the resource total.


            The figure alone cannot distinguish these, and they differ in
            where an operator goes to change it. Sending `capacity` for an
            option in the `resources` state is refused with 422 rather than
            stored and ignored; omitting it is accepted and reported here.
        times:
          type: array
          minItems: 1
          description: |
            This rule's departure times, with each one's own counts. Always
            present and never empty: the scalar `start_time` / `end_time`
            shape is reported as a single entry.

            Every other number on this response is a SUM — `would_create`
            adds the times together and a calendar view groups by date — so
            a time that contributed nothing is invisible behind its
            siblings. Adding a third daily departure to a season that
            already has two is the ordinary case, and without this breakdown
            the preview reports "62 of 186" and says nothing about which two
            thirds were already there.
          items:
            type: object
            properties:
              start_time: { type: string, example: "11:30" }
              end_time: { type: string, example: "14:00" }
              add_days_count: { type: integer, minimum: 0 }
              total_matched: { type: integer, description: "Dates this time matched." }
              would_create: { type: integer, description: "Of those, how many will be written for this time." }
              already_exists: { type: integer, description: "Of those, how many this option already has." }
        total_matched: { type: integer, description: "(date, time) pairs the rule matched, summed over `times`." }
        would_create:
          type: integer
          description: >
            Of those, how many will actually be written, summed over `times`.
            An occurrence whose (from, to) the option already has is skipped,
            so a re-run of the same rule creates nothing. Read THIS, not
            `total_matched`, to know what a commit will do.
        sample_dates:
          type: array
          maxItems: 3
          description: >
            Up to three of the windows that would be CREATED — not the first
            three the rule matched — so it is empty whenever `would_create`
            is 0. The digits are the product's local wall clock, relabelled
            with the product's `timezone` through the same helper
            `GET /availabilities` uses — so a departure reads identically on
            both surfaces, including when that zone is unusable.

            Relabelling can MOVE the digits in one case: a stored wall clock
            that does not exist in the product's zone, which is to say inside
            a DST gap. A rule sent as `start_time: 02:30` on an
            `America/New_York` product stores `02:30` and publishes
            `03:30:00-04:00` — 03:30 at offset -04:00, not a range — because
            there is no 02:30 that day and Carbon normalises forward to a
            real instant. `GET /availabilities` does
            the same, so the two still agree.

            `products.timezone` is not validated as a timezone on write, so
            an unusable value falls back to `+00:00` on both surfaces —
            whether `DateTimeZone` refuses it outright (`Not/AZone`) or
            parses it as an offset so wide that no `date-time` consumer
            could read it (`"99"`, which used to publish `+99:00`). A
            legitimate numeric offset inside `±23:59` (`+05:30`, `-0300`) is
            honoured as written. Validating the column itself is tracked
            separately.
          items:
            type: object
            properties:
              from: { type: string, format: date-time }
              to: { type: string, format: date-time }

    AvailabilityRuleSkipReasons:
      type: object
      description: >
        Why matched occurrences will not be written, by reason. Omitted
        entirely when nothing is skipped — never sent as an empty object.
      properties:
        already_exists:
          type: integer
          description: >
            Occurrences whose `(from, to)` the product option already has.
            `createAvailability` has no unique index behind it, so these
            would otherwise be written a second time on every re-run.

    Availability:
      type: object
      description: |
        Mirrors `AvailabilityResource::toArray()`. A single bookable
        timeslot for one product option. The `bookable` relation on the
        underlying model is polymorphic; this CLI view exposes only
        ProductOption-backed rows via `product_option_id` (Resource-backed
        availabilities are out of scope).

        `starts_at` / `ends_at` carry the full timezoned datetime (mapped
        from the model's `from` / `to` columns) — the spec previously
        listed a `start_time` "09:30"-style field that the resource has
        never emitted.

        The offset on those two is the **product's**, not UTC: the `from` /
        `to` columns store product-local wall clock, so a 10:00 departure
        for a `Europe/London` product is `2026-08-04T10:00:00+01:00`. The
        remaining timestamps on this object are real UTC instants. Rows
        with no product option behind them fall back to `+00:00`.

        `status` is a coarse two-state projection of `is_open_for_booking`
        — `available` when the operator has the slot open, `blocked` when
        closed. `sold_out` / `cancelled` are not surfaced here; saturation
        is observable via `capacity_remaining = 0` and cancellation via
        `deleted_at`. `is_bookable` separately tracks the slot's
        bulk-close state so operators can audit closures the
        `bulk-update booking_status` action makes.
      properties:
        id: { type: string }
        product_option_id:
          type: [string, "null"]
          description: "Null when the underlying availability is attached to a non-ProductOption bookable (e.g. a Resource)."
        date: { type: [string, "null"], format: date, description: "Local-date portion of `starts_at`." }
        starts_at: { type: [string, "null"], format: date-time, description: "ISO 8601 datetime in the product's timezone; maps to the model's `from` column." }
        ends_at: { type: [string, "null"], format: date-time, description: "ISO 8601 datetime in the product's timezone; maps to the model's `to` column." }
        capacity: { type: [integer, "null"] }
        capacity_remaining: { type: [integer, "null"], description: "Maps to the model's `vacancies` column." }
        status:
          type: [string, "null"]
          enum: [available, blocked, null]
          description: "`available` when `is_open_for_booking` is true, `blocked` when false."
        is_bookable:
          type: [boolean, "null"]
          description: "Independently tracks bulk-close state; `false` after a `bulk-update booking_status` close."
        pricing_tiers:
          type: [array, "null"]
          description: |
            Embedded pricing tiers for this availability, in compact
            shape with effective amount overlaid. Only present when
            the request passes `include_pricing=true`. Empty array when
            the availability has no product context (e.g. Resource
            availabilities). Sorted by `pricing_category_id`, then
            `min` ascending.
          items: { $ref: "#/components/schemas/EmbeddedPricingTier" }
        deleted_at: { type: [string, "null"], format: date-time, description: "Set when soft-deleted; null otherwise." }
        created_at: { type: [string, "null"], format: date-time }
        updated_at: { type: [string, "null"], format: date-time }

    PricingCategory:
      type: object
      description: |
        Parent bucket that one or more `PricingTier` rows live under. Carries
        the named label (`Adults`, `Children`, ...) — translatable, returned
        in English. Soft-deleted rows cascade-delete their pricing tiers.

        The `pricing_categories` table carries no timestamp columns, so
        `created_at` / `updated_at` are always null and
        `GET /pricing-categories?since=` is refused with 422.
      properties:
        id: { type: string }
        product_id: { type: [string, "null"] }
        name: { type: [string, "null"], description: "Translatable; English value returned." }
        type:
          type: [string, "null"]
          enum: [ADULT, CHILD, INFANT, YOUTH, STUDENT, SENIOR, TRAVELLER, EU_CITIZEN, MILITARY, EU_CITIZEN_STUDENT, null]
        min_age: { type: [integer, "null"] }
        max_age: { type: [integer, "null"] }
        is_internal: { type: [boolean, "null"], description: "Internal categories are excluded from public-facing checkout flows." }
        deleted_at: { type: [string, "null"], format: date-time }
        created_at: { type: [string, "null"], format: date-time, description: "Always null — no such column on `pricing_categories`." }
        updated_at: { type: [string, "null"], format: date-time, description: "Always null — no such column on `pricing_categories`." }

    PricingTier:
      type: object
      description: |
        Mirrors `PricingTierResource::toArray()`. The `pricing_tiers` table
        has no `product_option_id` or `name` column — those belong to the
        parent `PricingCategory` (carries `name` + `product_id`). Tiers
        describe a headcount band (`min`/`max`) and a `fare` (surfaced as
        `amount`). Currency is tenant-level and not stored per row; it is
        the tenant's currency, with no default. The table carries no timestamp columns, so
        `created_at` / `updated_at` are always null and
        `GET /pricing-tiers?since=` is refused with 422.

        **Availability scoping.** When the request supplies
        `availability_id` (either as a query filter on `/pricing-tiers` or
        nested under `/availabilities` via `include_pricing=true`), the
        per-slot pivot fare from `availability_pricing_tier` is overlaid
        onto `amount`. In that case the response also carries
        `default_amount` (the catalogue price) and `is_override` (whether
        a pivot row exists). Without availability scoping those two fields
        are omitted and `amount` is the catalogue price.
      properties:
        id: { type: string }
        pricing_category_id: { type: [string, "null"], description: "Parent `PricingCategory` row (carries the named bucket like `Adults`/`Children`)." }
        min: { type: [integer, "null"], description: "Inclusive lower bound of the headcount band the tier applies to." }
        max: { type: [integer, "null"], description: "Inclusive upper bound; null = open-ended." }
        amount:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Money"
          description: "Effective price. Maps to `pricing_tiers.fare` by default; when availability-scoped, overlays the `availability_pricing_tier.fare` pivot value if a row exists."
        default_amount:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Money"
          description: "Catalogue price (`pricing_tiers.fare`). Only present when availability-scoped — compare against `amount` to detect overrides."
        is_override:
          type: boolean
          description: |
            True iff an `availability_pricing_tier` pivot row exists for the
            scoping availability. Only present when availability-scoped.

            Writing the catalogue price does NOT clear this — the row survives
            and the slot stays pinned to a number that will not follow the next
            catalogue reprice. To clear it, send `amount: null` for that tier
            via `PATCH /availabilities/{id}` (one slot) or
            `POST /availabilities/bulk-update` with `setting=pricing` (a date
            range).
        currency: { type: [string, "null"], description: "The tenant's currency. Null only when no tenant is bound; there is no default." }
        deleted_at: { type: [string, "null"], format: date-time, description: "Set when soft-deleted; null otherwise" }
        created_at: { type: [string, "null"], format: date-time, description: "Always null — no such column on `pricing_tiers`." }
        updated_at: { type: [string, "null"], format: date-time, description: "Always null — no such column on `pricing_tiers`." }

    EmbeddedPricingTier:
      type: object
      description: |
        Compact pricing tier shape embedded inside an availability when
        `include_pricing=true`. Same overlay semantics as a
        availability-scoped `PricingTier` — `amount` is effective,
        `default_amount` and `is_override` are always present — but the
        `deleted_at` / `created_at` / `updated_at` timestamps are dropped
        to keep the payload tight. Soft-deleted tiers are excluded.
      properties:
        id: { type: string }
        pricing_category_id: { type: [string, "null"] }
        min: { type: [integer, "null"] }
        max: { type: [integer, "null"] }
        amount:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Money"
        default_amount:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Money"
        is_override: { type: boolean }
        currency: { type: [string, "null"], description: "The tenant's currency — same source as PricingTier.currency." }

    Discount:
      type: object
      description: |
        `Bmbltd\LaravelBookings\Models\Discount`. Soft-deletable (no
        explicit status enum — soft-delete IS the cancellation). The
        `discounted_price` column is set for fixed-amount discounts;
        `discount_pct` is set for percentage discounts (the two are
        mutually exclusive). Scope is determined by `product_option_id`:
        null = global, set = scoped to that single product option.
      properties:
        id: { type: string, description: "integer ID" }
        code: { type: string, description: "Promo code (uppercase by convention)" }
        product_option_id:
          type: [string, "null"]
          description: When null, discount applies globally; when set, scoped to one product option
        discounted_price:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Money"
          description: Fixed-amount discount in tenant currency minor units. Mutually exclusive with `discount_pct`.
        discount_pct:
          type: [number, "null"]
          format: float
          minimum: 0
          maximum: 100
          description: Percentage discount (0-100). Mutually exclusive with `discounted_price`.
        nb_offers:
          type: [integer, "null"]
          description: |
            Maximum redemptions, per CB convention (`Discount::scopeValid`):
            - `> 0` — positive limit, enforced via row-locked count check on apply
            - `-1` — explicit "unlimited"
            - `0` — exhausted (apply returns 409 DISCOUNT_NOT_APPLICABLE)
            - `null` — legacy unlimited (rows pre-feature)
        start_date: { type: [string, "null"], format: date-time, description: "Promotional period start (advertising window)" }
        end_date: { type: [string, "null"], format: date-time, description: "Promotional period end" }
        validity_start: { type: string, format: date-time, description: "Booking validity window start (when bookings using this discount must occur)" }
        validity_end: { type: [string, "null"], format: date-time, description: "Booking validity window end" }
        auto_apply: { type: boolean, description: "If true, eligible bookings get this discount automatically without entering the code" }
        discount_text: { type: [string, "null"], description: "Translatable customer-facing text (English value returned)" }
        discount_image: { type: [string, "null"], description: "Asset path/URL" }
        groupon_import_id: { type: [string, "null"] }
        deleted_at: { type: [string, "null"], format: date-time, description: "Set when soft-deleted; null otherwise. Soft-deletion IS cancellation for discounts." }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    AvailableGiftCertificate:
      type: object
      description: |
        Sellable gift-cert SKU (the offering). Mirrors
        `AvailableGiftCertificateResource::toArray()`. `currency` has no
        underlying column on `available_gift_certificates`; it serializes the
        tenant's currency, which is what the `amounts` are denominated in.
        `expiration_period_months`
        sources the `expiration_period` column, which the model accessor
        `expiryDurationInMonths` treats as MONTHS via
        `CarbonInterval::make($value, 'months')`. A value of -1 means
        "never expires". `cover_image_url` is sourced from the Paperclip
        `cover` attachment (read-only — uploads not yet supported via CLI).
      properties:
        id: { type: string }
        name: { type: [string, "null"] }
        amounts:
          type: array
          description: Available denominations (minor units)
          items: { $ref: "#/components/schemas/Money" }
        currency: { type: [string, "null"], description: "The tenant's currency — no column on the table; `amounts` are denominated in it. Null only when no tenant is bound; there is no default." }
        expiration_period_months: { type: [integer, "null"], description: "Sources the `expiration_period` column (months). -1 means never expires." }
        cover_image_url: { type: [string, "null"], format: uri, description: "URL of the Paperclip `cover` attachment when uploaded; null otherwise. Read-only via the CLI." }
        created_at: { type: [string, "null"], format: date-time }
        updated_at: { type: [string, "null"], format: date-time }

    GiftCertificate:
      type: object
      description: |
        Issued gift-cert instance (a real cert in a customer's hands). Mirrors
        `GiftCertificateResource::toArray()`. `recipient_email` is the
        underlying `recipient` column; `recipient_name` is the `to` column.
        `currency` is sourced from `tenant()->currency` (no per-row column,
        and no default to fall back to). `available_gift_certificate_id` references
        the `available_gift_certificate_uuid` column.
      properties:
        id: { type: string }
        available_gift_certificate_id: { type: [string, "null"] }
        code: { type: [string, "null"] }
        recipient_email: { type: [string, "null"], description: "Read-only — not validated as RFC-5322. Some legacy/imported rows carry malformed emails." }
        recipient_name: { type: [string, "null"] }
        amount:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Money"
        remaining_amount:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Money"
        currency: { type: [string, "null"], description: "The tenant's currency. Null only when no tenant is bound; there is no default." }
        valid_from: { type: [string, "null"], format: date-time }
        expires_at: { type: [string, "null"], format: date-time }
        status:
          type: string
          enum: [active, redeemed, partial, void, expired]
        issued_at: { type: [string, "null"], format: date-time }
        deleted_at:
          type: [string, "null"]
          format: date-time
          description: Set when the cert is voided (status maps to `void`).
        void_reason:
          type: [string, "null"]
          description: |
            Operator-supplied reason captured on `POST /gift-certs/issued/{id}/void`.
            Null on certs that have not been voided.

    Customer:
      type: object
      description: |
        First-class `Bmbltd\LaravelBookings\Models\Customer` (vendor-package
        model used by the bookings engine). Soft-deletable, business-unit-scoped,
        carries Spatie schemaless `extra_attributes`. Aggregates (bookings_count,
        total_spent) are not surfaced in V1 — query `/bookings` and `/transactions`
        directly for those.
      properties:
        id: { type: string, description: "UUID" }
        name: { type: string }
        email: { type: [string, "null"], description: "Read-only — not validated as RFC-5322. Some legacy/imported rows carry malformed emails." }
        phone: { type: [string, "null"] }
        zip_code: { type: [string, "null"] }
        country: { type: [string, "null"], description: "ISO 3166-1 alpha-2" }
        notes: { type: [string, "null"], description: "Free-form internal notes" }
        locales:
          type: array
          items: { type: string, description: "ISO 639-1 code (e.g. 'en', 'el')" }
          description: |
            Customer's preferred locales in priority order.
            `Customer::preferredLocale()` returns `locales->first()` (defaulting
            to 'en' if empty).
        secondary_email: { type: [string, "null"], description: "Secondary contact email; receives notifications alongside `email`. Read-only — not validated as RFC-5322." }
        stripe_id: { type: [string, "null"], description: "Stripe customer ID; nullable if never charged" }
        extra_attributes:
          type: object
          additionalProperties: true
          description: Schemaless attributes (Spatie `SchemalessAttributes` cast)
        deleted_at: { type: [string, "null"], format: date-time, description: "Set when soft-deleted; null otherwise" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Booking:
      type: object
      properties:
        id: { type: string }
        reference:
          type: [string, "null"]
          description: |
            Sourced from `bookings.reseller_reference` — there's no plain
            `reference` column on bookings. Populated for reseller-imported
            bookings, null for direct ones. Filter `?reference=` matches it.
        booking_status:
          type: string
          enum: [ON_HOLD, CONFIRMED, EXPIRED, CANCELLED]
          description: |
            Computed accessor (`getBookingStatusAttribute()` on the Booking model).
            Mapping:
            - `expires_at` in future → `ON_HOLD`
            - `expires_at` in past → `EXPIRED`
            - `cancelled_at` in past OR `deleted_at` set → `CANCELLED`
            - All-nulls / `confirmed_at` set → `CONFIRMED` (default branch)
            Filter `?booking_status=` translates to a 4-way SQL condition on the
            underlying timestamps.
        product_option_id: { type: string }
        availability_id: { type: string }
        customer:
          type: [object, "null"]
          description: |
            Null when the booking has no linked Customer, OR when the caller
            lacks the `view_booker_of_booking` permission. The key is always
            present; only the value is withheld.
          properties:
            id: { type: string }
            name: { type: string }
            email: { type: [string, "null"], description: "Read-only — not validated as RFC-5322. Sourced from the linked Customer; legacy/imported rows (channel imports, manual walk-ins) commonly have no email and serialize as null. Generated clients must not assume RFC-5322 conformance." }
            phone: { type: [string, "null"] }
        guests:
          type: array
          items: { $ref: "#/components/schemas/Guest" }
        transactions:
          type: array
          description: |
            Empty for a caller without the `see_money_of_booking` permission —
            an amount, currency or payment method must not leak through a
            partially-redacted row.
          items: { $ref: "#/components/schemas/Transaction" }
        answers:
          # `type: [array, 'null']`, not `nullable: true`. This document is
          # OpenAPI 3.1, where `nullable` was removed from the specification
          # and is silently ignored — a generator would emit a non-nullable
          # array while this endpoint really can return null, and the client
          # would break on the first permission-denied read. The rest of the
          # file still uses the 3.0 `nullable` idiom; that is a pre-existing
          # inconsistency worth sweeping separately, not a reason to add
          # another instance of it on a field that genuinely returns null.
          type: [array, 'null']
          description: |
            The customer's answers to the operator's custom booking questions.
            Present on `GET /bookings/{id}` only — deliberately absent from
            `GET /bookings`, because answers routinely carry passport numbers,
            dates of birth and dietary/medical notes and a paginated list
            carrying them would be a bulk PII export. Ordered by `question_id`,
            then by `answerable_type` / `answerable_id` / `id` so repeated
            reads of the same booking are byte-stable.

            Requires the `view_answers_of_booking` permission, which is
            separate from the rest of the read tier precisely because this is
            guest PII rather than inventory data. Distinguish the two empty
            cases:

            - `[]` — you may see answers; this booking has none.
            - `null` — you may NOT see answers. The server does not even read
              them from the database in this case.
          items: { $ref: "#/components/schemas/Answer" }
        total_amount:
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
          description: |
            Sourced from `bookings.gross_price` (booking-level total).
            Null for a caller without the `see_money_of_booking` permission.
        paid_amount:
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
          description: |
            Sum of charge `BookingTransaction.amount` (rows with
            `refund_for IS NULL`). Computed at serialization time from
            eager-loaded transactions.
            Null for a caller without the `see_money_of_booking` permission.
        refunded_amount:
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
          description: |
            Absolute sum of refund `BookingTransaction.amount` (rows with
            `refund_for IS NOT NULL`). Refunds are stored negative; the
            response value is positive.
            Null for a caller without the `see_money_of_booking` permission.
        discount_total:
          $ref: "#/components/schemas/Money"
          description: |
            Computed from the booking's `BookingDiscount` pivot rows.
            Sum of all applied discounts. Updated whenever a discount is
            applied or detached.
        applied_discount_ids:
          type: array
          items: { type: string }
          description: |
            IDs of discounts attached to this booking via `BookingDiscount`
            pivot rows (with `applied_at` timestamps). Updated by
            `POST /discounts/{id}/apply`.
        currency: { type: [string, "null"], description: "The first transaction's currency (a real column). Falls back to the tenant's currency when the booking has no transaction yet; null only when no tenant is bound." }
        starts_at:
          type: string
          format: date-time
          description: |
            Trip start, read from the linked availability's `from` column and
            emitted with the **product's** UTC offset — not UTC. A 10:00
            departure for a `Europe/London` product is
            `2026-08-04T10:00:00+01:00`. The booking's own timestamps below
            (`confirmed_at`, `cancelled_at`, `created_at`, …) are real UTC.
        ends_at:
          type: [string, "null"]
          format: date-time
          description: "Trip end, in the product's timezone. See `starts_at`."
        held_until: { type: [string, "null"], format: date-time }
        confirmed_at:
          type: [string, "null"]
          format: date-time
          description: Set when the booking transitions to confirmed; null on held/expired/cancelled rows.
        expires_at:
          type: [string, "null"]
          format: date-time
          description: Set on held bookings; null on confirmed bookings. Past `expires_at` + null `confirmed_at` = expired.
        cancelled_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        deleted_at: { type: [string, "null"], format: date-time }
        attribution:
          type: [object, "null"]
          description: |
            Campaign attribution captured at checkout (`utm_*`).

            DISTINCT from the booking's origin: origin says which SURFACE
            created the booking, this says which campaign brought the customer
            to it. A widget booking that came from a paid ad has a `google` /
            `cpc` last touch.

            Two touches, never one — `first_touch` is the campaign that
            ACQUIRED the customer and is written once, `last_touch` is the
            campaign that closed THIS booking and is overwritten on each later
            visit. Collapsing them into a single "the" campaign picks a side of
            the attribution argument, so the wire shape does not.

            Keys are the stored short names, not the `utm_`-prefixed query
            names they arrive as: `source`, `medium`, `campaign`, `term`,
            `content`, `id`. Any subset may be present — a link carrying only
            `utm_source` yields a touch with only `source`.

            `null` (not an empty object) when the tenant does not have the
            customer-event spine, mirroring the operator back office, where
            attribution is a CRM v2 section. Both touches are null for a
            booking that carried no campaign.
          properties:
            first_touch:
              type: [object, "null"]
              additionalProperties: { type: string }
              example: { source: google, medium: cpc, campaign: spring-sale }
            last_touch:
              type: [object, "null"]
              additionalProperties: { type: string }
              example: { source: captainbook, medium: assistant }
        resources:
          type: array
          description: |
            Present on booking show and on booking list only when
            `include=resources` is requested.
          items: { $ref: "#/components/schemas/AssignedBookingResource" }
        resource_state_token:
          type: [string, "null"]
          description: |
            Aggregate booking resource state token used for stale-state guarded
            booking resource mutations. Present wherever `resources` are included.

    AssignedBookingResource:
      type: object
      properties:
        id: { type: string }
        name: { type: [string, "null"] }
        type: { type: [string, "null"] }
        capacity: { type: [integer, "null"] }
        category: { type: [string, "null"] }
        source: { type: [string, "null"], description: "Pivot source on the booking_resource row when assigned." }
        user:
          type: [object, "null"]
          properties:
            id: { type: integer }
            name: { type: [string, "null"] }

    Transaction:
      type: object
      properties:
        id: { type: string }
        booking_id: { type: string }
        type:
          type: string
          enum: [charge, refund]
          description: |
            Derived from CB's `BookingTransaction.refund_for` column: rows
            with `refund_for IS NULL` are charges; rows with `refund_for`
            pointing at the parent charge id are refunds. Refund rows have
            negative `amount` (e.g. `-5000` for a 5,000 minor-units refund).
        status:
          type: string
          enum: [succeeded]
          description: |
            Always `succeeded` — CB's `booking_transactions` table has no
            status column, so a row's existence implies the payment / refund
            landed. Failed payments don't produce a row at all.
        amount: { $ref: "#/components/schemas/Money" }
        currency: { type: [string, "null"], description: "The row's own currency column. Falls back to the tenant's currency on a legacy row that carries none; null only when no tenant is bound." }
        stripe_charge_id:
          type: [string, "null"]
          description: Stripe payment_intent id (charges only — null on refund rows).
        stripe_refund_id:
          type: [string, "null"]
          description: Stripe refund id (refunds only — null on charge rows).
        refund_for:
          type: [string, "null"]
          description: |
            For refund rows, the id of the parent charge transaction this
            refund settles. Null on charges.
        method:
          type: [string, "null"]
          enum: [card, cash, paypal, gift, voucher, transfer, null]
        created_at: { type: string, format: date-time }

    Guest:
      type: object
      description: |
        Mirrors `GuestResource::toArray()`. The `guests` table carries no
        timestamp columns, so `created_at` / `updated_at` are always null and
        `GET /guests?since=` is refused with 422.
      properties:
        id: { type: string }
        booking_id: { type: string }
        name: { type: string }
        email: { type: [string, "null"], description: "Read-only — not validated as RFC-5322. Sourced from the linked Customer; legacy/imported rows can carry malformed emails." }
        phone: { type: [string, "null"] }
        passport: { type: [string, "null"] }
        dob: { type: [string, "null"], format: date }
        dietary: { type: [string, "null"] }
        custom_attributes:
          type: object
          additionalProperties: true
        created_at: { type: [string, "null"], format: date-time, description: "Always null — no such column on `guests`." }
        updated_at: { type: [string, "null"], format: date-time, description: "Always null — no such column on `guests`." }

    Extra:
      type: object
      description: |
        Mirrors `ExtraResource::toArray()`. The underlying `extras` table uses
        `title` (translatable) and `fare`; the wire shape exposes them as
        `name` and `amount`. The `extras` table has no `currency` column —
        `currency` is the tenant's currency (`tenant()->currency`) — there is
        no per-row column and no default to fall back to.
        `max_quantity` is derived from the `maximum` discriminator and
        `maximum_bookable` columns: `maximum=custom` → real cap;
        `maximum=no_max` / `max_by_participant` → null in the wire response.
        Extras link to `Product` via the morphTo `product` columns
        (`product_id` + `product_type`).
      properties:
        id: { type: string }
        product_id: { type: [string, "null"], description: "Sourced from the morph `product_id` column when `product_type=Product`." }
        name: { type: [string, "null"], description: "English translation of the `title` column." }
        description: { type: [string, "null"] }
        amount:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Money"
          description: "Maps to the `fare` column."
        currency: { type: [string, "null"], description: "The tenant's currency. Null only when no tenant is bound; there is no default." }
        max_quantity: { type: [integer, "null"] }
        deleted_at: { type: [string, "null"], format: date-time, description: "Set when soft-deleted; null otherwise" }
        created_at: { type: [string, "null"], format: date-time }
        updated_at: { type: [string, "null"], format: date-time }

    Answer:
      type: object
      description: |
        Mirrors `AnswerResource::toArray()`. One customer response to one
        custom booking `Question`. Returned inline on `GET /bookings/{id}`.

        `granularity` and `answerable_type` answer different questions and can
        legitimately disagree. `granularity` (copied from the Question) says
        what the operator asked about; `answerable_type` says which row the
        answer physically hangs off, for joining. Booking-granularity answers
        are persisted against the *booker* — `granularity: booking` pairs with
        `answerable_type: customer`, never `booking`.
      properties:
        id: { type: string }
        question_id: { type: [string, "null"] }
        label: { type: [string, "null"], description: "The question text, denormalised from the linked Question so the answer is readable without a second call. Null if the question row is unavailable." }
        type:
          type: [string, "null"]
          enum: [short_text, long_text, number, decimal_number, boolean, date, datetime, time, list, country, location_list, name, email, phone, birthdate, null]
          description: |
            The linked Question's `answer_type`. Needed to interpret `answer`:
            `boolean` answers serialize as the string `"1"` / `"0"`, and
            `country` answers as an ISO-3166 alpha-3 code, not a display name.
        granularity:
          type: [string, "null"]
          enum: [booking, guest, extra, null]
          description: "Copied from the linked Question. See `Question.granularity`."
        answerable_type:
          type: [string, "null"]
          enum: [customer, guest, extra, null]
          description: |
            Snake-cased basename of the `answerable` morph target — the row
            this answer hangs off. `customer` for booking-granularity answers
            (the booker), `guest` for per-guest, `extra` for per-extra. An
            unrecognised morph target degrades to its snake-cased basename
            rather than null, so the enum is indicative rather than closed.
        answerable_id:
          type: [string, "null"]
          description: |
            Id of the `answerable_type` row. Join against the booking's inline
            `guests[].id` for guest-granularity answers, or `customer.id` for
            booking-granularity ones.

            The join is NOT guaranteed to resolve. `answers` is constrained on
            `booking_id` only — the polymorphic `answerable` pair has no
            foreign key — and rescheduling a booking replicates answers without
            remapping guest ids, so a guest-granularity answer on a rescheduled
            booking can still point at the original booking's (now gone) guest.
            The answer text is still correct and attributable to the booking;
            only the per-guest attribution is lost. Treat an unresolved
            `answerable_id` as "unknown guest", not as an error.
        answer:
          type: string
          description: |
            The answer flattened to a single display string. Always a string;
            empty when the stored value is null. Extra-granularity answers
            store one entry per purchased unit and flatten to a comma-joined
            list here — use `answer_raw` to recover the per-unit structure.

            Close to, but deliberately NOT identical to, how
            `GetAnswersAction::normaliseAnswerToString` renders the same answer
            for workflows and manifests. Two values differ, both in this
            surface's favour: boolean `false` is `"0"` here and `""` there
            (that method casts with `(string)`, and `(string)false` is the
            empty string), and a nested array without an `answer` key is
            flattened recursively here but stringifies to the literal `"Array"`
            there. Do not assume the two surfaces agree byte-for-byte.
        answer_raw:
          oneOf:
            - type: string
            - type: array
              items: {}
            - type: boolean
            - type: number
            - type: 'null'
          description: |
            The stored answer decoded verbatim from its JSON column, with no
            flattening. Usually a string; an array of `{quantity, answer}`
            objects for extra-granularity answers. The column accepts any JSON
            value, hence the open union — spelled out rather than left as a
            bare `nullable` so generators produce a usable type. (This document
            is OpenAPI 3.1, where `nullable` is not a keyword at all; null is
            expressed as a member of the union.)
        created_at: { type: [string, "null"], format: date-time }
        updated_at: { type: [string, "null"], format: date-time }

    Question:
      type: object
      description: |
        Mirrors `QuestionResource::toArray()`. Underlying columns:
        `question` → `label`, `answer_type` → `type`, `is_required` →
        `required`. Questions are polymorphic (morphTo `questionable`); the
        wire shape exposes only the `ProductOption` case via
        `product_option_id` (sourced from `questionable_id`).
        The `questions` table has no `created_at` / `updated_at` columns at
        all (the model declares `public $timestamps = false`), so both fields
        are always null and `GET /questions?since=` is refused with 422.
        `type` returns the raw `answer_type` enum value (broader than the
        input enum).
      properties:
        id: { type: string }
        product_option_id: { type: [string, "null"], description: "Sourced from `questionable_id` when `questionable_type=ProductOption`; null otherwise." }
        label: { type: [string, "null"], description: "Sourced from the `question` column." }
        type:
          type: [string, "null"]
          enum: [short_text, long_text, number, decimal_number, boolean, date, datetime, time, list, country, location_list, name, email, phone, birthdate, null]
          description: "Raw `answer_type` enum value. The write API accepts a narrower input enum (text/textarea/select/date/number/boolean) which the controller maps onto these values."
        granularity:
          type: [string, "null"]
          enum: [booking, guest, extra, null]
          description: |
            Whether the question is asked once per booking, once per guest, or
            once per purchased extra. Determines how many `Answer` rows a
            booking carries for this question, and which morph target those
            answers hang off — see `Answer.answerable_type`.

            **Read-only on this API.** Neither `CreateQuestionRequest` nor
            `UpdateQuestionRequest` accepts a `granularity` field, and
            `QuestionController::store()` hardcodes `booking` on the row it
            writes — so every question created here is booking-granularity,
            and deleting and recreating one does not change that. Guest- and
            extra-granularity questions exist (they are created in the
            operator UI and by the importers) and are returned here verbatim;
            there is simply no API path that produces or edits one.
        required: { type: boolean }
        options:
          type: array
          items: { type: string }
          description: For type=select / list
        deleted_at: { type: [string, "null"], format: date-time, description: "Set when soft-deleted; null otherwise" }
        created_at: { type: [string, "null"], format: date-time, description: "Always null — `Question` model has `$timestamps = false`." }
        updated_at: { type: [string, "null"], format: date-time, description: "Always null — `Question` model has `$timestamps = false`." }

    DepartureSpanNotes:
      type: object
      description: |
        Non-blocking facts about a change that is going ahead, the opposite
        of `skip_reasons`. ABSENT when there is nothing to say — a note on
        every ordinary create costs exactly the attention the unusual one
        needs.
      properties:
        notes:
          type: object
          properties:
            departure_spans_days:
              type: integer
              minimum: 1
              description: |
                Whole days this ONE departure runs, emitted only above 0. A
                multi-day departure is legitimate and is also what a caller
                writes when it meant a range, and nothing in the payload can
                tell the two apart — so it is stated rather than refused. The
                operator assistant renders this on the confirmation card.

    CreateAvailabilityRequest:
      type: object
      required: [product_option_id, date, start_time, end_time, capacity]
      description: |
        `date`, `start_time` and `end_time` are the PRODUCT'S LOCAL wall
        clock and are stored verbatim — see the endpoint description. Do not
        send an offset or a UTC-converted time.
      properties:
        product_option_id: { $ref: "#/components/schemas/PositiveIntegerId" }
        date: { type: string, format: date, description: "Departure date, YYYY-MM-DD, product-local." }
        day_count:
          type: integer
          minimum: 0
          maximum: 365
          default: 0
          description: |
            Whole days from `date` to the day this ONE departure ends on. `0`
            for an ordinary same-day session, `1` for an overnight, `9` for a
            nine-day expedition. This does NOT create one departure per day —
            use `POST /availability-rules` for that. Mutually exclusive with
            `end_date`. A JSON boolean is a 422, not `1`, here and on
            `PATCH /availabilities/{id}`.
        end_date:
          type: string
          format: date
          description: |
            DEPRECATED spelling of `day_count`. Date this ONE departure ENDS
            on; defaults to `date`, must not be earlier than it, and must not
            be more than ONE day after it — a longer span is a 422 naming
            `POST /availability-rules` and `day_count`. Mutually exclusive
            with `day_count`.
          deprecated: true
        start_time: { type: string, pattern: "^[0-9]{2}:[0-9]{2}$", example: "09:00" }
        end_time: { type: string, pattern: "^[0-9]{2}:[0-9]{2}$", example: "17:00" }
        capacity:
          type: integer
          minimum: 0
          description: |
            Seats on this departure. 0 is legitimate — a departure can be
            published and closed; `is_bookable` decides whether it sells.
        is_bookable: { type: boolean, default: true }
        dry_run: { type: boolean, default: false }

    UpdateAvailabilityRequest:
      type: object
      properties:
        capacity: { type: integer, minimum: 0 }
        status:
          type: string
          # `cancelled` is NOT accepted — `UpdateAvailabilityRequest` validates
          # `in:available,blocked` and the controller maps the value onto the
          # boolean `is_open_for_booking`. The third member was documented but
          # never implemented; sending it is a 422.
          enum: [available, blocked]
        is_bookable: { type: boolean }
        start_time:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          description: |
            New departure time, product-local wall clock `HH:MM`. Sent alone it
            shifts the slot and preserves its current duration.
          example: "09:30"
        end_time:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          description: |
            New end time, product-local wall clock `HH:MM`. Omitted, the
            duration is preserved.
          example: "11:30"
        day_count:
          type: integer
          minimum: 0
          maximum: 365
          description: |
            Whole days from the departure's own date to the date it ends on.
            `0` for an ordinary same-day session, `1` for an overnight.
            Requires `end_time`. Omitted, the slot keeps the span it has.
        fares:
          type: array
          minItems: 1
          description: |
            Per-slot pricing overrides for THIS availability only. Tiers not
            listed are left alone. `amount: null` deletes the override row so
            the slot follows the catalogue price again. An empty array is a
            422, not a no-op — send no `fares` key at all to leave pricing
            untouched.
          items:
            $ref: "#/components/schemas/AvailabilityFare"
        dry_run: { type: boolean, default: false }

    AvailabilityFare:
      type: object
      required: [pricing_tier_id, amount]
      description: |
        One fare instruction for an `availability_pricing_tier` row. `amount`
        is required to be PRESENT but may be null: null means "delete the
        override", so a client that forgets to serialise an amount gets a 422
        instead of silently wiping the operator's price. The tier must belong
        to the product that owns the target availability's ProductOption —
        a tier from another product's ladder is a 422, not a silent write.
      properties:
        pricing_tier_id: { type: string }
        amount:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Money"
          description: "Fare in minor units, or null to remove the override."

    AvailabilityFarePreview:
      type: object
      description: |
        One matched slot inside a `setting=pricing` dry-run diff. `amount` is
        the EFFECTIVE price — the override when one exists, the catalogue fare
        otherwise — so the `after` side of a removal shows the catalogue price
        the slot falls back to rather than null. `changed` appears on the
        `after` side only.
      properties:
        id: { type: string }
        date: { type: string, format: date }
        starts_at: { type: string, format: date-time }
        fares:
          type: array
          items:
            type: object
            properties:
              pricing_tier_id: { type: string }
              amount: { type: [integer, "null"] }
              is_override: { type: boolean }
        changed: { type: boolean }

    BulkDeleteAvailabilityRequest:
      type: object
      required: [product_option_id, from, to]
      description: |
        Filter shape mirrors `BulkUpdateAvailabilityRequest` so a CLI flow
        that previewed a date-range change can reuse the same payload to
        delete instead. Range is half-open: rows where `from >= from AND
        from < to` are matched.
      properties:
        product_option_id: { $ref: "#/components/schemas/PositiveIntegerId" }
        from: { type: string, format: date }
        to: { type: string, format: date }
        dry_run: { type: boolean, default: false }

    CreateAvailabilityRuleRequest:
      type: object
      required: [product_option_id, start_date, end_date, weekdays]
      description: |
        Mirrors `CreateAvailabilityRuleRequest::rules()`. A departure time is
        required for `datetime` products — either the scalar `start_time` /
        `end_time` pair or `times[]`, never both — and ignored for `date`-only
        products. Weekday values use PHP's `format('w')` convention —
        Sunday=0, Saturday=6.
      properties:
        product_option_id: { $ref: "#/components/schemas/PositiveIntegerId" }
        start_date: { type: string, format: date, example: "2026-05-01" }
        end_date: { type: string, format: date, example: "2026-08-31" }
        weekdays:
          type: array
          minItems: 1
          items: { type: integer, minimum: 0, maximum: 6 }
          example: [3, 6]
          description: >
            A LIST of whole numbers, Sunday=0 through Saturday=6. An object
            keyed by day name is refused with 422 — it used to be accepted and
            read two different ways by the preview and the job.
        start_time:
          type: [string, "null"]
          example: "14:00"
          description: "`HH:MM`, product-local wall clock. Mutually exclusive with `times`."
        end_time:
          type: [string, "null"]
          example: "18:00"
          description: "`HH:MM`, product-local wall clock. Mutually exclusive with `times`."
        times:
          type: array
          minItems: 1
          maxItems: 24
          items:
            $ref: "#/components/schemas/AvailabilityRuleTime"
          example:
            - { start_time: "11:30", end_time: "14:00" }
            - { start_time: "15:00", end_time: "17:30" }
            - { start_time: "18:30", end_time: "21:00" }
          description: |
            SEVERAL departure times for one rule, one departure each per
            matching day. Mutually exclusive with the scalar `start_time` /
            `end_time` pair — sending both is a 422, because a payload
            carrying two answers is a season that comes out wrong either way.

            Two entries naming the same `(start_time, end_time)` are a 422
            too: the job skips an occurrence whose `(from, to)` already
            exists and checks that at write time, so the second copy would be
            skipped by the first one it just wrote while the preview counted
            both.

            A `date`-only product accepts at most ONE entry. Its departures
            span the whole day, so every entry would widen to the same slot.
        add_days_count:
          type: integer
          minimum: 0
          default: 0
          description: |
            Multi-day events: number of days to add to the `to` timestamp.
            With `times`, this is the DEFAULT for every entry that does not
            carry its own — so three overnight departures need it once.
        capacity:
          type: integer
          minimum: 0
          example: 12
          description: |
            Seats for EVERY departure this rule creates. Omit it and each one
            inherits the product option's own `capacity`, which is what this
            endpoint did unconditionally before `1.27.0`.

            `0` is legitimate and means published but closed — `is_bookable`
            decides whether a departure sells — so do not read this field with
            a truthiness test. The resolved value is echoed on every response
            as `rule.capacity`, sent or not.

            Applies uniformly: there is no per-`times[]` capacity. A rule whose
            departure times need different numbers is several rules, or one
            rule followed by `bulk-update`.
        dry_run: { type: boolean, default: false }

    AvailabilityRuleTime:
      type: object
      required: [start_time, end_time]
      description: One departure time of a recurrence rule.
      properties:
        start_time: { type: string, example: "11:30", description: "`HH:MM`, product-local wall clock." }
        end_time: { type: string, example: "14:00", description: "`HH:MM`, product-local wall clock." }
        add_days_count:
          type: integer
          minimum: 0
          description: "Days this departure spans. Defaults to the rule's top-level `add_days_count`."


    BulkUpdateAvailabilityRequest:
      type: object
      required: [setting, new_value]
      description: |
        Single setting per request — the underlying `BulkAvailabilityUpdateJob`
        only handles one setting at a time. To change multiple settings (e.g.
        capacity AND bookable status), make multiple calls. Server fan-outs
        chunks of ~1000 IDs into `inventory` queue jobs; response returns 202
        with `bulk_update_id`.

        **Two scopes, exactly one of them.** Either `availability_ids`, or
        `product_option_id` + `from` + `to`. Sending both is a 422; sending
        neither is a 422.

        Use `availability_ids` whenever the request has an EXCEPTION in it —
        "close everything that day except the one that is booked" cannot be
        written as a date range at all. It also makes the preview exact:
        `would_update` is the length of the list rather than something
        derived from date arithmetic.
      properties:
        availability_ids:
          type: array
          minItems: 1
          maxItems: 1000
          items: { type: integer, minimum: 1 }
          example: [4821, 4822, 4824]
          description: |
            The exact departures to change. Mutually exclusive with
            `product_option_id` / `from` / `to`.

            An id that does not resolve to a live availability of a product
            option — deleted, mistyped, or belonging to a `Resource` rather
            than a `ProductOption` — is a `422` naming it. It is NOT dropped:
            the whole value of naming ids is that the count is exact, and a
            silently narrowed list is a card the operator approves for
            departures that were never in scope.

            The cap matches the job's chunk size. A list longer than that is
            a date range wearing the wrong shape.
        product_option_id:
          oneOf:
            - $ref: "#/components/schemas/PositiveIntegerId"
            - type: array
              minItems: 1
              items: { type: integer, minimum: 1 }
          description: |
            One product option, or a LIST of them — "close these nine
            options for all of October". A list is refused for
            `setting=pricing`: each product has its own pricing tiers, so
            there is no shared answer to which tier a fare belongs to. (An
            `availability_ids` list spanning more than one option is refused
            for the same reason, and for the same setting.)
        from: { type: string, format: date, description: "Inclusive. Required with `product_option_id`." }
        to:
          type: string
          format: date
          description: |
            EXCLUSIVE, and must be strictly after `from`. One day means `to`
            = the NEXT day. `from == to` is a `422` as of 1.18.0: the range
            is half-open, so it matched nothing and answered a cheerful 200
            with `total_matched: 0`, which reads as a successful change.
        setting:
          type: string
          enum: [booking_status, capacity, pricing, start_time, end_time]
          description: |
            Discriminator for `new_value` shape. Maps to `BulkAvailabilityUpdateJob::$setting`.
        new_value:
          oneOf:
            - title: BookingStatusValue
              type: object
              required: [is_bookable]
              properties:
                is_bookable: { type: boolean }
              description: "When `setting=booking_status`."
            - title: CapacityValue
              type: object
              required: [value, operator]
              properties:
                value: { type: integer, minimum: 0 }
                operator:
                  type: string
                  enum: [set_to, increase_by, decrease_by]
                  description: From `App\Enums\Inventory\CapacityOperator`. `set_to` replaces; `increase_by`/`decrease_by` are deltas.
              description: "When `setting=capacity`."
            - title: PricingValue
              type: object
              required: [fares]
              properties:
                fares:
                  type: array
                  minItems: 1
                  items:
                    $ref: "#/components/schemas/AvailabilityFare"
              description: |
                An empty array is a 422. It used to be accepted, write an audit
                row, queue a job per chunk of matched ids and fire
                `PriceScheduleUpdated` at the channel managers, all for zero
                data change.

                When `setting=pricing`. Replaces existing fares for the listed
                tiers; tiers omitted are left alone (the underlying service
                uses `replaceAll: false`). An `amount` of null DELETES the
                override for that tier across the matched range, so the slots
                follow the catalogue price again.

                Beware the range scope: every session on a matched DATE is
                written, including ones that had no override before. Use
                `PATCH /availabilities/{id}` when a date carries more than one
                session and you only mean to touch one of them.
            - title: TimeValue
              type: object
              required: [start_time, end_time]
              properties:
                start_time: { type: string, example: "09:30" }
                end_time: { type: string, example: "11:30" }
                day_count: { type: integer, default: 0, description: "Days the activity spans (for multi-day tours)" }
              description: "When `setting=start_time` or `setting=end_time`."
        dry_run: { type: boolean, default: false }

    CreateDiscountRequest:
      type: object
      required: [code, validity_start]
      description: |
        Provide exactly one of `discounted_price` (fixed-amount) or
        `discount_pct` (percentage). Server returns 422 if both or neither
        are provided. `product_option_id` null = global discount; otherwise
        scoped to one option.
      properties:
        code: { type: string, maxLength: 100 }
        product_option_id:
          oneOf:
            - $ref: "#/components/schemas/PositiveIntegerId"
            - type: "null"
        discounted_price:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Money"
        discount_pct:
          type: [number, "null"]
          minimum: 0
          maximum: 100
        nb_offers: { type: [integer, "null"] }
        start_date: { type: [string, "null"], format: date-time }
        end_date: { type: [string, "null"], format: date-time }
        validity_start: { type: string, format: date-time }
        validity_end: { type: [string, "null"], format: date-time }
        auto_apply: { type: boolean, default: false }
        discount_text: { type: [string, "null"] }
        discount_image: { type: [string, "null"] }
        dry_run: { type: boolean, default: false }

    IssueGiftCertRequest:
      type: object
      required: [available_gift_certificate_id, recipient_email, recipient_name, amount]
      properties:
        available_gift_certificate_id: { type: string, format: uuid, description: "`available_gift_certificates.id` is a UUID, not an integer id." }
        recipient_email: { type: string, format: email }
        recipient_name: { type: string }
        amount: { $ref: "#/components/schemas/Money" }
        expires_at: { type: [string, "null"], format: date-time }
        send_now:
          type: boolean
          default: false
          description: |
            If true, server emails the redemption code to `recipient_email`
            immediately. Default false to avoid accidental emails when the
            CLI / LLM intends to issue + manually verify before sending. To
            send a previously-issued cert, use `POST /gift-certs/issued/{id}/resend`.
        sender_message: { type: [string, "null"], maxLength: 1000 }
        currency: { type: string, minLength: 3, maxLength: 3, description: "Optional. Not stored — `gift_certificates` has no currency column — but it must equal the account currency (`meta.currency`) or the request is refused with 422." }
        dry_run: { type: boolean, default: false }

    CancelBookingRequest:
      type: object
      required: [reason, refund_policy]
      properties:
        reason: { type: string, maxLength: 500 }
        notify_customer: { type: boolean, default: true }
        refund_policy:
          type: string
          enum: [none, full, partial]
          description: |
            `none`, `full`, `partial` override the product's cancellation
            policy (CS only — operator tokens are 403 on overrides). All
            three are CS-attributed in the audit log.

            `auto` is **not yet supported** in V1: `Product.cancellation_policy`
            is a free-text human description, and there is no machine policy
            engine to derive a refund amount from it. Callers that pass
            `auto` receive `422 POLICY_AUTO_NOT_READY`. `auto` will be
            re-added to this enum once the structured policy engine ships.
        refund_amount:
          $ref: "#/components/schemas/Money"
          description: Required when refund_policy=partial
        dry_run: { type: boolean, default: false }

    RefundBookingRequest:
      type: object
      required: [amount, reason]
      properties:
        amount: { $ref: "#/components/schemas/Money" }
        transaction_id:
          type: [string, "null"]
          format: uuid
          description: Specific charge to refund (otherwise newest succeeded charge). `booking_transactions.id` is a UUID.
        reason: { type: string, maxLength: 500 }
        notify_customer:
          type: boolean
          default: false
          description: |
            Defaults OFF — this is a CS engineering tool, and operators
            debugging refund flows shouldn't silently email customers. Set
            `true` explicitly to dispatch the refund-receipt notification.
        dry_run: { type: boolean, default: false }

    UpdateGuestRequest:
      type: object
      properties:
        name: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
        passport: { type: string }
        dob: { type: string, format: date }
