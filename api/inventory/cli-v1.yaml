  /products/{id}/duplicate:
    post:
      operationId: duplicateProduct
      summary: Duplicate a product and everything under it
      description: |
        Copies a product in ONE call — its options, prices, photos, documents,
        resources, deposit and (opt-in) departures — reusing the same batch the
        web UI runs.

        **Asynchronous.** Returns `202 Accepted`; the copy is built by a queued
        batch and appears shortly after. There is no product id in the response
        because the copy does not exist yet, and no in-band completion signal.

        **Sections.** `include` is a closed set of names —
        `details`, `schedules`, `photos`, `pricing`, `departures`, `locations`,
        `documents`, `resources`, `extras`, `questions`, `deposit`, `faq`.
        Supplying it REPLACES the defaults rather than adding to them; omitting
        it copies `details, schedules, photos, pricing, documents, resources,
        deposit`, mirroring the web UI. `departures` is opt-in because a
        year-round product can carry thousands of slots, and the dry run
        reports the exact count under `counts.departures` before you commit.

        `pricing`, `departures` and `resources` all hang off a ProductOption,
        so asking for any of them IMPLIES `schedules`. The response echoes the
        resolved list in `includes`, so what was implied is visible.

        **The dry run is reproducible.** Title, code and every count are
        derived from the source; nothing is minted per request. Callers that
        preview, show a human, and then commit (the operator assistant does
        exactly this, and compares a hash of the two) can rely on the second
        dry run matching the first.
      tags: [Products]
      parameters:
        - $ref: "#/components/parameters/IdPath"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: [string, "null"], maxLength: 200, description: "Name for the copy. Defaults to \"<title> copy\"." }
                product_code: { type: [string, "null"], maxLength: 50, description: "Code for the copy. Defaults to \"<CODE>-COPY\". Not checked for uniqueness — duplicating twice without one yields two products with the same code, matching the web UI." }
                include:
                  type: array
                  description: "Sections to copy. Replaces the defaults. Omit for details, schedules, photos, pricing, documents, resources, deposit."
                  items:
                    type: string
                    enum: [details, schedules, photos, pricing, departures, locations, documents, resources, extras, questions, deposit, faq]
                dry_run: { type: boolean, default: false }
      responses:
        "200":
          description: Dry-run preview. `counts` reports how much of each requested section exists; `includes` is the resolved section list.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/MutationResult" }
        "202":
          description: Accepted. The copy is queued; `status` is `queued`.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/MutationResult" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/IdempotencyConflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

