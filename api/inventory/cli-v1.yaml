    Segment:
      type: object
      properties:
        id: { type: string, format: uuid }
        business_unit_id: { type: [integer, "null"] }
        name: { type: string }
        description: { type: [string, "null"] }
        type:
          type: string
          enum: [smart, static]
          description: |
            `smart` is a live rule evaluated against `conditions`. `static` is a
            fixed list uploaded as CSV — readable here, not creatable here.
        status:
          type: string
          enum: [draft, backfilling, active, errored, archived]
          description: |
            `backfilling` means the membership recompute has not finished, so
            `members_count` is not yet the answer. A freshly created segment is
            always `backfilling`.
        is_default: { type: boolean }
        conditions:
          type: object
          description: |
            The rule, as `{logic: and|or, filters: [...]}`.

            The filter grammar is deliberately NOT specified here. The legal
            fields are per-tenant (custom attributes are operator-defined, and
            behavioural fields exist only where the customer-event spine is on),
            so a schema published in this file would be wrong for most tenants
            and would drift from the evaluator that actually reads it. Read an
            existing segment to see the shape; the create endpoint validates
            against the live catalogue and names what it rejects.
          properties:
            logic: { type: string, enum: [and, or] }
            filters:
              type: array
              items: { type: object, additionalProperties: true }
        referenced_fields:
          type: [array, "null"]
          items: { type: string }
          description: |
            Derived from `conditions` on write, never supplied. The
            machine-readable answer to "what does this segment look at", which
            is how a caller confirms the tree it sent was understood the way it
            meant.
        members_count:
          type: [integer, "null"]
          description: |
            Present on list. `null` means NOT COUNTED on this endpoint — it does
            not mean zero, and zero is a legitimate answer (a backfilling
            segment, or a rule nobody currently matches).
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    SegmentPage:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/Segment" }

    CreateSegmentRequest:
      type: object
      required: [name, conditions]
      properties:
        name: { type: string, maxLength: 200 }
        description: { type: [string, "null"], maxLength: 1000 }
        conditions:
          type: object
          required: [filters]
          description: |
            At least one filter. An empty filter list matches NOBODY — the
            evaluator and the preview both read it as no-match, deliberately, so
            that opening the builder does not show an operator their whole
            customer base — so an empty tree would create a segment that is
            permanently empty. Refused at the edge instead.
          properties:
            logic:
              type: string
              enum: [and, or]
              default: and
              description: How the top-level filters combine. Defaults to `and`.
            filters:
              type: array
              minItems: 1
              items: { type: object, additionalProperties: true }
        dry_run: { type: boolean }

    SegmentMutationResult:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: object
              properties:
                would_apply:
                  type: boolean
                  description: "`true` on a dry run (nothing written), `false` on a real create."
                after: { $ref: "#/components/schemas/Segment" }
                segment: { $ref: "#/components/schemas/Segment" }

