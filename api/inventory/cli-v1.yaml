        "409": { $ref: "#/components/responses/IdempotencyConflict" }

  /gift-certs/available/{id}:
    get:
      operationId: showAvailableGiftCert
      summary: Show a sellable gift-cert SKU
      tags: [GiftCertificates]
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Available gift cert
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/AvailableGiftCertificate" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

    delete:
      operationId: deleteAvailableGiftCertificate
      summary: Delete a gift-cert SKU
      description: |
        Hard-deletes the AvailableGiftCertificate (the sellable SKU). Returns 409
        if any issued `GiftCertificate` references this SKU — issued certs hold a
        FK to the SKU. Caller must void all issued certs first — which needs a
        `cli:cs` token, not the `cli:write` this endpoint runs on — or accept
        that deleting the SKU will orphan their lookup.
      tags: [GiftCertificates]
      parameters:
        - $ref: "#/components/parameters/IdPath"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204":
          description: Deleted
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            An idempotency conflict — see
            `#/components/responses/IdempotencyConflict`, which enumerates
            `IDEMPOTENCY_CONFLICT`, `IDEMPOTENCY_IN_PROGRESS` (retriable) and
            `IDEMPOTENCY_UNKNOWN` (reconcile by hand) — or `RESOURCE_IN_USE` — issued
            certificates reference this template. The check counts
            soft-deleted ones too, so **voiding them does not clear it** and
            there is no detach endpoint: once a certificate has ever been
            issued against a SKU, that SKU cannot be deleted through this API —
            and `PATCH /gift-certs/available/{id}` has no visibility field, so
            there is no CLI call that retires it either. Treat the refusal as
            terminal rather than retrying a remedy. Match on `error.code`.

            **`dry_run: true` does NOT surface this one.** The preview returns
            before the check runs, so it answers `wouldApply: true` and the
            commit then refuses — the one endpoint where a green preview does
            not mean the commit will succeed. Tracked as captainbook#8490.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    patch:
      operationId: updateAvailableGiftCert
      summary: Update a sellable gift-cert SKU
      tags: [GiftCertificates]
      parameters:
        - $ref: "#/components/parameters/IdPath"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAvailableGiftCertRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/MutationResult" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

