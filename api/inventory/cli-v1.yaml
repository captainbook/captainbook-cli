  /segment-fields:
    get:
      operationId: listSegmentFields
      summary: The fields this tenant can filter a segment on
      description: |
        The vocabulary for composing `conditions`, and the reason it is an
        endpoint rather than a table in this file: the catalogue is per tenant
        AND per business unit. Custom attributes are operator-defined, and the
        behavioural fields exist only where the customer-event spine is on, so
        anything published statically here would be wrong for most tenants.

        `GET /segments/{id}` covers the case where a segment already exists to
        copy. This covers the tenant who has none — which is every tenant on
        their first one.

        `operators` is the half that matters. A behavioural field accepts only
        `within` / `not_within` (and `only_product` where it is product-scoped),
        and guessing from the field name is actively dangerous: the evaluator
        reads any condition it does not recognise as "Happened", so
        `not_contains` on one builds the exact OPPOSITE audience from the one
        the word promises. `null` means the field constrains nothing and takes
        the shared operator set.
      tags: [Segments]
      responses:
        "200":
          description: The filterable fields
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            attribute:
                              type: string
                              example: customer_event.view_item
                            label:
                              type: string
                              example: Viewed an experience
                            operators:
                              type: [array, "null"]
                              items: { type: string }
                              example: [within, not_within, only_product]
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /segments:
    get:
      operationId: listSegments
      summary: List customer segments
      description: |
        The operator's saved audiences.

        A segment is a LIVE RULE, not a saved list: membership is recomputed as
        customers start and stop qualifying, so a count is the answer as of now
        and can move without anyone editing the segment.

        Requires the CRM v2 feature and the `customer_segmentation` plan item;
        a tenant without either gets **404**, not 403 — for them segments do not
        exist.
      tags: [Segments]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Since"
        - name: status
          in: query
          schema: { type: string, enum: [draft, backfilling, active, errored, archived] }
        - name: type
          in: query
          schema: { type: string, enum: [smart, static] }
      responses:
        "200":
          description: Page of segments, each carrying `members_count`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SegmentPage"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    post:
      operationId: createSegment
      summary: Create a smart segment
      description: |
        Creates a SMART segment from a condition tree. Requires `cli:write`.

        **Read an existing segment first.** The legal fields and operators are
        per-tenant — custom attributes are tenant-defined, and behavioural
        fields exist only where the customer-event spine is on — so the
        vocabulary cannot be published here. `GET /segments/{id}` on a segment
        that already works is the reliable way to learn the `conditions` shape.

        Validated in two steps, both of which return **422**: the field and
        operator catalogue (the offending field or operator is named where there
        is one, with the legal alternatives), then the complexity budget. Both
        run in `dry_run` too, so a preview that succeeds is a create that will.

        The first step refuses anything that would compile to NO predicate: a
        leaf naming a field this business unit was not offered, a leaf naming no
        field at all, an operator no evaluator implements, a node whose `type` is
        missing or is neither `filter` nor `group`, and a group whose `filters`
        is a scalar or a string. None of those is an
        error the CALLER sees — the condition is dropped and the segment matches
        everyone it was meant to exclude, or, for an unknown field, the recompute
        job dies and the segment lands `errored` carrying a raw SQLSTATE string
        as its reason — so they are refused at the edge, where the message can
        name the field.

        A leaf with no `condition` key defaults to `contains`, which is what the
        compiler has always done with it. That default is for a STANDARD column:
        a behavioural (`customer_event.*`) field answers its own operator list,
        so the key is not optional there.

        The segment is created with status `backfilling` and a recompute is
        queued; `members_count` is 0 until it finishes. That is not an empty
        segment — it is one that has not been counted yet.

        **A segment is live the moment it exists.** Anything bound to it acts on
        customers as the backfill enrols them, so `dry_run` first.

        Only creation is exposed. Editing a live segment re-baselines its whole
        membership and fires enter/leave on customers who never changed;
        archiving one silently stops every workflow bound to it. Both are done
        in the builder, where a preview count shows the blast radius first.
      tags: [Segments]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSegmentRequest"
      responses:
        "201":
          description: Segment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SegmentMutationResult"
        "200":
          description: Dry run — nothing written
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SegmentMutationResult"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /segments/{id}:
    get:
      operationId: showSegment
      summary: Show a segment
      description: |
        One segment including its full `conditions` tree and the
        `referenced_fields` derived from it — which together are the worked
        example to copy when composing a new one.
      tags: [Segments]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The segment
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Segment" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  /segments/{id}/members:
    get:
      operationId: listSegmentMembers
      summary: List the customers currently in a segment
      description: |
        Paginated, most recently entered first.

        Needs customer-read authority ON TOP of segment-read: the payload is
        full customer PII, and segment access alone must not turn a saved
        audience into an enumeration of people. A caller who may read the
        segment but not its customers gets **403** here and a working
        `GET /segments/{id}`.
      tags: [Segments]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Page of customers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerPage"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /customers:
    get:
      operationId: listCustomers
      summary: List customers
      description: |
        Lists `Customer` rows (the bookings-engine first-class customer model).
        Soft-deletable; pass `?include_trashed=true` to see deleted rows.
      tags: [Customers]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Q"
        - $ref: "#/components/parameters/Since"
        - $ref: "#/components/parameters/IncludeTrashed"
        - name: email
          in: query
          schema: { type: string, format: email, maxLength: 255 }
        - name: country
          in: query
          schema: { type: string, maxLength: 255, description: "ISO 3166-1 alpha-2" }
      responses:
        "200":
          description: Page of customers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerPage"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /customers/{id}:
    get:
      operationId: showCustomer
      summary: Show a customer
      tags: [Customers]
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Customer
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Customer" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  /bookings:
    get:
      operationId: listBookings
      summary: List bookings
      tags: [Bookings]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Since"
        - $ref: "#/components/parameters/IncludeTrashed"
        - name: q
          in: query
          description: |
            Free-text search. Matches a booking id by prefix, a
            `reseller_reference` by prefix, and the booker's name or email by
            substring (a booker that is a Customer, soft-deleted ones
            included; agent- and partner-made bookings match on the first two
            only). `%` and `_` are matched literally. A term matching more
            than 500 customers is refused with 422 rather than truncated;
            narrow it or use `customer_id`. Searching identity requires
            `view_booker_of_booking`: without it the request is refused with
            403 rather than silently narrowed, and the message points at
            `reference`, which needs no such permission.
          schema: { type: string, maxLength: 255 }
        - name: customer_id
          in: query
          description: |
            Bookings whose booker is this customer (the id `/customers` and a
            booking's `customer.id` carry). Needs no identity permission:
            the id is already on every redacted booking.
          schema: { type: string, format: uuid }
        - name: status
          in: query
          description: Alias of `booking_status`, case-insensitive.
          schema: { type: string }
        - name: date_field
          in: query
          description: |
            Which date `from`/`to` bound. `starts_at` (default) is the trip's
            departure; `confirmed_at` and `created_at` are the booking row's
            own timestamps, matching the statistics endpoints.
          schema: { type: string, enum: [starts_at, confirmed_at, created_at], default: starts_at }
        - name: booking_status
          in: query
          description: |
            Filter by computed status. Server translates to SQL conditions on
            `confirmed_at`/`cancelled_at`/`expires_at` (status is an accessor,
            not a column). Selecting `CANCELLED` or `EXPIRED` automatically
            lifts CB's CancellingScope global filter so cancelled rows are
            visible.
          schema: { type: string, enum: [ON_HOLD, CONFIRMED, EXPIRED, CANCELLED] }
        - name: include_cancelled
          in: query
          description: |
            When `true`, lift the CancellingScope global filter so cancelled
            bookings appear in the response. Implied by
            `booking_status=CANCELLED` or `booking_status=EXPIRED`. Default
            scope (no filter, no flag) hides cancelled rows.
          schema: { type: boolean, default: false }
        - name: from
          in: query
          description: Booking start date >= this
          schema: { type: string, format: date }
        - name: to
          in: query
          description: Booking start date <= this
          schema: { type: string, format: date }
        - name: customer_email
          in: query
          description: |
            Exact match on the booker's email. Requires
            `view_booker_of_booking` (403 otherwise), for the same reason as
            `q`. An address shared by more than 500 customers is refused with
            422, like an over-broad `q`. Until 1.15.0 this parameter was documented and ignored, so
            every request returned the unfiltered list.
          schema: { type: string, maxLength: 255 }
        - name: reference
          in: query
          description: |
            Exact match on `reseller_reference`. A reference of `0` filters;
            it used to be read as no filter and answer with every booking.
          schema: { type: string, maxLength: 255 }
        - name: product_option_id
          in: query
          schema: { type: integer, minimum: 1 }
        - name: resource_id
          in: query
          description: |
            Filter to bookings a specific resource is assigned to (via the
            `booking_resource` pivot). Combine with `GET /resources?category=auxiliary`
            to answer "which trips has this auxiliary resource been assigned
            to?" — resolve the resource id from the resources list, then pass
            it here alongside `from`/`to`. Matches active resources only; a
            soft-deleted resource returns no rows.
          schema: { type: integer, minimum: 1 }
        - name: origin_type
          in: query
          description: |
            Filter by the surface that sold the booking, in the same
            vocabulary a booking's own `origin.type` reports. Not the raw
            `provider_type` morph: that block hides the class names on
            purpose, so there would be no response a caller could learn them
            from. A value outside the enum is a 422, not a 200 over the
            unfiltered list.
          schema:
            type: string
            enum: [ota, direct_online, direct_offline, indirect_offline, reseller, other]
        - name: partner_id
          in: query
          description: |
            Bookings involving one partner, matched on **either** side of the
            morph — where the partner is the booking's provider (they sold it)
            or its customer (they are billed for it). Both report
            `origin.type = indirect_offline`, so matching one column alone
            would answer with a subset. A retired (soft-deleted) partner still
            matches; its bookings stay on the books.

            Requires `view_any_partner` (403 otherwise). `GET /partners` is
            the only route from a partner's name to this id, so without the
            permission this filter would be a way to probe for that mapping an
            id at a time. The refusal names `origin_type`, which needs no
            permission. Resolve the id from `GET /partners?q=`.
          schema: { type: integer, minimum: 1 }
        - name: include
          in: query
          description: |
            Optional expansions, as a comma-separated string or a list
            (`include[]=resources`). `resources` is the only value, and it
            enriches each booking row with assigned resources plus a
            `resource_state_token` suitable for stale-state guarded writes. Any
            other value is a 422: a misspelling used to come back as a 200 with
            no resources and nothing saying why. Omit it for the lightest list
            payload.
          schema:
            oneOf:
              - { type: string, enum: [resources] }
              - { type: array, items: { type: string, enum: [resources] } }
      responses:
        "200":
          description: Page of bookings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingPage"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /bookings/{id}:
    get:
      operationId: showBooking
      summary: Show a booking
      description: Inlines guests and most-recent transactions.
      tags: [Bookings]
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Booking
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Booking" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  /bookings/{id}/resources/available:
    get:
      operationId: listAvailableBookingResources
      summary: List available main resources for a booking
      description: |
        Returns booking-specific candidate main resources using the same
        availability and concurrency checks as the back-office resource switcher.
      tags: [Bookings, Resources]
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Candidate main resources
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/AssignedBookingResource" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  /bookings/{id}/resources/auxiliary/available:
    get:
      operationId: listAvailableBookingAuxiliaryResources
      summary: List available auxiliary resources for a booking
      description: |
        Returns booking-specific candidate auxiliary resources for desired-set
        assignment flows.
      tags: [Bookings, Resources]
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Candidate auxiliary resources
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/AssignedBookingResource" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  /bookings/{id}/resources/equipment/available:
    get:
      operationId: listAvailableBookingEquipmentResources
      summary: List available equipment resources for a booking
      description: |
        Returns the booking's product option's EQUIPMENT resources — every
        non-auxiliary resource attached to the option with no pivot capacity.
        These are the ids `equipment_resource_ids` accepts.

        Unlike the main list this runs no availability or concurrency filter,
        and that is deliberate: a null pivot capacity is the statement that the
        resource is not rationed per booking, which is why
        `Booking::attachResources()` attaches all of them to every booking
        unconditionally. Every candidate is therefore always assignable.
      tags: [Bookings, Resources]
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Candidate equipment resources
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/AssignedBookingResource" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  /bookings/{id}/resources:
    post:
      operationId: updateBookingResources
      summary: Update booking resources
      description: |
        Normalized booking-resource mutation surface for CLI and MCP.

        The caller sends the desired booking resource state plus the last-read
        `expected_resource_state_token`. The server rejects stale writes with
        `BOOKING_RESOURCE_STATE_STALE`, rejects invalid resource selections with
        `BOOKING_RESOURCE_CONFLICT`, and commits booking/resource DB state
        atomically. Side effects (notifications, workflows, calendar jobs) are
        emitted after commit.
      tags: [Bookings, Resources]
      parameters:
        - $ref: "#/components/parameters/IdPath"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBookingResourcesRequest"
      responses:
        "200":
          description: Updated (or dry-run preview)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: "#/components/schemas/MutationResult"
                          - type: object
                            properties:
                              resource_state_token:
                                type: string
                                description: Current aggregate booking resource state token after the operation.
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            `BOOKING_RESOURCE_STATE_STALE` or `BOOKING_RESOURCE_CONFLICT`, or a
            normal CLI idempotency conflict.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422": { $ref: "#/components/responses/ValidationError" }

  /bookings/{id}/transactions:
    get:
      operationId: listBookingTransactions
      summary: List transactions for a booking
      tags: [Bookings, Transactions]
      parameters:
        - $ref: "#/components/parameters/IdPath"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Since"
      responses:
        "200":
          description: Transactions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionPage"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /bookings/{id}/cancel:
    post:
      operationId: cancelBooking
      summary: Cancel a booking
      description: |
        External side effects: Stripe (refund per `refund_policy`), mailer
        (when `notify_customer: true`). On dry-run, returns the cancellation
        policy preview + estimated refund without contacting Stripe or
        sending mail.
      tags: [Bookings]
      parameters:
        - $ref: "#/components/parameters/IdPath"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelBookingRequest"
      responses:
        "200":
          description: Cancelled (or dry-run preview)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: "#/components/schemas/MutationResult"
                          - type: object
                            properties:
                              refund_amount: { type: integer }
                              policy_applied: { type: string }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            An idempotency conflict — see
            `#/components/responses/IdempotencyConflict`, which enumerates
            `IDEMPOTENCY_CONFLICT`, `IDEMPOTENCY_IN_PROGRESS` (retriable) and
            `IDEMPOTENCY_UNKNOWN` (reconcile by hand) — or one of these domain
            refusals:
            - `NO_CHARGE_FOUND` — `refund_policy: partial` was asked for on a
              booking with no refundable Stripe charge. **Only `partial` is
              refused this way.** `refund_policy: full` has no equivalent guard:
              on a booking with nothing refundable it SUCCEEDS, allocating
              nothing, and returns `refund_amount: 0` with
              `policy_applied: full`. Do not read a 200 there as money moved —
              read `refund_amount`.
            - `BOOKING_ALREADY_CANCELLED` — the booking is already cancelled.
            - `REFUND_AMOUNT_EXCEEDS_CHARGE` — `refund_amount` is more than the
              remaining refundable balance on the target charge.

            Match on `error.code`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          description: |
            Ordinary validation failure (see
            `#/components/responses/ValidationError`), or
            `POLICY_AUTO_NOT_READY` — `refund_policy: auto` is not implemented;
            pass an explicit `none`, `full` or `partial`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /bookings/{id}/refund:
    post:
      operationId: refundBooking
      summary: Refund a booking transaction (full or partial)
      description: "External side effects: Stripe, mailer."
      tags: [Bookings]
      parameters:
        - $ref: "#/components/parameters/IdPath"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefundBookingRequest"
      responses:
        "200":
          description: Refunded (or dry-run preview)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: "#/components/schemas/MutationResult"
                          - type: object
                            properties:
                              transaction: { $ref: "#/components/schemas/Transaction" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            An idempotency conflict — see
            `#/components/responses/IdempotencyConflict`, which enumerates
            `IDEMPOTENCY_CONFLICT`, `IDEMPOTENCY_IN_PROGRESS` (retriable) and
            `IDEMPOTENCY_UNKNOWN` (reconcile by hand) — or one of these domain
            refusals:
            - `REFUND_REQUIRES_STRIPE_CHARGE` — the selected transaction is not a
              Stripe charge and the booking does carry a non-Stripe payment. The
              CLI refund flow handles Stripe charges only; settle a cash or
              voucher booking through the gift/cash refund path instead.
            - `NO_CHARGE_FOUND` — no Stripe charge matched, and the booking
              carries no non-Stripe payment either. Two things do NOT land here:
              a charge that is already fully refunded still matches, so that is
              `REFUND_AMOUNT_EXCEEDS_CHARGE`; and on a booking that also holds a
              non-Stripe payment the refusal is `REFUND_REQUIRES_STRIPE_CHARGE`
              instead. Neither code validates `transaction_id` against the
              booking — there is no `exists:` rule on it — so an id matching
              nothing selects no charge and yields whichever of these two the
              booking's other payments imply. Check the id before concluding
              nothing was captured.
            - `REFUND_AMOUNT_EXCEEDS_CHARGE` — `amount` is more than the remaining
              refundable balance on the charge. The commonest refusal on this verb.

            Match on `error.code`. The domain codes are dead ends for the request
            as sent, where `IDEMPOTENCY_IN_PROGRESS` is worth retrying.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422": { $ref: "#/components/responses/ValidationError" }

  /bookings/{id}/comp:
    post:
      operationId: compBooking
      summary: Comp a booking (zero-out, no Stripe)
      description: |
        Marks the booking as comped. No Stripe call (the transaction is
        recorded as a `comp` type, no money movement). Mailer fires when
        `notify_customer: true`.
      tags: [Bookings]
      parameters:
        - $ref: "#/components/parameters/IdPath"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 500 }
                notify_customer: { type: boolean, default: false }
                dry_run: { type: boolean, default: false }
      responses:
        "200":
          description: Comped (or dry-run preview)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/MutationResult" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/IdempotencyConflict" }

  /bookings/{id}/notifications/resend-confirmation:
    post:
      operationId: resendBookingConfirmation
      summary: Resend the booking confirmation
      description: "External side effects: mailer (or SMS provider when channel=sms)."
      tags: [Notifications, Bookings]
      parameters:
        - $ref: "#/components/parameters/IdPath"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                channel:
                  type: string
                  enum: [email, sms]
                  default: email
                recipient:
                  type: string
                  description: Override email/phone (otherwise booking's primary contact)
                dry_run: { type: boolean, default: false }
      responses:
        "200":
          description: Sent (or dry-run preview)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: "#/components/schemas/MutationResult"
                          - type: object
                            properties:
                              notification_id: { type: string }
                              channel: { type: string }
                              sent_at: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/IdempotencyConflict" }

  /transactions:
    get:
      operationId: listTransactions
      summary: List transactions
      tags: [Transactions]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Since"
        - $ref: "#/components/parameters/IncludeTrashed"
        - name: type
          in: query
          description: |
            `refund` is a row with a `refund_for`; `charge` is any other.
            There is no `status` filter: a transaction row is only ever
            written for a payment that succeeded, so there is nothing for it
            to select (until 1.15.0 it was documented and ignored).
          schema: { type: string, enum: [charge, refund] }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Page of transactions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionPage"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /transactions/{id}:
    get:
      operationId: showTransaction
      summary: Show a transaction
      tags: [Transactions]
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Transaction
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Transaction" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  /answers:
    get:
      operationId: listAnswers
      summary: List answers to custom booking questions
      description: |
        Cross-booking read of what customers answered. `GET /bookings/{id}`
        already returns one booking's answers inline; this exists for the
        manifest-shaped question — "what are tomorrow's dietary requirements
        across every booking on the 09:00 departure?" — which would otherwise
        cost one call per booking.

        Requires `view_answers_of_booking` in addition to `view_any_booking`.
        This is guest PII (passport numbers, dates of birth, nationalities,
        dietary and medical notes), not inventory data, and it is gated
        separately for that reason. A caller restricted to `view_own_booking`
        sees only answers on the trips they are assigned to, matching
        `GET /bookings`.
      tags: [Bookings]
      parameters:
        - { in: query, name: booking_id, schema: { type: string }, description: "Answers on one booking." }
        - { in: query, name: question_id, schema: { type: integer }, description: "Answers to one question, across bookings." }
        - in: query
          name: granularity
          schema: { type: string, enum: [booking, guest, extra] }
          description: "Filter by the linked question's granularity. See `Question.granularity`."
        - { in: query, name: product_option_id, schema: { type: integer }, description: "Answers on bookings for one product option." }
        - in: query
          name: from
          schema: { type: string, format: date-time }
          description: |
            Inclusive lower bound on the trip's DEPARTURE, not on when the
            answer was written. Interpreted in the tenant's timezone, or in the
            product's when `product_option_id` narrows the query to one — the
            same rule `GET /bookings?date_field=starts_at` follows, because
            `availabilities.from` stores product-local wall clock.
        - in: query
          name: to
          schema: { type: string, format: date-time }
          description: "Exclusive upper bound on the trip's departure. See `from`."
        - in: query
          name: since
          schema: { type: string, format: date-time }
          description: "Answers updated at or after this instant. Unlike `from`/`to` this is a genuine UTC bound against `updated_at`."
        - in: query
          name: include_trashed
          schema: { type: boolean, default: false }
          description: |
            Include answers to retired questions. `Question` soft-deletes and
            cascade-soft-deletes its answers, so retiring a custom question
